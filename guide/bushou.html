 var a=PC_RAW.split(";");

   o[PC_COLS[j]]=PC_V[j][n]||""; }

/* ===== 家紋 本物の形（紋帳に合わせる）=====
   100×100 の升、真ん中 (50,50)。塗りは evenodd（重ねた所が抜ける）。 */
var C=50;
function f(n){ return Math.round(n*100)/100; }
function pt(a,r,cx,cy){ return [ (cx===undefined?C:cx)+Math.cos(a)*r, (cy===undefined?C:cy)+Math.sin(a)*r ]; }
function M(p){ return 'M'+f(p[0])+','+f(p[1]); }
function L(p){ return 'L'+f(p[0])+','+f(p[1]); }
function Cc(a,b,c){ return 'C'+f(a[0])+','+f(a[1])+' '+f(b[0])+','+f(b[1])+' '+f(c[0])+','+f(c[1]); }
function Q(a,b){ return 'Q'+f(a[0])+','+f(a[1])+' '+f(b[0])+','+f(b[1]); }
function circle(cx,cy,r){ return 'M'+f(cx-r)+','+f(cy)+'a'+f(r)+','+f(r)+' 0 1,0 '+f(r*2)+',0a'+f(r)+','+f(r)+' 0 1,0 '+f(-r*2)+',0Z'; }
function ringP(r,w,cx,cy){ return circle(cx===undefined?C:cx,cy===undefined?C:cy,r)+circle(cx===undefined?C:cx,cy===undefined?C:cy,r-w); }
function polyP(pts){ return 'M'+pts.map(function(q){return f(q[0])+','+f(q[1]);}).join('L')+'Z'; }
function diamond(cx,cy,rw,rh){ return polyP([[cx,cy-rh],[cx+rw,cy],[cx,cy+rh],[cx-rw,cy]]); }
function rectP(x,y,w,h){ return polyP([[x,y],[x+w,y],[x+w,y+h],[x,y+h]]); }
var TAU=Math.PI*2, D=Math.PI/180;

/* 花びら（根元 r0・先 r1・開き ang・向き a） */
function petalP(a,r0,r1,ang,cx,cy){
  var A=pt(a,r0,cx,cy), T=pt(a,r1,cx,cy);
  var l1=pt(a-ang,r0+(r1-r0)*0.12,cx,cy), l2=pt(a-ang*0.92,r1*0.98,cx,cy);
  var r2=pt(a+ang*0.92,r1*0.98,cx,cy), r1p=pt(a+ang,r0+(r1-r0)*0.12,cx,cy);
  return M(A)+Cc(l1,l2,T)+Cc(r2,r1p,A);
}
/* 木瓜の外郭（瓜を n 個。notch から膨らんで notch へ） */
function mokkoOutline(n,rn,ra,bulge){
  var s='';
  for(var i=0;i<n;i++){
    var a=-Math.PI/2+i*TAU/n, h=Math.PI/n;
    var p0=pt(a-h,rn), p1=pt(a,ra), p2=pt(a+h,rn);
    var c1=pt(a-h*0.86,ra*bulge), c2=pt(a-h*0.3,ra*1.02);
    var c3=pt(a+h*0.3,ra*1.02), c4=pt(a+h*0.86,ra*bulge);
    s+=M(p0)+Cc(c1,c2,p1)+Cc(c3,c4,p2)+'Z';
  }
  /* 谷を埋める内側の円（外郭を一つながりに見せる） */
  s+=circle(C,C,rn*1.02);
  return s;
}

var K={};

/* 織田木瓜：外に五つ（織田は五瓜）…ではなく四つ瓜＋唐花。写真に合わせて五弁の花を内に */
K.mokko=function(){
  var s='';
  /* 外の瓜（四つ） */
  for(var i=0;i<4;i++){
    var a=-Math.PI/2+i*TAU/4, h=Math.PI/4;
    var p0=pt(a-h*0.96,27), p2=pt(a+h*0.96,27);
    var c1=pt(a-h*0.9,46), c2=pt(a-h*0.34,48);
    var c3=pt(a+h*0.34,48), c4=pt(a+h*0.9,46);
    s+=M(p0)+Cc(c1,c2,pt(a,47))+Cc(c3,c4,p2)+'Z';
  }
  s+=circle(C,C,28.5);        /* 外の瓜をつなぐ輪（黒） */
  s+=circle(C,C,25.5);        /* 内は白 */
  /* 内の唐花（五弁） */
  for(var k=0;k<5;k++) s+=petalP(-Math.PI/2+k*TAU/5, 6.5, 22.5, 0.36*Math.PI/1.6);
  s+=circle(C,C,6.2);         /* 芯（黒） */
  s+=circle(C,C,2.6);         /* 芯の抜き */
  return s;
};

};

      +Cc([bx-w*0.5,by-h*0.18],[tx-w,ty+h*0.42],[tx-w*0.34,ty+h*0.06])

/* 五本骨扇（佐竹） */
K.ogi=function(){

  for(var i=1;i<5;i++){ var a=a0+(a1-a0)*i/5; var q=pt(a,R*0.99,apex[0],apex[1]);

/* 三つ盛亀甲（浅井） */

};
/* 三つ葉葵（徳川） */
K.aoi=function(){

      +Cc([cx+co*15+si*w*0.92, cy+si*15-co*w*0.92],[cx+si*w-co*6, cy-co*w-si*6],inn)+'Z';

 "赤鉢巻または鹿角・六文銭意匠":["suji","kazuno"], "金の前立、軽快な兜":["momo","small"],
 "金扇・日輪系の華やかな兜":["momo","ogi"], "頭巾または簡素な兜":["zukin","none"],
 "頭巾・烏帽子系":["eboshi","none"], "頭形兜＋簡潔な脇立":["zunari","wakidate"],
 "鹿角脇立の黒兜":["suji","kazuno"], "黒兜＋巨大な金の三日月前立":["suji","mikazuki"],
 "黒兜＋白毛の後立":["tokkai","plume"], "黒兜＋金の立物":["suji","tate"],
 "黒漆兜＋金の大きな前立":["nanban","kiri3"], "黒漆塗兜＋小型の金前立":["suji","small"]
};
/* 家紋・意匠 → 紋の形 */
const MONM={ "三つ葉葵系の意匠":"aoi","葵系意匠":"aoi","桐紋系":"kiri","桐紋・瓢箪系":"kiri",
 "武田菱":"hishi","三階菱系":"hishi3","六文銭":"rokumon","十文字系":"juji","桔梗紋":"kikyo",
 "一文字三星系":"ichimonji","三つ鱗":"uroko","七つ酢漿草系":"katabami","三つ盛亀甲系":"kikkou",
 "三つ盛木瓜系":"mokkou","織田木瓜系":"mokkou","下り藤・法具意匠":"fuji","竹に雀系":"take",
 "竹に雀・九曜系":"kuyo","剣花菱系":"kenhanabishi","向鶴系":"tsuru","梅鉢系":"umebachi",
 "丸に二つ引系":"hikiryo","抱き杏葉系":"gyoyo","赤鳥系":"akatori","大一大万大吉系":"moji",
 "二頭波系":"nami","扇月系":"ogimon","丸紋・菱・引両系意匠":"hikiryo" };
/* 言葉で決まらないもの（簡潔な幾何意匠・家名由来の抽象紋・植物幾何）は、家ごとに一つ選ぶ */
const GEN_GEO=["hikiryo","tomoe","janome","mitsuboshi","hishi","kikkou","uroko","kenhanabishi"];
const GEN_PLANT=["umebachi","katabami","mokkou","kikyo","fuji","gyoyo","kenhanabishi"];
function monOf(r,H){
 const m=MONM[r["家紋・意匠"]]; if(m) return m;
 const hc=hash(r["所属"]||"");
 if(/植物/.test(r["家紋・意匠"]||"")) return GEN_PLANT[hc%GEN_PLANT.length];
 return GEN_GEO[hc%GEN_GEO.length];
}
const POSE={"胸上・やや右向き":1,"胸上・やや左向き":-1,"胸上・正面寄り":0};
const EXPR=(t)=>{
 if(/猛|豪胆|勇猛|不屈|勇壮/.test(t)) return {mouth:"firm",eye:"fierce"};
 if(/冷静|理知|理詰|策|老獪|思索/.test(t)) return {mouth:"thin"};
 if(/笑み|快活|洒落|愛嬌|機転/.test(t)) return {mouth:"wide"};
 if(/慎重|我慢|警戒|実直|落ち着/.test(t)) return {mouth:"down"};
 return {};
};
function hash(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619);} return (h>>>0); }

function toParams(r){
 const H=hash(r["武将名"]);
 const f=Object.assign({}, FACE[r["顔型"]]||{w:1,len:1,eye:"calm"});
 Object.assign(f, EYE[r["目・眉"]]||{});
 Object.assign(f, EXPR(r["表情"]||""));
 f.age=AGE[r["年齢感"]]!==undefined?AGE[r["年齢感"]]:.45;
 f.beard=BEARD[r["髭"]]||"must";
 if(/白混じり/.test(r["髭"])) f.age=Math.max(f.age,.8);
 if(!f.brow) f.brow=(H%3===0)?"thick":(H%3===1)?"thin":"arch";
 if(!f.nose) f.nose=["straight","broad","small","hook"][H%4];
 if(!f.mouth) f.mouth=["firm","thin","wide","down"][(H>>3)%4];
 /* 同じ家で似すぎないよう、名から少し散らす */
 f.w=(f.w||1)*(0.96+((H>>5)%9)/100);
 f.len=(f.len||1)*(0.97+((H>>9)%7)/100);
 if(f.cheek===undefined) f.cheek=((H>>13)%10)/14;
 const hair=HAIR[r["髪型"]]||"mage";
 if(hair==="sakayaki") f.sakayaki=1;
 const cols=(r["甲冑配色"]||"黒・赤・金").split("・");
 let dou=cc(cols[0],"#1e1e1e"); const kata=cc(cols[1],"#3a3126"), acc=cc(cols[2],"#c8a33c");
 { const sh=((H>>21)%7)-3; if(sh){ dou="#"+dou.slice(1).match(/../g).map(x=>{ let v=parseInt(x,16)+sh*5; v=Math.max(8,Math.min(245,v)); return v.toString(16).padStart(2,"0"); }).join(""); } }
 let kb=KAB[r["兜・頭装備"]]||["suji","small"];
 /* 一般の将は、家の決まりを保ったまま鉢の形だけ散らす（同じ家で全員同じ兜に見えないように） */
 if(/^C/.test(r["重要度"]||"") && kb[0]!=="zukin" && kb[0]!=="eboshi" && kb[0]!=="suwa"){
  const bowls=["suji","zunari","momo","tokkai","suji","zunari"];
  kb=[bowls[(H>>11)%bowls.length], kb[1]];
  if(((H>>17)%5)===0) kb[1]=["small","monmae","tate","wakidate","kiri3"][(H>>19)%5];
 }
 const monT=monOf(r,H);
 const ito=/金/.test(cols[2])?"#d8b355":/銀/.test(cols[2])?"#c3c8cd":acc;
 /* 陣羽織：主要・重要・有力の将、および一部の将に。家の差し色から取る */
 const rank=String(r["重要度"]||"");
 const haori = (/^S|^A|^B/.test(rank) || ((H>>23)%4===0)) ? (cc(cols[1],"#3a3126")===dou ? acc : cc(cols[1],"#3a3126")) : "";
 return { n:r["武将名"], y:"", c:r["所属"], haori:haori, pose:POSE[r["構図"]]!==undefined?POSE[r["構図"]]:0,
  k:kb[0], kc:(kb[0]==="zukin")?"#f3efe6":(kb[0]==="eboshi")?"#17161a":dou, m:kb[1], mc:/銀/.test(cols[2])?"#c3c8cd":"#d8b355",
  ito:ito, dou:dou, kata:kata, skin:["#eecfab","#e8c79f","#f2d6b2","#e3c095"][H%4],
  mon:monT, hair:["#1d1713","#241c15","#2a2018"][(H>>7)%3], face:f, rank:r["重要度"] };
}


var PC_CACHE={};
window.pcHas=function(name){ return !!pcRows()[name]; };
window.pcList=function(){ var R=pcRows(), out=[]; for(var k in R) out.push([k, R[k]["所属"]||"", R[k]["年齢感"]||""]); return out; };
window.pcCardSVG=function(name, mode){
 var key=name+"|"+(mode||"full");
 if(PC_CACHE[key]) return PC_CACHE[key];
 var r=pcRows()[name]; if(!r) return null;
 var o={}; for(var q in r) o[q]=r[q]; o["武将名"]=name; if(!o["重要度"]) o["重要度"]="C（一般武将）";
 var g=toParams(o);
 var s=card(g, Math.abs(hash(name))%997);
 s=s.replace(/\d+\.\d{2,}/g, function(m){ return (+m).toFixed(1); });
 if(mode==="sq") s=s.replace('viewBox="0 0 300 400"','viewBox="40 96 220 220"');
 PC_CACHE[key]=s; return s; };
window.pcCardURL=function(name, mode){
 var s=window.pcCardSVG(name, mode); if(!s) return null;
 return "data:image/svg+xml;charset=utf-8,"+encodeURIComponent(s); };
})();
</script>
<script>
(function(){
 var L=window.pcList(), grid=document.getElementById('g'), q=document.getElementById('q'), cl=document.getElementById('cl'), cnt=document.getElementById('cnt'), none=document.getElementById('none');
 var clans=[]; L.forEach(function(r){ if(clans.indexOf(r[1])<0) clans.push(r[1]); });
 clans.sort().forEach(function(c){ var o=document.createElement('option'); o.value=c; o.textContent=c; cl.appendChild(o); });
 var io=new IntersectionObserver(function(es){ es.forEach(function(e){ if(!e.isIntersecting) return; var el=e.target; io.unobserve(el);
   var nm=el.dataset.n; var s=window.pcCardSVG(nm); if(s){ var ph=el.querySelector('.ph'); if(ph) ph.outerHTML=s; } }); },{rootMargin:'300px'});
 function draw(){
  var t=(q.value||'').trim(), c=cl.value;
  var list=L.filter(function(r){ return (!t||r[0].indexOf(t)>=0) && (!c||r[1]===c); });
  grid.innerHTML=''; none.hidden=list.length>0; cnt.textContent=list.length+'人';
  var frag=document.createDocumentFragment();
  list.slice(0,600).forEach(function(r){
   var d=document.createElement('div'); d.className='card'; d.dataset.n=r[0];
   d.innerHTML='<div class="ph"></div><div class="cap"><b>'+r[0]+'</b><span>'+r[1]+'　'+r[2]+'</span></div>';
   frag.appendChild(d); io.observe(d); });
  grid.appendChild(frag);
  if(list.length>600) cnt.textContent=list.length+'人（はじめの600人を表示。家で絞るか名で探してください）';
 }
 q.addEventListener('input',draw); cl.addEventListener('change',draw); draw();
})();
</script>
