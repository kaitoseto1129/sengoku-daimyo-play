<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>戦国大名 管理</title>
<style>
:root{ --bg:#17150F; --card:#221E16; --line:#3A3326; --ink:#EDE6D6; --dim:#A79E8C; --kin:#C9A227; --ai:#5B8DEF; --shu:#E24A3A; --moe:#4CC45C; }
*{ box-sizing:border-box; }
body{ margin:0; background:var(--bg); color:var(--ink); font-family:"Hiragino Sans","Zen Kaku Gothic New",sans-serif; font-size:14px; }
header{ display:flex; align-items:center; gap:14px; padding:12px 18px; border-bottom:1px solid var(--line); background:#1B1811; position:sticky; top:0; z-index:2; }
header h1{ font-size:17px; margin:0; letter-spacing:.08em; }
header .sub{ color:var(--dim); font-size:12px; margin-left:auto; }
main{ max-width:1100px; margin:0 auto; padding:16px; }
.grid{ display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); }
.card{ background:var(--card); border:1px solid var(--line); border-radius:8px; padding:14px 16px; }
.card h2{ font-size:13px; color:var(--dim); margin:0 0 8px; font-weight:600; letter-spacing:.05em; }
.big{ font-size:30px; font-weight:800; font-variant-numeric:tabular-nums; }
.big small{ font-size:12px; color:var(--dim); font-weight:500; margin-left:6px; }
.row{ display:flex; justify-content:space-between; align-items:center; padding:5px 0; border-bottom:1px dashed var(--line); font-variant-numeric:tabular-nums; }
.row:last-child{ border-bottom:none; }
.row .n{ font-weight:700; }
.bar{ height:6px; background:#0F0D09; border-radius:3px; overflow:hidden; margin-top:3px; }
.bar i{ display:block; height:100%; background:var(--kin); }
.muted{ color:var(--dim); font-size:12px; }
.sec{ margin-top:18px; }
.sec h2{ font-size:15px; margin:0 0 8px; }
.tabs{ display:flex; gap:6px; margin-left:8px; }
.tabs button{ background:#0F0D09; color:var(--ink); border:1px solid var(--line); border-radius:6px; padding:5px 10px; cursor:pointer; font-size:12px; }
.tabs button.on{ background:var(--kin); color:#1A1208; border-color:var(--kin); font-weight:700; }
svg{ width:100%; height:auto; display:block; }
.funnel{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:8px; }
.funnel .st{ background:#0F0D09; border-radius:6px; padding:10px; text-align:center; }
.funnel .st b{ display:block; font-size:22px; }
.funnel .st span{ font-size:11px; color:var(--dim); }
.funnel .st em{ display:block; font-style:normal; font-size:11px; color:var(--kin); margin-top:2px; }
#gate{ position:fixed; inset:0; background:var(--bg); display:flex; align-items:center; justify-content:center; z-index:9; }
#gate form{ background:var(--card); border:1px solid var(--line); border-radius:10px; padding:26px 28px; width:min(92vw,360px); display:flex; flex-direction:column; gap:10px; }
#gate input{ background:#0F0D09; color:var(--ink); border:1px solid var(--line); border-radius:6px; padding:10px; font-size:15px; }
#gate button{ background:var(--kin); color:#1A1208; border:none; border-radius:6px; padding:11px; font-weight:800; font-size:15px; cursor:pointer; }
#gate .err{ color:var(--shu); font-size:12px; min-height:16px; }
a{ color:var(--ai); }
.note{ background:#0F0D09; border-radius:6px; padding:10px 12px; font-size:12px; color:var(--dim); line-height:1.6; }
</style>
</head>
<body>
<div id="gate"><form id="loginForm">
  <div style="font-size:18px;font-weight:800;letter-spacing:.1em">戦国大名　管理</div>
  <input id="em" type="email" placeholder="メールアドレス" autocomplete="username" required>
  <input id="pw" type="password" placeholder="合言葉" autocomplete="current-password" required>
  <button type="submit">入る</button>
  <div class="err" id="gateErr"></div>
</form></div>

<header>
  <h1>戦国大名　管理</h1>
  <div class="tabs" id="rangeTabs"><button data-r="d7">7日</button><button data-r="d30" class="on">30日</button><button data-r="d90">90日</button></div>
  <div class="sub" id="updated">読み込み中…</div>
</header>
<main id="main"></main>

<script>
/* 入口：合言葉は手元で照らし合わせる（軽い鍵。数字だけの画面なのでこれで十分）。通れば三十日おぼえる */
/* 第253巡（作り手：管理画面に人を追加できるように）：入れる人の一覧。足すときは下の「人を足す」で作った行をここに加える（合言葉そのものは置かない） */
const USERS=[
  {email:"kaitoseto1129@gmail.com", hash:"57f3833bb5286c81572f087fc31cae5f081e8e7001462e05312832163de6dfc3", name:"作り手"},
];
async function sha256(s){ const b=await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join(""); }
function opened(){ try{ const t=+localStorage.getItem("sd_admin_ok")||0; return Date.now()-t<30*864e5; }catch(e){ return false; } }
document.getElementById("loginForm").onsubmit=async e=>{ e.preventDefault(); const em=document.getElementById("em").value.trim().toLowerCase(); const h=await sha256(document.getElementById("pw").value);
  const u=USERS.find(x=>x.email.toLowerCase()===em && x.hash===h);
  if(u){ try{ localStorage.setItem("sd_admin_ok", String(Date.now())); localStorage.setItem("sd_admin_who", u.name||em); }catch(_){ } document.getElementById("gate").style.display="none"; load(); }
  else document.getElementById("gateErr").textContent="メールアドレスか合言葉が違います"; };
if(opened()){ document.getElementById("gate").style.display="none"; }
const _load0=load; load=async function(){ await _load0(); try{ if(!document.getElementById("nuGo")) document.getElementById("main").appendChild(usersCard()); }catch(_){ } };

let DATA=null, RANGE="d30";
document.querySelectorAll("#rangeTabs button").forEach(b=>b.onclick=()=>{ RANGE=b.dataset.r; document.querySelectorAll("#rangeTabs button").forEach(x=>x.classList.toggle("on",x===b)); render(); });
/* 人を足す：ここで合言葉の指紋（SHA-256）を作り、その行を作り手に渡す（か admin/index.html の USERS に足す）。合言葉そのものはどこにも送らない */
function usersCard(){ const el=document.createElement("div"); el.className="card"; el.innerHTML=`<h2>入れる人</h2><div class="note">いま入れる人：${USERS.map(u=>`<b>${u.name||""}</b>（${u.email}）`).join("、")}</div>
  <div class="note" style="margin-top:8px">人を足す：メールアドレスと合言葉を入れて「行を作る」。出てきた一行を作り手へ渡すと、次の版から入れます。合言葉そのものは送られません（指紋だけ）。</div>
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><input id="nuEm" type="email" placeholder="メールアドレス" style="flex:1;min-width:200px;padding:8px 10px;border-radius:6px;border:1px solid #3a3020;background:#0F0D09;color:#EDE6D6"><input id="nuNm" placeholder="呼び名（例：広告担当）" style="flex:1;min-width:140px;padding:8px 10px;border-radius:6px;border:1px solid #3a3020;background:#0F0D09;color:#EDE6D6"><input id="nuPw" type="password" placeholder="合言葉" style="flex:1;min-width:140px;padding:8px 10px;border-radius:6px;border:1px solid #3a3020;background:#0F0D09;color:#EDE6D6"><button id="nuGo" style="padding:8px 14px;border-radius:6px;border:1px solid #C9A227;background:#C9A227;color:#1A1208;font-weight:800;cursor:pointer">行を作る</button></div>
  <pre id="nuOut" style="margin-top:10px;white-space:pre-wrap;word-break:break-all;background:#0F0D09;padding:10px;border-radius:6px;font-size:12px;color:#FFD166;display:none"></pre>`;
  el.querySelector("#nuGo").onclick=async()=>{ const em=el.querySelector("#nuEm").value.trim().toLowerCase(), nm=el.querySelector("#nuNm").value.trim(), pw=el.querySelector("#nuPw").value; if(!em||!pw){ alert("メールアドレスと合言葉を"); return; } const h=await sha256(pw); const line=`  {email:"${em}", hash:"${h}", name:"${nm||em}"},`; const o=el.querySelector("#nuOut"); o.style.display="block"; o.textContent=line+"\n\n↑ この一行をコピーして作り手へ（目安箱でも可）。admin/index.html の USERS に足せば入れるようになります"; try{ await navigator.clipboard.writeText(line); o.textContent+="\n（コピーしました）"; }catch(_){ } el.querySelector("#nuPw").value=""; };
  return el; }
async function load(){
  try{ const r=await fetch("stats.json?t="+Date.now(), {cache:"no-store"}); if(!r.ok) throw new Error(r.status); DATA=await r.json(); }
  catch(e){ document.getElementById("main").innerHTML=`<div class="card"><h2>まだ数がありません</h2><div class="note">stats.json がまだ作られていません。GitHub の <b>sengoku-daimyo-play</b> リポジトリで、<br>① Settings → Secrets and variables → Actions に <b>GOATCOUNTER_TOKEN</b>（GoatCounter の Settings → API tokens で「Read statistics」を付けて作った鍵）を入れる<br>② Actions → <b>stats</b> → Run workflow を一度押す<br>あとは六時間ごとに勝手に更新されます。</div></div>`; return; }
  document.getElementById("updated").textContent="更新 "+new Date(DATA.generated).toLocaleString("ja-JP");
  render();
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmtN=n=>Number(n||0).toLocaleString("ja-JP");
function sumStats(h){ return (h.stats||[]).reduce((s,d)=>s+(d.daily||0),0); }
function render(){
  if(!DATA) return; const R=DATA.ranges[RANGE]; if(!R){ return; }
  const hits=(R.hits||[]); const tot=R.total||{};
  let days=(tot.stats||[]).map(d=>({day:d.day, n:d.daily||0}));
  if(!days.length){ const m={}; for(const h of hits){ if(h.event) continue; for(const d of (h.stats||[])) m[d.day]=(m[d.day]||0)+(d.daily||0); } days=Object.keys(m).sort().map(k=>({day:k,n:m[k]})); }   /* 総数が取れなければ、道ごとの数から日ごとに足す */
  /* 第253巡（作り手）：GoatCounter の総数は出来事（ev/…）も含む。人の数は「ページを開いた数」で見る（総数−出来事）。
     日ごとの線も出来事を除いた数に（広告の日に四倍に見えていた） */
  const evTot=+(tot.total_events||0), rawTot=days.reduce((s,d)=>s+d.n,0);
  const evByDay={}; for(const h of hits){ if(!h.event) continue; for(const d of (h.stats||[])) evByDay[d.day]=(evByDay[d.day]||0)+(d.daily||0); }
  days=days.map(d=>({day:d.day, n:Math.max(0,d.n-(evByDay[d.day]||0))}));
  const visits=(rawTot&&evTot)?Math.max(0,rawTot-evTot):days.reduce((s,d)=>s+d.n,0);
  const ev=p=>hits.filter(h=>h.event && h.path.startsWith("ev/"+p)).reduce((s,h)=>s+sumStats(h),0);
  const byPrefix=p=>{ const m={}; for(const h of hits){ if(!h.event||!h.path.startsWith("ev/"+p+"/")) continue; const rest=h.path.slice(("ev/"+p+"/").length); m[rest]=(m[rest]||0)+sumStats(h); } return Object.entries(m).sort((a,b)=>b[1]-a[1]); };
  const act=ev("activation/first-battle-complete"), adClicks=byPrefix("src").filter(([k])=>/^meta/.test(k)).reduce((a,[,n])=>a+n,0)||ev("src/meta");
  const loadFast=ev("load/1s"), load3=ev("load/3s"), loadSlow=ev("load/8s")+ev("load/slow"), loadTot=loadFast+load3+loadSlow;
  const starts=ev("start"), battles=ev("battle"), results=ev("result"), unlocks=ev("unlock"), fundOpen=ev("fund/open"), fundClick=ev("fund-click"), payClick=ev("pay-click"), fundDone=byPrefix("fund").filter(([k])=>k!=="open");
  const pages=hits.filter(h=>!h.event);
  const pageviews=pages.reduce((s,h)=>s+sumStats(h),0);
  const pct=(a,b)=>b?Math.round(a/b*100)+"%":"—";
  // 遊び始めの内訳：筋書き／家
  const scen={}, clans={}; for(const [k,n] of byPrefix("start")){ const [sc,cl]=k.split("/"); scen[sc]=(scen[sc]||0)+n; if(cl) clans[cl]=(clans[cl]||0)+n; }
  const resultKinds={}, resultScen={}; for(const [k,n] of byPrefix("result")){ const [kind,sc]=k.split("/"); resultKinds[kind]=(resultKinds[kind]||0)+n; if(sc) resultScen[sc]=(resultScen[sc]||0)+n; }
  const battleKinds={}; for(const [k,n] of byPrefix("battle")){ battleKinds[k]=(battleKinds[k]||0)+n; }
  /* 名の札：筋書きの id と会戦の種類は日本語で（nagashino → 長篠の戦い） */
  const JA={oke:"桶狭間の戦い",honnoji:"本能寺の変",kiyosu:"清洲会議",shizugatake:"賤ヶ岳の戦い",komaki:"小牧・長久手の戦い",koshu:"甲州征伐",sekigahara:"関ヶ原の戦い",osaka:"大坂の陣",hoi:"信長包囲網",mikata:"三方ヶ原の戦い",nagashino:"長篠の戦い",kyushu:"九州征伐",odawara:"小田原征伐",ishiyama:"石山合戦",decisive:"決戦",siege:"城攻め",field:"野戦",word:"合言葉",open:"札を開いた"};
  const ja=k=>JA[k]||k;
  const list=(obj,label,max)=>{ const es=Object.entries(obj).sort((a,b)=>b[1]-a[1]).slice(0,max||12); const top=es.length?es[0][1]:1; if(!es.length) return `<div class="muted">まだありません</div>`; return es.map(([k,n])=>`<div class="row"><span>${esc(ja(k))}</span><span class="n">${fmtN(n)}</span></div><div class="bar"><i style="width:${Math.round(n/top*100)}%"></i></div>`).join(""); };
  const SZ={phone:"スマホ",tablet:"タブレット",desktop:"パソコン",desktophd:"大きな画面",unknown:"（不明）"};   /* 第253巡：画面の大きさは名が空で返るので id で出す */
  const bd=DATA.breakdown||{}; const bl=(k,label)=>{ const st=(bd[k]&&bd[k].stats)||[]; if(bd[k]&&bd[k].error) return `<div class="muted">取れませんでした（${esc(bd[k].error)}）</div>`; const top=st.length?st[0].count:1; return st.slice(0,10).map(s=>`<div class="row"><span>${esc(s.name||(k==="sizes"?(SZ[s.id]||s.id):"（不明）"))}</span><span class="n">${fmtN(s.count)}</span></div><div class="bar"><i style="width:${Math.round(s.count/top*100)}%"></i></div>`).join("")||`<div class="muted">まだありません</div>`; };
  // 日ごとの折れ線
  const W=900,H=180,pad=28; const mx=Math.max(1,...days.map(d=>d.n)); const xs=i=>pad+(W-pad*2)*(days.length>1?i/(days.length-1):0.5), ys=n=>H-pad-(H-pad*2)*n/mx;
  const line=days.map((d,i)=>`${i?"L":"M"}${xs(i).toFixed(1)},${ys(d.n).toFixed(1)}`).join(" ");
  const area=days.length?`${line} L${xs(days.length-1).toFixed(1)},${H-pad} L${xs(0).toFixed(1)},${H-pad} Z`:"";
  const step=Math.ceil(days.length/8); const ticks=days.map((d,i)=>(days.length<=10||(i%step===0&&days.length-1-i>=step/2)||i===days.length-1)?`<text x="${xs(i)}" y="${H-8}" font-size="10" fill="#A79E8C" text-anchor="middle">${d.day.slice(5)}</text>`:"").join("");
  const dots=days.map((d,i)=>`<circle cx="${xs(i)}" cy="${ys(d.n)}" r="2.5" fill="#C9A227"><title>${d.day}　${d.n}</title></circle>`).join("");
  /* 第253巡（作り手：このデータを元に、こうした方がいいという改善点も載せて）：数から読み取れることと、次の一手 */
  const adv=(()=>{ const out=[]; const add=(lv,t,why,how)=>out.push({lv,t,why,how});
    const pct0=(a,b)=>b?Math.round(a/b*100):0;
    const startPct=pct0(starts,visits), actPct=pct0(act,starts), lateSlow=pct0(loadSlow,loadTot||1);
    const lpv=byPrefix("lp/view").reduce((a,[,n])=>a+n,0); const fromLp=ev("from/lp");
    const appClicks=byPrefix("lp").filter(([k])=>/appstore_click$/.test(k)).reduce((a,[,n])=>a+n,0);
    const iosShare=(()=>{ const st=((DATA.breakdown||{}).systems||{}).stats||[]; const tot=st.reduce((a,x)=>a+x.count,0)||1; const ios=(st.find(x=>/iOS/i.test(x.name||x.id||""))||{}).count||0; return Math.round(ios/tot*100); })();
    /* 古い数では、外のブラウザの失敗も ev/err に混ざっている（第253巡で err-ext に分けた）。文で見分ける */
    const errRows=byPrefix("err").concat(byPrefix("err-ext"));
    const isExt=k=>/postMessage|Script error|ResizeObserver|fbclid|instantMessag/i.test(k);
    const extErr=errRows.filter(([k])=>isExt(k)).reduce((a,[,n])=>a+n,0)+ev("err-ext");
    const ownErr=errRows.filter(([k])=>!isExt(k)).reduce((a,[,n])=>a+n,0);
    const ret=ev("user/return"), neu=ev("user/new");
    if(loadTot>=20 && lateSlow>=35) add("急","開くのが遅い（八秒以上が "+lateSlow+"％）","広告から来た人は数秒で去る。ここが一番大きな漏れ口","広告の行き先を紹介ページ（/lp/）にして、読んでいる間に本編を先に取らせる。表紙はすぐ出るようにしてあるので、あとは本体の読み込みを軽くする");
    if(visits>=80 && startPct<20) add("急","遊び始めが少ない（訪問の "+startPct+"％）","表紙で止まっている。何のゲームか、一目で分からない恐れ","表紙の一文と絵を見直す。〈ゲームをはじめる〉までの手数を増やさない");
    else if(visits>=80 && startPct>=35) add("良","入口は通っている（訪問の "+startPct+"％が遊び始め）","表紙は効いている","この率を保ったまま、人を増やす（広告・紹介ページ）");
    if(starts>=20 && actPct<40) add("急","最初の合戦を終えた人が少ない（遊び始めの "+actPct+"％）","最初の戦で躓いている。操作か難しさ","長篠の最初の戦を易しく。〈自動で戦う〉をもっと目立たせる。手引きの一行を戦の始めに出す");
    else if(starts>=20 && actPct>=60) add("良","最初の合戦まで届いている（"+actPct+"％）","合戦は伝わっている","次は二戦目・筋書きの続きへ（結びの数を見る）");
    if(adClicks>=50 && lpv<adClicks*0.3) add("中","広告が本編に直行している（紹介ページの表示 "+lpv+"／広告 "+adClicks+"）","重い本編に直接落としている。紹介ページなら軽くて速い","広告の行き先を https://kaitoseto1129.github.io/sengoku-daimyo-play/lp/?src=meta&utm_campaign=… に変える");
    if(fromLp>0) add("良","紹介ページから本編へ "+fromLp+"人","導線は働いている","この数と遊び始めの率を見比べる（LP 経由のほうが良ければ広告は全部 LP へ）");
    if(iosShare>=60 && appClicks===0 && lpv>=10) add("中","iPhone の人が "+iosShare+"％なのに App Store が押されていない","ブラウザ版で完結している。アプリの利点が伝わっていない","紹介ページの App Store の札を上に。ブラウザ版の画面にも「アプリなら続きが残る」の一行を");
    if(fundOpen>=10 && fundClick===0) add("中","軍資金の札は "+fundOpen+"回開かれたが、額を押した人は 0","札の一枚目で金額に届いていなかった（直したので次の数字を見る）","一枚目の大きな〈軍資金を出す〉が効いているか、次の三十日で確かめる");
    if(neu>=30 && ret/Math.max(1,neu)<0.12) add("中","戻って来る人が少ない（新しい人 "+neu+"／戻って来た人 "+ret+"）","一度きりで終わっている。続きを残せると伝わっていない","〈つづきから〉を表紙で目立たせる。一戦終えた人に「続きは残ります」と一言");
    if(extErr>0) add("良","外のブラウザの失敗 "+extErr+"件（こちらの不具合ではない）","Facebook・Instagram のアプリ内ブラウザが差し込む script の失敗","err/（こちらの不具合）だけを見ればよい"+(ownErr?"。いまは "+ownErr+"件":"。いまは 0件"));
    if(ownErr>0) add("急","こちらの不具合が "+ownErr+"件","ゲームの中で落ちている","どの画面で出たかを見て直す");
    if(results===0 && starts>=20) add("良","結びが 0 なのは普通","一つの筋書きを最後（天下統一・滅亡）まで遊ぶには何時間もかかる","日ごとの手応えは「初戦を終えた」で見る");
    if(!out.length) add("良","まだ数が少ない","読み取るには人が足りない","広告か紹介で人を増やしてから見る");
    return out; })();
  const advHtml=`<div class="sec card"><h2>読み取れること・次の一手</h2>${adv.map(a=>`<div style="margin:10px 0;padding:10px 12px;border-radius:8px;background:#0F0D09;border-left:3px solid ${a.lv==="急"?"#E2762A":a.lv==="中"?"#C9A227":"#4C9A5A"}"><div style="font-weight:700;color:var(--kin)"><span style="display:inline-block;min-width:34px;font-size:11px;opacity:.8">${a.lv}</span>${esc(a.t)}</div><div class="note" style="margin-top:6px;background:none;padding:0">なぜ：${esc(a.why)}<br>どうする：${esc(a.how)}</div></div>`).join("")}<div class="note" style="margin-top:8px">この欄は数から自動で書いています（人の判断ではありません）。数が少ないうちは当てになりません。</div></div>`;
  document.getElementById("main").innerHTML=`
    ${advHtml}
    <div class="grid">
      <div class="card"><h2>訪問（人）</h2><div class="big">${fmtN(visits)}</div><div class="muted">${R.start}〜${R.end}　一日あたり ${fmtN(Math.round(visits/Math.max(1,days.length)))}</div></div>
      <div class="card"><h2>遊び始め</h2><div class="big">${fmtN(starts)}<small>訪問の ${pct(starts,visits)}</small></div></div>
      <div class="card"><h2>会戦</h2><div class="big">${fmtN(battles)}<small>遊び始め一回あたり ${starts?(battles/starts).toFixed(1):"—"}</small></div><div class="muted">初戦を終えた ${fmtN(act)}（遊び始めの ${pct(act,starts)}）</div></div>
      <div class="card"><h2>結び（天下統一・滅亡まで）</h2><div class="big">${fmtN(results)}<small>遊び始めの ${pct(results,starts)}</small></div><div class="muted">一つの筋書きを最後まで（何時間もかかる）。日ごとの手応えは「初戦を終えた」で見る</div></div>
      <div class="card"><h2>解除・支援</h2><div class="big">${fmtN(unlocks)}<small>解除</small></div><div class="muted">支援の札を開いた ${fmtN(fundOpen)}・額を押した ${fmtN(fundClick)}・払いに進んだ ${fmtN(payClick)}${fundDone.length?`・支援あり ${fundDone.map(([k,n])=>k+"×"+n).join(" ")}`:""}</div></div>
      <div class="card"><h2>LP（紹介ページ）</h2>${(()=>{ const lpv=byPrefix("lp/view"); const views=lpv.reduce((a,[,n])=>a+n,0); const clicks=byPrefix("lp").filter(([k])=>/appstore_click$/.test(k)).reduce((a,[,n])=>a+n,0); const opens=byPrefix("lp").filter(([k])=>k.startsWith("open_")).reduce((a,[,n])=>a+n,0); const src={}; for(const [k,n] of lpv){ const s2=k.split("/")[0]; src[s2]=(src[s2]||0)+n; } const sc={}; for(const [k,n] of byPrefix("lp")){ const m=k.match(/^scroll_(\d+)$/); if(m) sc[m[1]]=(sc[m[1]]||0)+n; } return `<div class="big">${fmtN(views)}<small>表示</small></div><div class="muted">App Store を押した ${fmtN(clicks)}（${pct(clicks,views)}）・動く絵を開いた ${fmtN(opens)}・流入 ${Object.entries(src).map(([k,n])=>k+" "+n).join(" ")||"—"}・読み進み 25%:${sc["25"]||0} 50%:${sc["50"]||0} 75%:${sc["75"]||0} 100%:${sc["100"]||0}</div>`; })()}</div>
      <div class="card"><h2>お便りと支払い</h2>
        <div class="row"><span>目安箱に届いたお便り</span><span class="n">${fmtN(ev("meyasu/send"))}</span></div>
        <div class="row"><span>軍資金を「払いました」と押した人</span><span class="n">${fmtN(byPrefix("fund-paid").reduce((a,[,n])=>a+n,0))}</span></div>
        <div class="row"><span>関ヶ原（¥500）を「払いました」と押した人</span><span class="n">${fmtN(ev("paid/sekigahara"))}</span></div>
        <div class="note" style="margin-top:8px">お便りはメールで届きます（この数は送った人の数）。支払いは PayPal の頁へ送ったあと、ゲームに戻って自分で「払いました」を押した数――実際に入金があったかどうかは PayPal の明細で確かめてください。iPhone 版の課金はここには出ません（App Store Connect で見る）。</div></div>
      <div class="card"><h2>入口・速さ</h2><div class="big">${fmtN(adClicks)}<small>広告から</small></div><div class="muted">新しい人 ${fmtN(ev("user/new"))}・戻って来た人 ${fmtN(ev("user/return"))}${loadTot?`<br>開くまで 1秒以内 ${pct(loadFast,loadTot)}・3秒 ${pct(load3,loadTot)}・8秒以上 ${pct(loadSlow,loadTot)}`:""}</div></div>
      <div class="card"><h2>ページ表示</h2><div class="big">${fmtN(pageviews)}</div><div class="muted">${pages.slice(0,3).map(h=>esc(h.path)+" "+fmtN(sumStats(h))).join("　")}</div></div>
    </div>
    <div class="sec card"><h2>日ごとの訪問</h2>
      <svg viewBox="0 0 ${W} ${H}"><path d="${area}" fill="rgba(201,162,39,.15)"/><path d="${line}" fill="none" stroke="#C9A227" stroke-width="2"/>${dots}${ticks}<text x="${pad}" y="14" font-size="11" fill="#A79E8C">最大 ${mx}</text></svg>
    </div>
    <div class="sec card"><h2>流れ（訪問 → 遊び始め → 会戦 → 結び）</h2>
      <div class="funnel">
        <div class="st"><b>${fmtN(visits)}</b><span>訪問</span><em>100%</em></div>
        <div class="st"><b>${fmtN(starts)}</b><span>遊び始め</span><em>${pct(starts,visits)}</em></div>
        <div class="st"><b>${fmtN(battles)}</b><span>会戦</span><em>${pct(battles,visits)}</em></div>
        <div class="st"><b>${fmtN(results)}</b><span>結び</span><em>${pct(results,visits)}</em></div>
        <div class="st"><b>${fmtN(unlocks)}</b><span>解除</span><em>${pct(unlocks,visits)}</em></div>
      </div>
      <div class="muted" style="margin-top:8px">訪問＝ページを開いた数（出来事の数は含めない）。遊び始めが少なければ入口（題名の画面）、初戦を終えた人が少なければ最初の合戦で躓いている、と読めます。結びは筋書きを最後まで遊んだ人だけなので、ふだんは 0 で構いません。iPhone 版は数えていません（ブラウザ版だけ）。</div>
    </div>
    <div class="sec grid">
      <div class="card"><h2>どの筋書きで始めたか</h2>${list(scen)}</div>
      <div class="card"><h2>どの家で始めたか</h2>${list(clans,"",15)}</div>
      <div class="card"><h2>結びの種類</h2>${list(resultKinds)}</div>
      <div class="card"><h2>結びまで行った筋書き</h2>${list(resultScen)}</div>
      <div class="card"><h2>会戦の種類</h2>${list(battleKinds)}</div>
    </div>
    <div class="sec grid">
      <div class="card"><h2>ブラウザ（30日）</h2>${bl("browsers")}</div>
      <div class="card"><h2>OS（30日）</h2>${bl("systems")}</div>
      <div class="card"><h2>画面の大きさ（30日）</h2>${bl("sizes")}</div>
      <div class="card"><h2>国・地域（30日）</h2>${bl("locations")}</div>
      <div class="card"><h2>どこから来たか（30日）</h2>${bl("toprefs")}</div>
      <div class="card"><h2>言語（30日）</h2>${bl("languages")}</div>
    </div>
    <div class="sec note">数は GoatCounter（${esc(DATA.site)}）から六時間ごとに写しています。細かい生の数は <a href="${esc(DATA.site)}" target="_blank" rel="noopener">GoatCounter の画面</a>でも見られます。</div>`;
}
if(opened()) load();
</script>
</body>
</html>
