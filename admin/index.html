<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>戦国大名 管理</title>
<style>
:root{ --bg:#17150F; --card:#221E16; --line:#3A3326; --ink:#EDE6D6; --dim:#A79E8C; --kin:#C9A227; --ai:#5B8DEF; --shu:#E24A3A; --moe:#4CC45C; }
*{ box-sizing:border-box; }
body{ margin:0; background:var(--bg); color:var(--ink); font-family:"Hiragino Sans","Zen Kaku Gothic New",sans-serif; font-size:14px; }
header{ display:flex; align-items:center; gap:14px; padding:12px 18px; border-bottom:1px solid var(--line); background:#1B1811; position:sticky; top:0; z-index:2; }
header h1{ font-size:17px; margin:0; letter-spacing:.08em; }
header .sub{ color:var(--dim); font-size:12px; margin-left:auto; }
main{ max-width:1100px; margin:0 auto; padding:16px; }
.grid{ display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); }
.card{ background:var(--card); border:1px solid var(--line); border-radius:8px; padding:14px 16px; }
.card h2{ font-size:13px; color:var(--dim); margin:0 0 8px; font-weight:600; letter-spacing:.05em; }
.big{ font-size:30px; font-weight:800; font-variant-numeric:tabular-nums; }
.big small{ font-size:12px; color:var(--dim); font-weight:500; margin-left:6px; }
.row{ display:flex; justify-content:space-between; align-items:center; padding:5px 0; border-bottom:1px dashed var(--line); font-variant-numeric:tabular-nums; }
.row:last-child{ border-bottom:none; }
.row .n{ font-weight:700; }
.bar{ height:6px; background:#0F0D09; border-radius:3px; overflow:hidden; margin-top:3px; }
.bar i{ display:block; height:100%; background:var(--kin); }
.muted{ color:var(--dim); font-size:12px; }
.sec{ margin-top:18px; }
.sec h2{ font-size:15px; margin:0 0 8px; }
.tabs{ display:flex; gap:6px; margin-left:8px; }
.tabs button{ background:#0F0D09; color:var(--ink); border:1px solid var(--line); border-radius:6px; padding:5px 10px; cursor:pointer; font-size:12px; }
.tabs button.on{ background:var(--kin); color:#1A1208; border-color:var(--kin); font-weight:700; }
svg{ width:100%; height:auto; display:block; }
.funnel{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:8px; }
.funnel .st{ background:#0F0D09; border-radius:6px; padding:10px; text-align:center; }
.funnel .st b{ display:block; font-size:22px; }
.funnel .st span{ font-size:11px; color:var(--dim); }
.funnel .st em{ display:block; font-style:normal; font-size:11px; color:var(--kin); margin-top:2px; }
#gate{ position:fixed; inset:0; background:var(--bg); display:flex; align-items:center; justify-content:center; z-index:9; }
#gate form{ background:var(--card); border:1px solid var(--line); border-radius:10px; padding:26px 28px; width:min(92vw,360px); display:flex; flex-direction:column; gap:10px; }
#gate input{ background:#0F0D09; color:var(--ink); border:1px solid var(--line); border-radius:6px; padding:10px; font-size:15px; }
#gate button{ background:var(--kin); color:#1A1208; border:none; border-radius:6px; padding:11px; font-weight:800; font-size:15px; cursor:pointer; }
#gate .err{ color:var(--shu); font-size:12px; min-height:16px; }
a{ color:var(--ai); }
.note{ background:#0F0D09; border-radius:6px; padding:10px 12px; font-size:12px; color:var(--dim); line-height:1.6; }
/* 左上の切り替え（戦国大名 ⇄ 戦国立身）：押せる所は 44px 以上。キーボードでも（Enter・矢印・Esc） */
.gsw{ position:relative; }
.gsw > button{ min-height:44px; min-width:44px; display:flex; align-items:center; gap:8px; background:transparent; color:var(--ink); border:1px solid var(--line); border-radius:8px; padding:6px 12px; cursor:pointer; font:inherit; }
.gsw > button:hover{ border-color:var(--kin); }
.gsw > button:focus-visible, .gsw [role=menuitemradio]:focus-visible{ outline:2px solid var(--kin); outline-offset:2px; }
.gsw > button h1{ font-size:17px; margin:0; letter-spacing:.08em; }
.gsw > button .tag{ font-size:11px; font-weight:800; padding:2px 7px; border-radius:4px; background:var(--kin); color:#1A1208; letter-spacing:.05em; }
.gsw > button .tag.r{ background:var(--ai); color:#fff; }
.gsw > button .car{ color:var(--dim); font-size:12px; }
.gsw [role=menu]{ position:absolute; left:0; top:calc(100% + 6px); background:var(--card); border:1px solid var(--line); border-radius:8px; padding:6px; min-width:300px; box-shadow:0 10px 30px rgba(0,0,0,.5); z-index:5; }
.gsw [role=menuitemradio]{ display:flex; align-items:center; gap:10px; width:100%; min-height:48px; padding:8px 12px; background:transparent; color:var(--ink); border:none; border-radius:6px; cursor:pointer; font:inherit; font-size:15px; text-align:left; white-space:nowrap; }
.gsw [role=menuitemradio]:hover{ background:#0F0D09; }
.gsw [role=menuitemradio] .ck{ width:18px; color:var(--kin); font-weight:900; }
.gsw [role=menuitemradio][aria-checked=true]{ background:#0F0D09; font-weight:800; }
.gsw [role=menuitemradio] small{ color:var(--dim); font-size:11px; margin-left:auto; }
body.risshin header{ border-bottom-color:var(--ai); }
#reviewSigns{scroll-margin-top:130px}
#reviewSigns .note,#reviewSigns .muted{font-size:14px;line-height:1.6}
#reviewSigns .row{flex-wrap:wrap;gap:8px;overflow-wrap:anywhere}
/* 毎日見る一枚。戦国立身は既存の切り替え先に残す。 */
[hidden]{display:none!important}
body:not(.risshin){--bg:#f5f5f2;--card:#fff;--line:#d9dcd7;--ink:#202822;--dim:#59625b;--kin:#344a3c;--ai:#344a3c;--shu:#b52d26;--moe:#247444;font-size:16px;line-height:1.5}
body:not(.risshin) header{background:var(--card);padding:12px 24px;position:static;flex-wrap:wrap;gap:8px}
body:not(.risshin) header .sub{font-size:14px}
body:not(.risshin) .gsw>button{border:0;padding:0 8px 0 0}
body:not(.risshin) .gsw>button .tag{display:none}
body:not(.risshin) .gsw>button .car,body:not(.risshin) .gsw small{font-size:14px}
body:not(.risshin) .gsw [role=menuitemradio]:hover,body:not(.risshin) .gsw [aria-checked=true]{background:#eef0ec}
body:not(.risshin) main{max-width:1200px;padding:24px}
body:not(.risshin) h2{color:var(--ink);font-size:20px;letter-spacing:0;margin:0 0 16px}
body:not(.risshin) h3{font-size:16px;margin:16px 0 8px}
body:not(.risshin) p{margin:8px 0}
body:not(.risshin) .muted,body:not(.risshin) .note{font-size:14px;line-height:1.5}
body:not(.risshin) .note{background:#f1f3ef}
body:not(.risshin) .card{padding:20px;border-radius:12px}
body:not(.risshin) .row{gap:12px;align-items:baseline;padding:10px 0;overflow-wrap:anywhere}
body:not(.risshin) .row b{white-space:nowrap}
.daily-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.daily-head h2{margin:0!important;font-size:24px!important}
.daily-head p{margin:0!important;color:var(--dim);font-size:14px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi h3{font-size:16px!important;margin:0 0 8px!important;color:var(--dim)}
.kpi .value{font-size:36px;font-weight:800;line-height:1.5;font-variant-numeric:tabular-nums}
.kpi .yesterday{font-size:14px;color:var(--dim);margin-top:8px}.kpi .yesterday .change{display:inline;margin-left:6px}
.change{font-size:14px;color:var(--dim);display:block}
.change.good{color:var(--moe)}.change.bad{color:var(--shu)}
.store{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.store article{padding:14px 20px!important}.store h3{margin:0!important;font-size:16px!important}
.store .store-n{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.store .store-line{display:flex;gap:16px;align-items:baseline;flex-wrap:wrap}
.store .change{display:inline}
.work-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:24px 0}
.loss-rate{font-size:24px;color:var(--shu);font-variant-numeric:tabular-nums;font-weight:800}
.loss-row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;border-bottom:1px solid var(--line);padding:10px 0}
.loss-row:last-child{border:0}
.loss-row small{font-size:14px;color:var(--dim);display:block}
.action-list{list-style:none;margin:0;padding:0;counter-reset:action}
.action-list li{padding:12px 0;border-bottom:1px solid var(--line);counter-increment:action;overflow-wrap:anywhere}
.action-list li:first-child{padding-top:0}.action-list li:last-child{border:0;padding-bottom:0}
.action-list strong::before{content:counter(action) ". ";color:var(--shu)}
.action-list p{font-size:14px;color:var(--dim)}
.daily-details{margin-top:12px}.daily-details summary{cursor:pointer;font-weight:700;min-height:44px;display:list-item;padding:10px 0;font-size:16px}
.daily-details[open] summary{margin-bottom:12px;border-bottom:1px solid var(--line)}
.review-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.review-grid div{background:var(--bg);padding:16px;border-radius:8px}.review-grid dt{font-size:14px;color:var(--dim)}.review-grid dd{font-size:24px;font-weight:700;margin:6px 0 0}
body:not(.risshin) #gate{background:var(--bg)}
body:not(.risshin) #gate input{background:var(--card)}
body:not(.risshin) #gate button{background:var(--ink);color:#fff}
body:not(.risshin) #gate .err{font-size:14px}
body:not(.risshin) .daily-details input{max-width:100%}
body:not(.risshin) button,body:not(.risshin) input{font-size: max(14px,1em);line-height:1.5}
body:not(.risshin) #dailySettings .card{background:var(--bg)}
@media(max-width:650px){
 body:not(.risshin) header{padding:10px 16px}body:not(.risshin) header .sub{margin-left:0;width:100%}
 body:not(.risshin) main{padding:20px 16px}body:not(.risshin) .card{padding:16px}
 .kpis{grid-template-columns:1fr 1fr;gap:10px}.kpi .value{font-size:26px}
 .kpis[aria-label="アプリ内の漏斗"]{grid-template-columns:1fr 1fr!important}.store{grid-template-columns:1fr 1fr}.store article{padding:12px!important}.store .store-line{gap:0;display:block}.store .store-line .muted{display:block}.store h3{font-size:14px!important}.work-grid{grid-template-columns:1fr;margin:20px 0;gap:16px}
 .review-grid{grid-template-columns:1fr}.daily-head{gap:6px}.daily-head h2{font-size:22px!important}
}

</style>
</head>
<body>
<div id="gate"><form id="loginForm">
  <div style="font-size:18px;font-weight:800;letter-spacing:.1em">戦国大名　管理</div>
  <input id="em" type="email" placeholder="メールアドレス" autocomplete="username">
  <input id="pw" type="password" placeholder="パスワード" autocomplete="current-password">
  <button type="submit">入る</button>
  <div class="err" id="gateErr"></div>
</form></div>

<header>
  <div class="gsw" id="gsw">
    <button type="button" id="gameBtn" aria-haspopup="menu" aria-expanded="false" aria-controls="gameMenu" title="管理する遊びを切り替える"><h1 id="gameTitle">戦国大名　管理</h1><span class="tag" id="gameTag">大名</span><span class="car" aria-hidden="true">▾</span></button>
    <div role="menu" id="gameMenu" aria-label="管理する遊び" hidden>
      <button type="button" role="menuitemradio" data-g="daimyo" aria-checked="true"><span class="ck" aria-hidden="true"></span>戦国大名<small>/sengoku-daimyo-play/</small></button>
      <button type="button" role="menuitemradio" data-g="risshin" aria-checked="false"><span class="ck" aria-hidden="true"></span>戦国立身<small>/risshin/</small></button>
    </div>
  </div>
  <div class="tabs" id="rangeTabs"><button data-r="d1">1日</button><button data-r="d7">7日</button><button data-r="d30" class="on">30日</button><button data-r="d90">90日</button></div>
  <div class="sub" id="updated">読み込み中…</div>
</header>
<main id="main"></main>

<script>
/* 入口：合言葉は手元で照らし合わせる（軽い鍵。数字だけの画面なのでこれで十分）。通れば三十日おぼえる */
/* 第253巡（作り手：管理画面に人を追加できるように）：入れる人の一覧。足すときは下の「人を足す」で作った行をここに加える（合言葉そのものは置かない） */
const USERS=[
  {email:"kaitoseto1129@gmail.com", hash:"57f3833bb5286c81572f087fc31cae5f081e8e7001462e05312832163de6dfc3", name:"作り手"},
];
/* 第258巡（kaito：メアドとパスワードを入れたら、その人も入れるように。シンプルに）：足した人は users.json に置く。
   管理画面の「入れる人」で足すと、その場で倉の users.json に書き込む（GitHub の鍵はこのブラウザにだけ置く） */
let USERS_EXTRA=[];
async function loadUsers(){ try{ const r=await fetch("users.json?t="+Date.now(),{cache:"no-store"}); if(r.ok){ const j=await r.json(); if(Array.isArray(j)) USERS_EXTRA=j; } }catch(_){ } return USERS.concat(USERS_EXTRA); }
async function sha256(s){ const b=await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join(""); }
function opened(){ try{ const t=+localStorage.getItem("sd_admin_ok")||0; return Date.now()-t<30*864e5; }catch(e){ return false; } }
/* 第257巡（kaito：管理画面に入れない）：入れていないと、ブラウザの吹き出しが題の上に出るだけで
   どこが足りないか分からなかった。自分で確かめて、札の中に日本語で出す */
document.getElementById("loginForm").onsubmit=async e=>{ e.preventDefault();
  { const e1=document.getElementById("em").value.trim(), p1=document.getElementById("pw").value;
    if(!e1||!p1){ document.getElementById("gateErr").textContent=!e1&&!p1?"メールアドレスと合言葉を入れてください":(!e1?"メールアドレスを入れてください":"合言葉を入れてください（自動入力が入っていないことがあります。一度押して入れ直してください）");
      document.getElementById(!e1?"em":"pw").focus(); return; } }
  const em=document.getElementById("em").value.trim().toLowerCase(); const h=await sha256(document.getElementById("pw").value);
  const u=(await loadUsers()).find(x=>x.email.toLowerCase()===em && x.hash===h);
  if(u){ try{ localStorage.setItem("sd_admin_ok", String(Date.now())); localStorage.setItem("sd_admin_who", u.name||em); }catch(_){ } document.getElementById("gate").style.display="none"; load(); }
  else document.getElementById("gateErr").textContent="メールアドレスか合言葉が違います"; };
if(opened()){ document.getElementById("gate").style.display="none"; }
function showSales(){ if(GAME==="daimyo"){ loadDailySales(); return; } try{ fetch("sales.json?"+Date.now()).then(r=>r.ok?r.json():null).then(x0=>{ if(!x0) return; const x=(x0.games&&x0.games[GAME])||x0; /* 10/12：遊びごとの数 */
  const el=document.getElementById("salesBox"); if(!el) return;
  const ds=(x.days||[]).slice(-30); const mx=Math.max(1,...ds.map(d=>d.new||0));
  const W=640,H=90,p=6, xs=i2=>p+(W-p*2)*(ds.length>1?i2/(ds.length-1):.5);
  const bars=ds.map((d,i2)=>{ const h=Math.round((H-20)*(d.new||0)/mx); const w=Math.max(3,(W-p*2)/Math.max(1,ds.length)-2);
    return `<rect x="${(xs(i2)-w/2).toFixed(1)}" y="${H-10-h}" width="${w.toFixed(1)}" height="${h}" fill="${d.units?'#E3C25A':'#6b5a2a'}" rx="1"><title>${d.d} 入れた ${d.new||0}人${d.units?'・課金 '+d.units+'本':''}</title></rect>`; }).join("");
  const last=ds.length?ds[ds.length-1]:null;
  el.innerHTML=`<div style="border-top:1px solid rgba(237,230,214,.12);margin-top:10px;padding-top:10px">
    <div style="font-size:14px;letter-spacing:.08em;color:#C9A227">App Store（アプリ）</div>
    <div style="display:flex;gap:18px;flex-wrap:wrap;align-items:baseline;margin-top:4px">
      <div><b style="font-size:26px">${x.total_new||0}</b><span class="muted"> 人が入れた（${(x.days||[]).length}日）</span></div>
      <div><b style="font-size:26px">${x.total_units||0}</b><span class="muted"> 本の課金</span></div>
      <div><b style="font-size:26px">${x.total_proceeds||0}</b><span class="muted"> ${x.cur||"JPY"} の入金</span></div>
    </div>
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:640px;height:auto;margin-top:6px">${bars}</svg>
    <div class="muted" style="font-size:14px">日ごとに入れた人（金色の日は課金あり）${last?`／最後の日 ${last.d} は ${last.new||0}人`:""}。
    Apple の集計は一〜二日遅れます。${(x0.updated||"").slice(0,16)} 取得</div></div>`;
}).catch(()=>{}); }catch(_){ } }
const _load0=load; load=async function(){ await _load0(); try{ if(!document.getElementById("nuGo")) appendUsers(); }catch(_){ } showSales(); };

let DATA=null, RANGE="d30";
/* 遊びの切り替え（戦国大名 ⇄ 戦国立身）。中身は同じ作りで、数は GoatCounter の道の頭で分ける：
   戦国立身は /risshin/（頁）と risshin/ev/…（出来事）。戦国大名はそれ以外。?game=risshin か #risshin で開ける */
const GAMES={ daimyo:{name:"戦国大名", tag:"大名"}, risshin:{name:"戦国立身", tag:"立身"} };
let GAME=(()=>{ try{ const q=new URLSearchParams(location.search).get("game"); if(q&&GAMES[q]) return q; if(/^#?risshin$/.test(location.hash)) return "risshin"; }catch(_){ } return "daimyo"; })();
const RISSHIN_RE=/^\/?risshin(\/|$)/;
function gameHits(hits){
  const out=[];
  for(const h of (hits||[])){ const p=String(h.path||""); const isR=RISSHIN_RE.test(p);
    if(GAME==="risshin"){ if(!isR) continue; out.push(h.event?{...h, path:p.replace(/^\/?risshin\//,"")}:h); }
    else if(!isR) out.push(h); }
  return out;
}
function setGame(g, focus){
  if(!GAMES[g]) return; GAME=g;
  try{ const u=new URL(location.href); if(g==="daimyo") u.searchParams.delete("game"); else u.searchParams.set("game",g); u.hash=""; history.replaceState(null,"",u); }catch(_){ }
  applyGame(); render(); loadExtras(); showSales();
  if(focus) document.getElementById("gameBtn").focus();
}
function applyGame(){
  const G=GAMES[GAME]; document.getElementById("gameTitle").textContent=G.name+"　管理"; document.title=G.name+" 管理";
  const tag=document.getElementById("gameTag"); tag.textContent=G.tag; tag.classList.toggle("r",GAME==="risshin");
  document.getElementById("gameBtn").setAttribute("aria-label","いま："+G.name+" の管理。押すと切り替え");
  document.body.classList.toggle("risshin",GAME==="risshin");
  document.getElementById("rangeTabs").hidden=GAME!=="risshin";
  document.querySelectorAll("#gameMenu [role=menuitemradio]").forEach(b=>{ const on=b.dataset.g===GAME; b.setAttribute("aria-checked",on?"true":"false"); b.querySelector(".ck").textContent=on?"✓":""; });
}
(function(){ const btn=document.getElementById("gameBtn"), menu=document.getElementById("gameMenu"); const items=()=>[...menu.querySelectorAll("[role=menuitemradio]")];
  const open=()=>{ menu.hidden=false; btn.setAttribute("aria-expanded","true"); (items().find(b=>b.dataset.g===GAME)||items()[0]).focus(); };
  const close=(f)=>{ menu.hidden=true; btn.setAttribute("aria-expanded","false"); if(f) btn.focus(); };
  btn.onclick=()=>{ if(menu.hidden) open(); else close(); };
  btn.onkeydown=e=>{ if(e.key==="ArrowDown"||e.key==="ArrowUp"){ e.preventDefault(); open(); } };
  menu.onkeydown=e=>{ const it=items(), i=it.indexOf(document.activeElement);
    if(e.key==="ArrowDown"){ e.preventDefault(); it[(i+1)%it.length].focus(); }
    else if(e.key==="ArrowUp"){ e.preventDefault(); it[(i-1+it.length)%it.length].focus(); }
    else if(e.key==="Escape"){ e.preventDefault(); close(true); }
    else if(e.key==="Tab"){ close(false); } };
  items().forEach(b=>b.onclick=()=>{ close(false); setGame(b.dataset.g, true); });
  document.addEventListener("click",e=>{ if(!menu.hidden&&!document.getElementById("gsw").contains(e.target)) close(false); });
  applyGame();
})();
document.querySelectorAll("#rangeTabs button").forEach(b=>b.onclick=()=>{ RANGE=b.dataset.r; document.querySelectorAll("#rangeTabs button").forEach(x=>x.classList.toggle("on",x===b)); render(); });
/* 第258巡：人を足す・外す。users.json を GitHub に直接書く。パスワードそのものは置かない（SHA-256 の印だけ） */
const GH_REPO="kaitoseto1129/sengoku-daimyo-play", GH_PATH="admin/users.json";
function ghKey(){ try{ return localStorage.getItem("sd_gh_key")||""; }catch(_){ return ""; } }
async function ghSaveUsers(list){
  const key=ghKey(); if(!key) throw new Error("nokey");
  const api=`https://api.github.com/repos/${GH_REPO}/contents/${GH_PATH}`, hd={Authorization:"Bearer "+key, Accept:"application/vnd.github+json"};
  const cur=await fetch(api+"?t="+Date.now(),{headers:hd,cache:"no-store"}); const sha=cur.ok?(await cur.json()).sha:undefined;
  const body=JSON.stringify(list,null,2)+"\n"; const b64=btoa(unescape(encodeURIComponent(body)));
  const r=await fetch(api,{method:"PUT",headers:hd,body:JSON.stringify({message:"管理画面：入れる人を更新",content:b64,sha})});

/* 声のまとめ（Markdown）をかんたんに HTML に：見出し・箇条・表・段落だけ。中身はすべて esc する */
function mdHtml(md){
  const inl=t=>esc(t).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/`([^`]+)`/g,"<code>$1</code>");
  const out=[]; let list=false, tbl=false;
  const endL=()=>{ if(list){ out.push("</ul>"); list=false; } if(tbl){ out.push("</table>"); tbl=false; } };
  for(const line of md.split("\n")){
    const h=line.match(/^(#{1,4})\s+(.+)/), li=line.match(/^\s*[-*]\s+(.+)/), tr=/^\s*\|.*\|\s*$/.test(line);
    if(h){ endL(); out.push(`<div style="font-weight:800;color:var(--kin);margin:${h[1].length<=2?12:8}px 0 4px">${inl(h[2])}</div>`); }
    else if(li){ if(tbl){ out.push("</table>"); tbl=false; } if(!list){ out.push('<ul style="margin:4px 0;padding-left:20px;line-height:1.7">'); list=true; } out.push(`<li>${inl(li[1])}</li>`); }
    else if(tr){ if(/^\s*\|[\s:|-]+\|\s*$/.test(line)) continue; if(list){ out.push("</ul>"); list=false; } if(!tbl){ out.push('<table style="border-collapse:collapse;font-size:12px;margin:6px 0;width:100%">'); tbl=true; } out.push("<tr>"+line.trim().slice(1,-1).split("|").map(c=>`<td style="border-bottom:1px dashed var(--line);padding:4px 6px">${inl(c.trim())}</td>`).join("")+"</tr>"); }
    else if(line.trim()){ endL(); out.push(`<p style="margin:4px 0;line-height:1.7">${inl(line)}</p>`); }
    else endL();
  }
  endL(); return out.join("");
}

function reviewMetrics(hits){
  const counts={}, scenes={}, houses={}, tails=[]; let starts=0,leaves=0,returns=0,dominance=0;
  for(const h of hits){if(!h.event||!String(h.path||'').startsWith('ev/review/'))continue;
    const a=h.path.slice(10).split('/'),cl=a.pop(),sc=a.pop();if(!['nagashino','sekigahara'].includes(sc)||!cl)continue;
    const n=(h.stats||[]).reduce((s,d)=>s+(Number(d.daily)||0),0),key=sc+'/'+cl;
    const home=houses[key]||(houses[key]={starts:0,unify:0,replay:0});
    if(a[0]==='count'){
      const delta=Number(a.pop());if(!Number.isSafeInteger(delta)||delta<=0)continue;
      const k=a.slice(1).join('/');counts[k]=(counts[k]||0)+delta*n;
    }else if(a[0]==='start'){starts+=n;home.starts+=n;}
    else if(a[0]==='unify')home.unify+=n;
    else if(a[0]==='replay')home.replay+=n;
    else if(a[0]==='dominance')dominance+=n;
    else if(a[0]==='early-leave'){leaves+=n;const k=a.slice(1).join('/');scenes[k]=(scenes[k]||0)+n;}
    else if(a[0]==='early-return')returns+=n;
    else if(a[0]==='tail-days'){const days=Number(a[1]);if(Number.isSafeInteger(days)&&days>=0)tails.push({days,n,house:key});}
  }
  const sum=p=>Object.entries(counts).filter(([k])=>k===p||k.startsWith(p+'/')).reduce((s,[,n])=>s+n,0);

  return {starts,leaves,returns,scenes,counts,houses,dominance,tails,bulk:sum('bulk'),manual,auto,
    manualPct:manual+auto?Math.round(manual/(manual+auto)*100):null,
    noticeShow:sum('notice-show'),noticeClose:sum('notice-close'),faults:sum('fault'),recovery:sum('recovery'),resume:sum('resume'),
    tailN,tailDays:tailN?tails.reduce((s,t)=>s+t.days*t.n,0)/tailN:null};
}

      <div class="card"><h2>どこから来たか（30日）</h2>${bl("toprefs")}</div>
      
    </div>
    <div class="sec note">数は GoatCounter（${esc(DATA.site)}）から六時間ごとに写しています。細かい生の数は <a href="${esc(DATA.site)}" target="_blank" rel="noopener">GoatCounter の画面</a>でも見られます。</div>`;
}
// アプリ印だけを正規化する。端末不明の旧記録とウェブ印は補完しない。
function appHits(hits){
  return (hits||[]).filter(h=>h.event&&/^ev\/plat\/(app|ios)\//.test(String(h.path||'')))
    .map(h=>({...h,path:h.path.replace(/^ev\/plat\/(app|ios)\//,'ev/')}))
    .filter(h=>{const sc=h.path.split('/').find(x=>['oke','honnoji','kiyosu','shizugatake','komaki','koshu','sekigahara','osaka','hoi','mikata','nagashino','kyushu','odawara','ishiyama'].includes(x));return !sc||['nagashino','sekigahara'].includes(sc);});
}
function derive(DATA, RANGE='d7'){
  const R=DATA.ranges?.[RANGE];if(!R)return null;
  const hits=appHits(R.hits),sum=h=>(h.stats||[]).reduce((s,d)=>s+(Number(d.daily)||0),0);
  const matches=(h,p)=>h.path==='ev/'+p||h.path.startsWith('ev/'+p+'/');
  const ev=p=>hits.filter(h=>matches(h,p)).reduce((s,h)=>s+sum(h),0);
  const has=p=>hits.some(h=>matches(h,p));
  const byPrefix=p=>hits.filter(h=>matches(h,p)).map(h=>[h.path.slice(('ev/'+p+'/').length),sum(h)]).sort((a,b)=>b[1]-a[1]);
  // 旧版の初戦完了と新しい漏斗は同じ到達点。足し合わせない。
  const first=has('funnel/first-end')?'funnel/first-end':'activation/first-battle-complete';
  return {hits,ev,has,byPrefix,starts:has('start')?ev('start'):null,act:has(first)?ev(first):null,
    unified:has('result/天下統一')?ev('result/天下統一'):null,review:reviewMetrics(hits),
    loadSlow:ev('load/8s')+ev('load/slow'),loadTot:ev('load'),first};
}
function insights(c){
  const out=[],add=(lv,t,why,how,key)=>out.push({lv,t,why,how,key});
  if(!c.hits.length){add('急','アプリ内の計測がまだありません','アプリと確認できる出来事が届いていません。旧記録は端末不明です','端末の印を付けた版を配信し、実機で開始・初戦完了・統一・離脱の到着を確認する','app-measure');return out;}
  if(c.act===null||c.unified===null)add('中','アプリの漏斗に未計測の段があります','印がない段をゼロや離脱と断定できません','端末の印が付いた版と到達時の送信を確認する','app-stages');
  if(c.starts>=20&&c.act!==null&&c.act/c.starts<.4)add('急',`アプリの初戦完了が少ない（${Math.round(c.act/c.starts*100)}％）`,'アプリの遊び始めに比べ初戦完了の記録が少ない','初戦の操作説明と自動で戦う導線を実機で確かめる','firstbattle');
  if(c.loadTot>=20&&c.loadSlow/c.loadTot>=.35)add('急','アプリの起動が遅い','八秒以上の読み込みが35％以上','実機で起動時間を測り、読み込みを軽くする','load');
  const errs=c.byPrefix('err').filter(([k])=>!/postMessa|Script error|ResizeObserver|fbclid|instantMessag|invoking/i.test(k));
  if(errs.length||c.review.faults)add('急',`アプリの不具合が ${errs.reduce((s,[,n])=>s+n,0)+c.review.faults}回`,'アプリ由来の不具合印があります（重複送信を含む回数）','場面と版を確認して実機で再現する','err');
  const scenes=Object.entries(c.review.scenes).sort((a,b)=>b[1]-a[1]);
  if(scenes[0]?.[1]>=5)add('急',`アプリの早い離脱候補が ${scenes[0][1]}回`,'三十分未満で裏へ移動した場面があります','離脱が多い場面と直後の復帰を見て、操作と知らせを確かめる','early');
  if(!out.length)add('良','アプリの数を継続して見る','急ぎの指摘はありません','初戦完了と場面ごとの離脱を翌週も比べる','app-watch');
  return out;
}

// 急ぎの判定は insight.mjs の derive / insights と同じ規則を上で使用する。
let DAILY_SALES=null, SALES_LOADING=false;
function appendUsers(){
  if(document.getElementById('nuGo')) return;

  const host=document.getElementById('dailySettings');if(host)host.appendChild(usersCard());
}
async function loadDailySales(){
  if(SALES_LOADING)return;SALES_LOADING=true;
  try{const r=await fetch('sales.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error(r.status);DAILY_SALES=await r.json();}
  catch(_){DAILY_SALES={error:true};}finally{SALES_LOADING=false;}
  if(GAME==='daimyo'){render();loadExtras();appendUsers();}
}
const shiftDay=(day,n)=>{const d=new Date(day+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10);};
const rangeDays=(end,n)=>Array.from({length:n},(_,i)=>shiftDay(end,i-n+1));
const inScope=p=>{const sc=String(p).split('/').find(x=>['oke','honnoji','kiyosu','shizugatake','komaki','koshu','sekigahara','osaka','hoi','mikata','nagashino','kyushu','odawara','ishiyama'].includes(x));return !sc||['nagashino','sekigahara'].includes(sc);};
function dailyCounts(hits,allowed){
 const hs=appHits(hits);
 const sum=h=>(h.stats||[]).filter(d=>!allowed||allowed.includes(d.day)).reduce((n,d)=>n+(Number(d.daily)||0),0);
 const event=p=>hs.filter(h=>h.event&&(h.path==='ev/'+p||h.path.startsWith('ev/'+p+'/'))).reduce((n,h)=>n+sum(h),0);
 const count=p=>hs.some(h=>h.path==='ev/'+p||h.path.startsWith('ev/'+p+'/'))?event(p):null;
 return [count('start'),count(hs.some(h=>h.path.startsWith('ev/funnel/first-end'))?'funnel/first-end':'activation/first-battle-complete'),count('result/天下統一')];
}
function delta(now,prev){
 if(now===null||prev===null)return '<span class="change">— 比較できる記録なし</span>';
 if(!prev)return `<span class="change ${now?'good':''}">${now?'↑ ＋'+fmtN(now):'→ 変化なし'}</span>`;
 const d=(now-prev)/prev*100;return `<span class="change ${d>0?'good':d<0?'bad':''}">${d>0?'↑':d<0?'↓':'→'} ${fmtN(Math.round(Math.abs(d)))}％${d?'':'（変化なし）'}</span>`;
}
function render(){if(GAME==='risshin'){renderLegacy();return;}renderDaily();}
function renderDaily(){
 if(!DATA)return;
 const r=DATA.ranges.d7,one=DATA.ranges.d1,history=DATA.ranges.d30||DATA.ranges.d90;
 if(!r||!one){document.getElementById('main').innerHTML='<div class="card">昨日・直近7日の記録を取得できませんでした。</div>';return;}
 // 日次統計の day は UTC の日付。d1 の実際のキーを基準に前週を切り出す。
 const dayKeys=[...new Set((one.hits||[]).flatMap(h=>(h.stats||[]).map(d=>d.day)))].sort();
 const keyEnd=dayKeys.at(-1)||shiftDay(one.end,-1),end=keyEnd;
 const hasHistory=history&&history.start<=shiftDay(end,-13)&&history.end>=end;
 const weekly=dailyCounts(r.hits),yesterday=dailyCounts(one.hits);
 const prev=hasHistory?dailyCounts(history.hits,rangeDays(shiftDay(keyEnd,-7),7)):null;
 const prevDay=hasHistory?dailyCounts(history.hits,[shiftDay(keyEnd,-7)]):null;
 const labels=['遊び始め','初戦を終えた','統一'];
 const c=derive(DATA,'d7'),urgent=c?insights(c).filter(x=>x.lv==='急').slice(0,3):[];
 const hits=appHits(r.hits);const review=reviewMetrics(hits);
 const scenes={};
 // 新しい記録がない期間は従来の「3分未満」を使用。人数と断定しない。
 const newScenes=Object.entries(review.scenes);
 if(!newScenes.length)for(const h of hits){const m=String(h.path).match(/^ev\/quit\/(.+)\/(1m|3m)$/);if(h.event&&m)scenes[m[1]]=(scenes[m[1]]||0)+sumStats(h);}
 const sceneNames={title:'表紙',map:'天下の地図',battle:'合戦','title-house':'大名家を選ぶ','battle-setup':'陣立て','battle-result':'合戦の結果',entry:'入口',house:'大名家を選ぶ'};
 const sceneName=k=>k.split('/').map(x=>sceneNames[x]||x.replace(/^panel:/,'札：').replace(/^dialog:/,'知らせ：')).join('・');
 const early=(newScenes.length?newScenes:Object.entries(scenes)).sort((a,b)=>b[1]-a[1]);
 const losses=labels.slice(0,2).map((label,i)=>{const from=weekly[i],to=weekly[i+1];return {label:label+' → '+labels[i+1],from,to,rate:from&&to!==null&&to<=from?Math.round((from-to)/from*100):null};}).sort((a,b)=>(b.rate??-1)-(a.rate??-1));
 const pct=(a,b)=>b?fmtN(Math.round(a/b*100))+'％':'—';
 const storeHtml=key=>{
  const title=({new:'新規入手',re:'再入手',upd:'更新',proceeds:'売上（推定入金）'})[key];
  if(!DAILY_SALES)return `<article class="card"><h3>${title}</h3><p class="muted">読み込み中…</p></article>`;
  if(DAILY_SALES.error)return `<article class="card"><h3>${title}</h3><p class="muted">記録を取得できませんでした</p></article>`;
  const x=DAILY_SALES.games?.daimyo||DAILY_SALES,ds=x.days||[];
  const amount=n=>key!=='proceeds'?fmtN(n)+'件':new Intl.NumberFormat('ja-JP',{style:'currency',currency:x.cur||'JPY',maximumFractionDigits:2}).format(n);
  const period=(e,n)=>{const wanted=rangeDays(e,n),rows=ds.filter(d=>wanted.includes(d.d)),complete=rows.length===n;return {sum:rows.reduce((s,d)=>s+(Number(d[key])||0),0),complete,days:rows.length};};
  const a=period(end,7),b=period(shiftDay(end,-7),7),y=period(end,1),py=period(shiftDay(end,-7),1);
  const val=t=>t.complete?amount(t.sum):t.days?amount(t.sum):'—';
  return `<article class="card"><h3>${title}</h3><div class="store-line"><b class="store-n">${val(a)}</b><span class="muted">${a.complete?'直近7日':a.days+'/7日・判明分'}</span>${a.complete&&b.complete?delta(a.sum,b.sum):'<span class="change">— 前週比未確定</span>'}</div><div class="muted">昨日 ${y.complete?val(y):'集計待ち'} ${y.complete&&py.complete?delta(y.sum,py.sum):''}</div></article>`;
 };
 document.getElementById('main').innerHTML=`
 <div class="daily-head"><h2>いまの戦国大名</h2><p>昨日 ${esc(keyEnd)} ／ 直近7日 ${esc(shiftDay(end,-6))}〜${esc(end)}</p></div>
 <p class="note">広告の効き目：ct（meta・google・lp・guide・lp-meta）の入手別集計は sales.json にありません（売上の日次合計のみ取得）。App Store Connect → App 分析 → 戦国大名 → 獲得 → キャンペーンで確認。<a href="https://developer.apple.com/help/app-store-connect-analytics/acquisition/campaign-links">表示条件</a>：初回入手5人以上。</p>
 <div class="store">${['new','re','upd','proceeds'].map(storeHtml).join('')}</div>
 <p class="muted">星レビュー：平均 — ／ 件数 —（未取得。みんなの声の評価は星に換算しません）</p>
 <h2 style="margin-top:24px">アプリ内の漏斗</h2><p class="muted">アプリ印のある記録のみ。印がない過去の段は未計測。</p>
 <section class="kpis" style="grid-template-columns:repeat(3,minmax(0,1fr))" aria-label="アプリ内の漏斗">${labels.map((label,i)=>`<article class="card kpi"><h3>${label}</h3><div class="value">${weekly[i]===null?'未計測':fmtN(weekly[i])}</div>${delta(weekly[i],prev?prev[i]:null)}<div class="yesterday">昨日 <b>${yesterday[i]===null?'未計測':fmtN(yesterday[i])}</b>${delta(yesterday[i],prevDay?prevDay[i]:null)}</div></article>`).join('')}</section>
 <p class="muted">上の数字は直近7日／矢印は前週比（昨日は前週同日比）。App Store 最新確定 ${esc((DAILY_SALES?.games?.daimyo||DAILY_SALES)?.days?.at(-1)?.d||'—')}。</p>
 <div class="work-grid">
 <section class="card"><h2>どこで去っているか</h2><div class="muted">直近7日・離脱率の高い順</div>${losses.map(x=>`<div class="loss-row"><div>${x.label}<small>${x.from===null?'未計測':fmtN(x.from)} → ${x.to===null?'未計測':fmtN(x.to)}回</small></div><span class="loss-rate">${x.rate===null?'—':x.rate+'％'}</span></div>`).join('')}
 <h3>早い離脱が多い場面</h3><div class="muted">${newScenes.length?'30分未満の離脱候補':'3分未満の離脱候補（従来の記録）'}</div>${early.slice(0,5).map(([k,n])=>`<div class="row"><span>${esc(sceneName(k))}</span><b>${fmtN(n)}回</b></div>`).join('')||'<p class="muted">まだ記録がありません</p>'}
 <details><summary>数の読み方</summary><p class="muted">離脱率は各段階の記録回数の差です。同じ人の追跡ではありません。去った候補には裏への移動も含みます。端末の印なしは除外。筋書きが分かる記録は長篠・関ヶ原だけです。急ぎの判定は毎朝の insight.mjs と同じ規則です。旧版の初戦完了は activation、以降は funnel/first-end を使い、二重には足しません。</p>${early.slice(5).map(([k,n])=>`<div class="row"><span>${esc(sceneName(k))}</span><b>${fmtN(n)}回</b></div>`).join('')}</details></section>
 <section class="card"><h2>次の一手</h2><p class="muted">直近7日から・急ぎだけ、最大3件</p><ol class="action-list">${urgent.map(x=>`<li><strong>${esc(x.key==='start'?x.t.replace(/（.*）/,''):x.t)}</strong><p>${esc(x.key==='err'?x.how.split('：')[0]:x.how)}</p></li>`).join('')||'<li>急ぎの指摘はありません</li>'}</ol></section>
 </div>
 <details class="card daily-details"><summary>日ごとの入手・売上</summary>${(()=>{const ds=(DAILY_SALES?.games?.daimyo||DAILY_SALES)?.days||[],wanted=rangeDays(end,7);return wanted.map(day=>{const d=ds.find(x=>x.d===day);return `<div class="row"><span>${esc(day)}</span><span>${d?`新規 ${fmtN(d.new)}／再入手 ${fmtN(d.re)}／更新 ${fmtN(d.upd)}／${fmtN(d.proceeds)} ${esc((DAILY_SALES?.games?.daimyo||DAILY_SALES)?.cur||'JPY')}`:'集計待ち'}</span></div>`;}).join('');})()}</details>
 <details class="card daily-details" id="feedbackCard"><summary>みんなの声 <span class="muted">新しい順・5件まで</span></summary><div id="feedbackBody">読み込み中…</div></details>
 <details class="card daily-details" id="reviewSigns"><summary>レビューの兆し <span class="muted">直近7日</span></summary><dl class="review-grid">
 <div><dt>知らせの閉じる率</dt><dd>${pct(review.noticeClose,review.noticeShow)}</dd><p class="muted">表示 ${fmtN(review.noticeShow)}／閉じる ${fmtN(review.noticeClose)}回</p></div>
 <div><dt>一括の命令</dt><dd>${fmtN(review.bulk)}回</dd></div>
 <div><dt>優勢になってから統一まで</dt><dd>${review.tailDays===null?'—':review.tailDays.toFixed(1)+'日'}</dd><p class="muted">ゲーム内の暦・統一 ${fmtN(review.tailN)}件／優勢 ${fmtN(review.dominance)}件</p></div>
 <div><dt>手動と自動の比</dt><dd>${fmtN(review.manual)} : ${fmtN(review.auto)}</dd><p class="muted">手動 ${review.manualPct===null?'—':review.manualPct+'％'}</p></div></dl><p class="muted">長篠・関ヶ原。回数は送信された差分の合計です。優勢は自城＋従属城が全国の三分の一に届いた時。手動・自動は開戦時の采配で分類します。</p></details>
 <details class="card daily-details"><summary>管理の設定</summary><div id="dailySettings"></div></details>`;
 if(document.getElementById('gate').style.display==='none')appendUsers();
