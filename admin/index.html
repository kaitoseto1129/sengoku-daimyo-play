<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>戦国立身3D 管理</title>
<style>
:root{--bg:#120f0b;--card:#1d1812;--line:#3a3022;--ink:#efe7d6;--dim:#b3a78f;--kin:#d9b45a;--shu:#e05a44;--moe:#62c46e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 -apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
header{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line);background:#0d0b08;position:sticky;top:0;z-index:2}
header h1{font-size:18px;margin:0;letter-spacing:.08em;font-family:"Hiragino Mincho ProN","Yu Mincho",serif}
header .sub{margin-left:auto;color:var(--dim);font-size:13px}
main{max-width:1120px;margin:0 auto;padding:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.card h2{font-size:13px;color:var(--dim);margin:0 0 4px;font-weight:600;letter-spacing:.05em}
.big{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.3}
.big small{font-size:13px;color:var(--dim);font-weight:500;margin-left:6px}
.muted{color:var(--dim);font-size:13px}
.up{color:var(--moe)}.down{color:var(--shu)}
.sec{margin-top:16px}.sec>h2{font-size:16px;color:var(--ink);margin:0 0 10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px dashed var(--line);font-variant-numeric:tabular-nums}
.row:last-child{border:0}
.rv{padding:8px 0;border-bottom:1px dashed var(--line)}.rv:last-child{border:0}.rv b{color:var(--kin)}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--dim);font-weight:600}
svg{width:100%;height:auto;display:block}
.note{background:#0d0b08;border-radius:6px;padding:10px 12px;font-size:13px;color:var(--dim);line-height:1.6}
#gate{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:9}
#gate form{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:26px 28px;width:min(92vw,360px);display:flex;flex-direction:column;gap:10px}
#gate input{background:#0d0b08;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:10px;font-size:16px;min-height:44px}
#gate button{background:var(--kin);color:#1a1208;border:none;border-radius:6px;padding:11px;font-weight:800;font-size:16px;cursor:pointer;min-height:44px}
#gate .err{color:var(--shu);font-size:13px;min-height:16px}
a{color:var(--kin)}
@media(max-width:700px){.two{grid-template-columns:1fr}.big{font-size:26px}}
</style>
</head>
<body>
<div id="gate"><form id="loginForm">
  <div style="font-size:18px;font-weight:800;letter-spacing:.1em">戦国立身3D　管理</div>
  <input id="em" type="email" placeholder="メールアドレス" autocomplete="username">
  <input id="pw" type="password" placeholder="パスワード" autocomplete="current-password">
  <button type="submit">入る</button>
  <div class="err" id="gateErr"></div>
</form></div>
<header><h1>戦国立身3D　管理</h1><div class="sub" id="updated">読み込み中…</div></header>
<main id="main"></main>
<script>
/* 入口：合言葉は手元で照らし合わせる（軽い鍵。数字だけの画面なのでこれで十分）。通れば三十日おぼえる */
/* 第253巡（作り手：管理画面に人を追加できるように）：入れる人の一覧。足すときは下の「人を足す」で作った行をここに加える（合言葉そのものは置かない） */
const USERS=[
  {email:"kaitoseto1129@gmail.com", hash:"57f3833bb5286c81572f087fc31cae5f081e8e7001462e05312832163de6dfc3", name:"作り手"},
];
/* 第258巡（kaito：メアドとパスワードを入れたら、その人も入れるように。シンプルに）：足した人は users.json に置く。
   管理画面の「入れる人」で足すと、その場で倉の users.json に書き込む（GitHub の鍵はこのブラウザにだけ置く） */
let USERS_EXTRA=[];
async function loadUsers(){ try{ const r=await fetch("users.json?t="+Date.now(),{cache:"no-store"}); if(r.ok){ const j=await r.json(); if(Array.isArray(j)) USERS_EXTRA=j; } }catch(_){ } return USERS.concat(USERS_EXTRA); }
async function sha256(s){ const b=await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join(""); }
function opened(){ try{ const t=+localStorage.getItem("sd_admin_ok")||0; return Date.now()-t<30*864e5; }catch(e){ return false; } }
/* 第257巡（kaito：管理画面に入れない）：入れていないと、ブラウザの吹き出しが題の上に出るだけで
   どこが足りないか分からなかった。自分で確かめて、札の中に日本語で出す */
document.getElementById("loginForm").onsubmit=async e=>{ e.preventDefault();
  { const e1=document.getElementById("em").value.trim(), p1=document.getElementById("pw").value;
    if(!e1||!p1){ document.getElementById("gateErr").textContent=!e1&&!p1?"メールアドレスと合言葉を入れてください":(!e1?"メールアドレスを入れてください":"合言葉を入れてください（自動入力が入っていないことがあります。一度押して入れ直してください）");
      document.getElementById(!e1?"em":"pw").focus(); return; } }
  const em=document.getElementById("em").value.trim().toLowerCase(); const h=await sha256(document.getElementById("pw").value);
  const u=(await loadUsers()).find(x=>x.email.toLowerCase()===em && x.hash===h);
  if(u){ try{ localStorage.setItem("sd_admin_ok", String(Date.now())); localStorage.setItem("sd_admin_who", u.name||em); }catch(_){ } document.getElementById("gate").style.display="none"; load(); }
  else document.getElementById("gateErr").textContent="メールアドレスか合言葉が違います"; };
if(opened()){ document.getElementById("gate").style.display="none"; }
/* 第258巡：人を足す・外す。users.json を GitHub に直接書く。パスワードそのものは置かない（SHA-256 の印だけ） */
const GH_REPO="kaitoseto1129/sengoku-daimyo-play", GH_PATH="admin/users.json";
function ghKey(){ try{ return localStorage.getItem("sd_gh_key")||""; }catch(_){ return ""; } }
async function ghSaveUsers(list){
  const key=ghKey(); if(!key) throw new Error("nokey");
  const api=`https://api.github.com/repos/${GH_REPO}/contents/${GH_PATH}`, hd={Authorization:"Bearer "+key, Accept:"application/vnd.github+json"};
  const cur=await fetch(api+"?t="+Date.now(),{headers:hd,cache:"no-store"}); const sha=cur.ok?(await cur.json()).sha:undefined;
  const body=JSON.stringify(list,null,2)+"\n"; const b64=btoa(unescape(encodeURIComponent(body)));
  const r=await fetch(api,{method:"PUT",headers:hd,body:JSON.stringify({message:"管理画面：入れる人を更新",content:b64,sha})});
  if(!r.ok) throw new Error(r.status===401||r.status===403?"badkey":"save "+r.status);
}
function usersCard(){ const el=document.createElement("div"); el.className="card";
  const inp='style="flex:1;min-width:160px;padding:10px 12px;min-height:44px;border-radius:6px;border:1px solid #3a3020;background:#0F0D09;color:#EDE6D6;font-size:16px"';
  const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const draw=()=>{ const all=USERS.concat(USERS_EXTRA);
    el.innerHTML=`<h2>入れる人</h2>
    <div>${all.map(u=>`<div class="row" style="align-items:center;min-height:44px"><span><b>${esc(u.name||"")}</b>（${esc(u.email)}）</span>${USERS_EXTRA.includes(u)?`<button type="button" data-rm="${esc(u.email)}" style="min-height:44px;min-width:44px;background:none;border:1px solid #5a4a2a;color:#EDE6D6;border-radius:6px;padding:0 12px;cursor:pointer">外す</button>`:'<span class="muted">作り手</span>'}</div>`).join("")}</div>
    <div class="note" style="margin-top:10px">メールアドレスとパスワードを入れて「入れるようにする」。一、二分でその人も入れます。</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px"><input id="nuEm" type="email" placeholder="メールアドレス" autocomplete="off" ${inp}><input id="nuNm" placeholder="呼び名（例：広告担当）" ${inp}><input id="nuPw" type="text" placeholder="パスワード" autocomplete="off" ${inp}><button type="button" id="nuGo" style="min-height:44px;padding:0 18px;border:none;border-radius:6px;background:#C9A227;color:#1a1408;font-weight:800;font-size:16px;cursor:pointer">入れるようにする</button></div>
    <div id="nuKeyBox" style="display:${ghKey()?"none":"block"};margin-top:10px" class="note">最初の一度だけ：GitHub の鍵を入れてください（<a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener" style="color:#FFD166">ここで作る</a>：Repository access で <b>sengoku-daimyo-play</b> だけを選び、Permissions の <b>Contents</b> を Read and write に）。鍵はこのブラウザにだけ残ります。
      <div style="display:flex;gap:8px;margin-top:6px"><input id="nuKey" type="password" placeholder="github_pat_…" autocomplete="off" ${inp}></div></div>
    <div id="nuMsg" class="note" style="margin-top:8px;color:#FFD166;display:none"></div>`;
    const msg=t=>{ const m=el.querySelector("#nuMsg"); m.textContent=t; m.style.display=t?"block":"none"; };
    const save=async(list,okText)=>{ const k=el.querySelector("#nuKey"); if(k&&k.value.trim()){ try{ localStorage.setItem("sd_gh_key",k.value.trim()); }catch(_){ } }
      if(!ghKey()){ msg("先に GitHub の鍵を入れてください（下の欄）"); return false; }
      msg("書き込んでいます…");
      try{ await ghSaveUsers(list); USERS_EXTRA=list; draw(); msg2(okText); return true; }
      catch(e){ if(e.message==="badkey"){ try{ localStorage.removeItem("sd_gh_key"); }catch(_){ } draw(); msg2("GitHub の鍵が通りませんでした。作り直して入れてください"); } else msg("書き込めませんでした（"+e.message+"）。もう一度押してください"); return false; } };
    el.querySelector("#nuGo").onclick=async()=>{ const em=el.querySelector("#nuEm").value.trim().toLowerCase(), nm=el.querySelector("#nuNm").value.trim(), pw=el.querySelector("#nuPw").value;
      if(!em||!pw){ msg("メールアドレスとパスワードを入れてください"); return; }
      const h=await sha256(pw); const list=USERS_EXTRA.filter(u=>u.email.toLowerCase()!==em).concat([{email:em,hash:h,name:nm||em}]);
      await save(list, `${nm||em} が入れるようになりました（反映まで一、二分）。メールアドレスとパスワードをその人に伝えてください`); };
    el.querySelectorAll("[data-rm]").forEach(b=>b.onclick=async()=>{ const em=b.dataset.rm; if(!confirm(em+" を外しますか")) return; await save(USERS_EXTRA.filter(u=>u.email!==em), em+" を外しました（反映まで一、二分）"); });
  };
  const msg2=t=>{ const m=el.querySelector("#nuMsg"); if(m){ m.textContent=t; m.style.display="block"; } };
  loadUsers().then(draw); draw();
  return el; }
const esc=t=>String(t??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=n=>n==null||isNaN(n)?"—":Number(n).toLocaleString("ja-JP");
const delta=n=>n==null?"":`<span class="${n>0?"up":n<0?"down":""}">${n>0?"+":""}${fmt(n)}</span>`;
const getJson=async u=>{ try{ const r=await fetch(u+(u.includes("?")?"&":"?")+"t="+Date.now(),{cache:"no-store"}); return r.ok?await r.json():null; }catch(_){ return null; } };
/* App Store の版と評価は Apple の公開の口からも読む（mkadmin の数がまだ無い時の代わり） */
const lookup=()=>new Promise(ok=>{ const cb="lk"+Date.now(); const s=document.createElement("script"); const t=setTimeout(()=>ok(null),8000);
  window[cb]=d=>{ clearTimeout(t); const it=d&&d.results&&d.results[0]; ok(it?{version:it.version,released:(it.currentVersionReleaseDate||"").slice(0,10),rating:it.averageUserRating,ratings:it.userRatingCount}:null); delete window[cb]; s.remove(); };
  s.onerror=()=>{ clearTimeout(t); ok(null); }; s.src="https://itunes.apple.com/lookup?id=6816750198&country=jp&callback="+cb; document.head.appendChild(s); });
function bars(days,key,color){ if(!days.length) return '<div class="muted">まだ数がありません</div>';
  const W=640,H=110,mx=Math.max(1,...days.map(d=>d[key]||0)),w=(W-8)/days.length;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="日ごとの数">${days.map((d,i)=>{ const h=Math.round((H-24)*(d[key]||0)/mx); return `<rect x="${(4+i*w+1).toFixed(1)}" y="${H-14-h}" width="${Math.max(2,w-2).toFixed(1)}" height="${h}" fill="${color}" rx="1"><title>${esc(d.d||d.date)}　${fmt(d[key])}</title></rect>`; }).join("")}<text x="4" y="${H-1}" fill="#b3a78f" font-size="11">${esc((days[0].d||days[0].date||"").slice(5))}</text><text x="${W-4}" y="${H-1}" fill="#b3a78f" font-size="11" text-anchor="end">${esc((days.at(-1).d||days.at(-1).date||"").slice(5))}</text></svg>`; }
async function load(){
  const [A,sales,meta,live]=await Promise.all([getJson("../risshin/data/admin.json"),getJson("sales.json"),getJson("meta.json"),lookup()]);
  const app=(A&&A.app&&A.app.version)?A.app:live||{}, S=(sales&&sales.games&&sales.games.risshin)||null, days=S?(S.days||[]).slice(-30):[];
  const sum=(a,k)=>a.reduce((t,d)=>t+(d[k]||0),0), last7=days.slice(-7), prev7=days.slice(-14,-7);
  const yt=A&&A.youtube||{}, ig=A&&A.instagram, lc=A&&A.lancers, h=A&&A.health, ph=A&&A.iphone, st=A&&A.store||{};
  const reviews=(A&&A.app&&A.app.reviews)||[];
  const crash=h&&h.rows?h.rows.find(r=>r.metric==="終わった数"):null;
  document.getElementById("updated").textContent=A?("数の更新 "+new Date(A.made).toLocaleString("ja-JP")):"mkadmin の数はまだ届いていません";
  const ad=(meta&&meta.risshin)||[], adDays=ad.slice(-30);
  const lcBest=lc&&lc.rows&&lc.rows.length?lc.rows.reduce((a,b)=>(b.score??-1)>(a.score??-1)?b:a):null;
  document.getElementById("main").innerHTML=`
  <div class="kpis">
    <div class="card"><h2>App Store の版</h2><div class="big">${esc(app.version||"—")}</div><div class="muted">${app.released?esc(app.released)+" 公開":""}</div></div>
    <div class="card"><h2>評価</h2><div class="big">${app.rating!=null?"★ "+Number(app.rating).toFixed(2):"—"}<small>${fmt(app.ratings)} 件</small></div><div class="muted">レビュー ${reviews.length?reviews.length+" 件（新しい物）":"まだ無し"}</div></div>
    <div class="card"><h2>遊んだ人（入れた人）</h2><div class="big">${fmt(S&&S.total_new)}<small>累計</small></div><div class="muted">この7日 ${fmt(sum(last7,"new"))}（前の7日 ${fmt(sum(prev7,"new"))}）</div></div>
    <div class="card"><h2>落ち</h2><div class="big">${crash?fmt(crash.value):st.crashes!=null?fmt(st.crashes):"—"}</div><div class="muted">${crash?esc(crash.device||"")+" "+esc(crash.percentile||""):"App Store Connect の診断"}</div></div>
    <div class="card"><h2>重さ（実機 iPhone）</h2><div class="big">${ph?fmt(ph.median)+"<small>ms 中央</small>":"—"}</div><div class="muted">${ph?"上位5% "+fmt(ph.p95)+" ms・"+esc(ph.at):"まだ測っていない"}</div></div>
    <div class="card"><h2>YouTube</h2><div class="big">${fmt(yt.subscribers)}<small>登録 ${delta(yt.subscriberDelta)}</small></div><div class="muted">総再生 ${fmt(yt.views)} ${delta(yt.viewDelta)}</div></div>
    <div class="card"><h2>インスタ</h2><div class="big">${ig?fmt(ig.followers)+"<small>フォロワー</small>":"—"}</div><div class="muted">${ig?"再生 "+fmt(ig.views)+"・投稿 "+fmt(ig.posts):"reports/ig-stats.md 待ち"}</div></div>
    <div class="card"><h2>Lancers の点</h2><div class="big">${lcBest&&lcBest.score!=null?fmt(lcBest.score)+"<small>点</small>":"—"}</div><div class="muted">${lcBest?esc(lcBest.name):"reports/lancers.md 待ち"}</div></div>
  </div>
  <div class="two sec">
    <div class="card"><h2>日ごとに入れた人（30日）</h2>${bars(days,"new","#d9b45a")}<div class="muted">Apple の集計は一〜二日遅れます${sales&&sales.updated?"・"+esc(sales.updated.slice(0,16))+" 取得":""}</div></div>
    <div class="card"><h2>新しいレビュー</h2>${reviews.length?reviews.slice(0,5).map(r=>`<div class="rv"><b>${"★".repeat(r.stars||0)}</b> ${esc(r.title)} <span class="muted">${esc(r.at)}・${esc(r.version)}</span><div class="muted">${esc(r.body)}</div></div>`).join(""):'<div class="muted">文のあるレビューはまだありません</div>'}</div>
  </div>
  <div class="two sec">
    <div class="card"><h2>広告（Meta・30日）</h2>${adDays.length?`<div class="row"><span>使った額</span><b>${fmt(sum(adDays,"spend"))} 円</b></div><div class="row"><span>表示</span><b>${fmt(sum(adDays,"imp"))}</b></div><div class="row"><span>押された</span><b>${fmt(sum(adDays,"link"))}</b></div><div class="row"><span>入れた</span><b>${fmt(sum(adDays,"installs"))}</b></div>`:'<div class="muted">まだ数がありません</div>'}</div>
    <div class="card"><h2>落ちと重さ（Apple の診断）</h2>${h&&h.rows&&h.rows.length?h.rows.slice(0,8).map(r=>`<div class="row"><span>${esc(r.metric)} ${esc(r.percentile||"")}<span class="muted"> ${esc(r.device||"")}</span></span><b>${fmt(r.value)} ${esc(r.unit||"")}</b></div>`).join(""):'<div class="muted">まだ数がありません</div>'}</div>
  </div>
  ${yt.top&&yt.top.length?`<div class="card sec"><h2>この7日よく見られた動画</h2>${yt.top.map(v=>`<div class="row"><span>${esc(v.name)}</span><b>${fmt(v.views)}</b></div>`).join("")}</div>`:""}
  ${lc&&lc.rows&&lc.rows.length?`<div class="card sec"><h2>Lancers（遊んでもらった人の点）</h2>${lc.rows.map(r=>`<div class="row"><span>${esc(r.name)}</span><span>${esc(r.note)}</span></div>`).join("")}</div>`:""}
  ${A&&A.battles?`<div class="card sec"><h2>戦ごと（bot と重さ）</h2><table><thead><tr><th>戦</th><th>bot</th><th>三角（万）</th></tr></thead><tbody>${A.battles.map(b=>`<tr><td>${esc(b.name)}</td><td>${b.bot?(b.bot.win?"勝ち":"負け")+(b.bot.down?"・倒れた":""):"—"}</td><td>${b.perf&&b.perf.triangles!=null?fmt(b.perf.triangles):"—"}</td></tr>`).join("")}</tbody></table></div>`:""}`;
  try{ document.getElementById("main").appendChild(Object.assign(usersCard(),{className:"card sec"})); }catch(_){ }
}
if(opened()) load();
</script>
</body>
</html>
