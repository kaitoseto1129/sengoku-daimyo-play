<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>戦国大名 管理</title>
<style>
:root{ --bg:#17150F; --card:#221E16; --line:#3A3326; --ink:#EDE6D6; --dim:#A79E8C; --kin:#C9A227; --ai:#5B8DEF; --shu:#E24A3A; --moe:#4CC45C; }
*{ box-sizing:border-box; }
body{ margin:0; background:var(--bg); color:var(--ink); font-family:"Hiragino Sans","Zen Kaku Gothic New",sans-serif; font-size:14px; }
header{ display:flex; align-items:center; gap:14px; padding:12px 18px; border-bottom:1px solid var(--line); background:#1B1811; position:sticky; top:0; z-index:2; }
header h1{ font-size:17px; margin:0; letter-spacing:.08em; }
header .sub{ color:var(--dim); font-size:12px; margin-left:auto; }
main{ max-width:1100px; margin:0 auto; padding:16px; }
.grid{ display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); }
.card{ background:var(--card); border:1px solid var(--line); border-radius:8px; padding:14px 16px; }
.card h2{ font-size:13px; color:var(--dim); margin:0 0 8px; font-weight:600; letter-spacing:.05em; }
.big{ font-size:30px; font-weight:800; font-variant-numeric:tabular-nums; }
.big small{ font-size:12px; color:var(--dim); font-weight:500; margin-left:6px; }
.row{ display:flex; justify-content:space-between; align-items:center; padding:5px 0; border-bottom:1px dashed var(--line); font-variant-numeric:tabular-nums; }
.row:last-child{ border-bottom:none; }
.row .n{ font-weight:700; }
.bar{ height:6px; background:#0F0D09; border-radius:3px; overflow:hidden; margin-top:3px; }
.bar i{ display:block; height:100%; background:var(--kin); }
.muted{ color:var(--dim); font-size:12px; }
.sec{ margin-top:18px; }
.sec h2{ font-size:15px; margin:0 0 8px; }
.tabs{ display:flex; gap:6px; margin-left:8px; }
.tabs button{ background:#0F0D09; color:var(--ink); border:1px solid var(--line); border-radius:6px; padding:5px 10px; cursor:pointer; font-size:12px; }
.tabs button.on{ background:var(--kin); color:#1A1208; border-color:var(--kin); font-weight:700; }
svg{ width:100%; height:auto; display:block; }
.funnel{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:8px; }
.funnel .st{ background:#0F0D09; border-radius:6px; padding:10px; text-align:center; }
.funnel .st b{ display:block; font-size:22px; }
.funnel .st span{ font-size:11px; color:var(--dim); }
.funnel .st em{ display:block; font-style:normal; font-size:11px; color:var(--kin); margin-top:2px; }
#gate{ position:fixed; inset:0; background:var(--bg); display:flex; align-items:center; justify-content:center; z-index:9; }
#gate form{ background:var(--card); border:1px solid var(--line); border-radius:10px; padding:26px 28px; width:min(92vw,360px); display:flex; flex-direction:column; gap:10px; }
#gate input{ background:#0F0D09; color:var(--ink); border:1px solid var(--line); border-radius:6px; padding:10px; font-size:15px; }
#gate button{ background:var(--kin); color:#1A1208; border:none; border-radius:6px; padding:11px; font-weight:800; font-size:15px; cursor:pointer; }
#gate .err{ color:var(--shu); font-size:12px; min-height:16px; }
a{ color:var(--ai); }
.note{ background:#0F0D09; border-radius:6px; padding:10px 12px; font-size:12px; color:var(--dim); line-height:1.6; }
/* 左上の切り替え（戦国大名 ⇄ 戦国立身）：押せる所は 44px 以上。キーボードでも（Enter・矢印・Esc） */
.gsw{ position:relative; }
.gsw > button{ min-height:44px; min-width:44px; display:flex; align-items:center; gap:8px; background:transparent; color:var(--ink); border:1px solid var(--line); border-radius:8px; padding:6px 12px; cursor:pointer; font:inherit; }
.gsw > button:hover{ border-color:var(--kin); }
.gsw > button:focus-visible, .gsw [role=menuitemradio]:focus-visible{ outline:2px solid var(--kin); outline-offset:2px; }
.gsw > button h1{ font-size:17px; margin:0; letter-spacing:.08em; }
.gsw > button .tag{ font-size:11px; font-weight:800; padding:2px 7px; border-radius:4px; background:var(--kin); color:#1A1208; letter-spacing:.05em; }
.gsw > button .tag.r{ background:var(--ai); color:#fff; }
.gsw > button .car{ color:var(--dim); font-size:12px; }
.gsw [role=menu]{ position:absolute; left:0; top:calc(100% + 6px); background:var(--card); border:1px solid var(--line); border-radius:8px; padding:6px; min-width:300px; box-shadow:0 10px 30px rgba(0,0,0,.5); z-index:5; }
.gsw [role=menuitemradio]{ display:flex; align-items:center; gap:10px; width:100%; min-height:48px; padding:8px 12px; background:transparent; color:var(--ink); border:none; border-radius:6px; cursor:pointer; font:inherit; font-size:15px; text-align:left; white-space:nowrap; }
.gsw [role=menuitemradio]:hover{ background:#0F0D09; }
.gsw [role=menuitemradio] .ck{ width:18px; color:var(--kin); font-weight:900; }
.gsw [role=menuitemradio][aria-checked=true]{ background:#0F0D09; font-weight:800; }
.gsw [role=menuitemradio] small{ color:var(--dim); font-size:11px; margin-left:auto; }
body.risshin header{ border-bottom-color:var(--ai); }
</style>
</head>
<body>
<div id="gate"><form id="loginForm">
  <div style="font-size:18px;font-weight:800;letter-spacing:.1em">戦国大名　管理</div>
  <input id="em" type="email" placeholder="メールアドレス" autocomplete="username">
  <input id="pw" type="password" placeholder="合言葉" autocomplete="current-password">
  <button type="submit">入る</button>
  <div class="err" id="gateErr"></div>
  <button type="button" id="mkHash" style="background:none;border:none;color:#C9A227;font-size:14px;text-decoration:underline;padding:6px;min-height:44px;cursor:pointer">入れない時：合言葉のしるしを出す</button>
</form></div>

<header>
  <div class="gsw" id="gsw">
    <button type="button" id="gameBtn" aria-haspopup="menu" aria-expanded="false" aria-controls="gameMenu" title="管理する遊びを切り替える"><h1 id="gameTitle">戦国大名　管理</h1><span class="tag" id="gameTag">大名</span><span class="car" aria-hidden="true">▾</span></button>
    <div role="menu" id="gameMenu" aria-label="管理する遊び" hidden>
      <button type="button" role="menuitemradio" data-g="daimyo" aria-checked="true"><span class="ck" aria-hidden="true"></span>戦国大名<small>/sengoku-daimyo-play/</small></button>
      <button type="button" role="menuitemradio" data-g="risshin" aria-checked="false"><span class="ck" aria-hidden="true"></span>戦国立身<small>/risshin/</small></button>
    </div>
  </div>
  <div class="tabs" id="rangeTabs"><button data-r="d1">1日</button><button data-r="d7">7日</button><button data-r="d30" class="on">30日</button><button data-r="d90">90日</button></div>
  <div class="sub" id="updated">読み込み中…</div>
</header>
<main id="main"></main>

<script>
/* 入口：合言葉は手元で照らし合わせる（軽い鍵。数字だけの画面なのでこれで十分）。通れば三十日おぼえる */
/* 第253巡（作り手：管理画面に人を追加できるように）：入れる人の一覧。足すときは下の「人を足す」で作った行をここに加える（合言葉そのものは置かない） */
const USERS=[
  {email:"kaitoseto1129@gmail.com", hash:"57f3833bb5286c81572f087fc31cae5f081e8e7001462e05312832163de6dfc3", name:"作り手"},
];
async function sha256(s){ const b=await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join(""); }
function opened(){ try{ const t=+localStorage.getItem("sd_admin_ok")||0; return Date.now()-t<30*864e5; }catch(e){ return false; } }
/* 第257巡（kaito：管理画面に入れない）：入れていないと、ブラウザの吹き出しが題の上に出るだけで
   どこが足りないか分からなかった。自分で確かめて、札の中に日本語で出す */
document.getElementById("loginForm").onsubmit=async e=>{ e.preventDefault();
  { const e1=document.getElementById("em").value.trim(), p1=document.getElementById("pw").value;
    if(!e1||!p1){ document.getElementById("gateErr").textContent=!e1&&!p1?"メールアドレスと合言葉を入れてください":(!e1?"メールアドレスを入れてください":"合言葉を入れてください（自動入力が入っていないことがあります。一度押して入れ直してください）");
      document.getElementById(!e1?"em":"pw").focus(); return; } }
  const em=document.getElementById("em").value.trim().toLowerCase(); const h=await sha256(document.getElementById("pw").value);
  const u=USERS.find(x=>x.email.toLowerCase()===em && x.hash===h);
  if(u){ try{ localStorage.setItem("sd_admin_ok", String(Date.now())); localStorage.setItem("sd_admin_who", u.name||em); }catch(_){ } document.getElementById("gate").style.display="none"; load(); }
  else document.getElementById("gateErr").textContent="メールアドレスか合言葉が違います"; };
/* 第257巡（kaito：入れない）：合言葉そのものは誰にも渡さず、「しるし」（SHA-256）だけを出す。
   これを作り手に送れば、この画面の名簿を書き換えて入れるようになる */
document.getElementById("mkHash").onclick=async()=>{
  const pw=document.getElementById("pw").value;
  const er=document.getElementById("gateErr");
  if(!pw){ er.textContent="先に合言葉の欄に、使いたい合言葉を入れてください"; document.getElementById("pw").focus(); return; }
  const h=await sha256(pw);
  er.innerHTML="この長い字を作り手に送ってください（合言葉そのものは送らないで）<br><span style=\"user-select:all;word-break:break-all;color:#EDE6D6\">"+h+"</span>";
  try{ await navigator.clipboard.writeText(h); er.innerHTML+="<br>（写し取りました）"; }catch(_){ }
};
if(opened()){ document.getElementById("gate").style.display="none"; }
function showSales(){ try{ fetch("sales.json?"+Date.now()).then(r=>r.ok?r.json():null).then(x=>{ if(!x) return;
  const el=document.getElementById("salesBox"); if(!el) return;
  const ds=(x.days||[]).slice(-30); const mx=Math.max(1,...ds.map(d=>d.new||0));
  const W=640,H=90,p=6, xs=i2=>p+(W-p*2)*(ds.length>1?i2/(ds.length-1):.5);
  const bars=ds.map((d,i2)=>{ const h=Math.round((H-20)*(d.new||0)/mx); const w=Math.max(3,(W-p*2)/Math.max(1,ds.length)-2);
    return `<rect x="${(xs(i2)-w/2).toFixed(1)}" y="${H-10-h}" width="${w.toFixed(1)}" height="${h}" fill="${d.units?'#E3C25A':'#6b5a2a'}" rx="1"><title>${d.d} 入れた ${d.new||0}人${d.units?'・課金 '+d.units+'本':''}</title></rect>`; }).join("");
  const last=ds.length?ds[ds.length-1]:null;
  el.innerHTML=`<div style="border-top:1px solid rgba(237,230,214,.12);margin-top:10px;padding-top:10px">
    <div style="font-size:14px;letter-spacing:.08em;color:#C9A227">App Store（アプリ）</div>
    <div style="display:flex;gap:18px;flex-wrap:wrap;align-items:baseline;margin-top:4px">
      <div><b style="font-size:26px">${x.total_new||0}</b><span class="muted"> 人が入れた（30日）</span></div>
      <div><b style="font-size:26px">${x.total_units||0}</b><span class="muted"> 本の課金</span></div>
      <div><b style="font-size:26px">${x.total_proceeds||0}</b><span class="muted"> ${x.cur||"JPY"} の入金</span></div>
    </div>
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:640px;height:auto;margin-top:6px">${bars}</svg>
    <div class="muted" style="font-size:14px">日ごとに入れた人（金色の日は課金あり）${last?`／最後の日 ${last.d} は ${last.new||0}人`:""}。
    Apple の集計は一〜二日遅れます。${(x.updated||"").slice(0,16)} 取得</div></div>`;
}).catch(()=>{}); }catch(_){ } }
const _load0=load; load=async function(){ await _load0(); try{ if(!document.getElementById("nuGo")) document.getElementById("main").appendChild(usersCard()); }catch(_){ } showSales(); };

let DATA=null, RANGE="d30";
/* 遊びの切り替え（戦国大名 ⇄ 戦国立身）。中身は同じ作りで、数は GoatCounter の道の頭で分ける：
   戦国立身は /risshin/（頁）と risshin/ev/…（出来事）。戦国大名はそれ以外。?game=risshin か #risshin で開ける */
const GAMES={ daimyo:{name:"戦国大名", tag:"大名"}, risshin:{name:"戦国立身", tag:"立身"} };
let GAME=(()=>{ try{ const q=new URLSearchParams(location.search).get("game"); if(q&&GAMES[q]) return q; if(/^#?risshin$/.test(location.hash)) return "risshin"; }catch(_){ } return "daimyo"; })();
const RISSHIN_RE=/^\/?risshin(\/|$)/;
function gameHits(hits){
  const out=[];
  for(const h of (hits||[])){ const p=String(h.path||""); const isR=RISSHIN_RE.test(p);
    if(GAME==="risshin"){ if(!isR) continue; out.push(h.event?{...h, path:p.replace(/^\/?risshin\//,"")}:h); }
    else if(!isR) out.push(h); }
  return out;
}
function setGame(g, focus){
  if(!GAMES[g]) return; GAME=g;
  try{ const u=new URL(location.href); if(g==="daimyo") u.searchParams.delete("game"); else u.searchParams.set("game",g); u.hash=""; history.replaceState(null,"",u); }catch(_){ }
  applyGame(); render(); loadExtras();
  if(focus) document.getElementById("gameBtn").focus();
}
function applyGame(){
  const G=GAMES[GAME]; document.getElementById("gameTitle").textContent=G.name+"　管理"; document.title=G.name+" 管理";
  const tag=document.getElementById("gameTag"); tag.textContent=G.tag; tag.classList.toggle("r",GAME==="risshin");
  document.getElementById("gameBtn").setAttribute("aria-label","いま："+G.name+" の管理。押すと切り替え");
  document.body.classList.toggle("risshin",GAME==="risshin");
  document.querySelectorAll("#gameMenu [role=menuitemradio]").forEach(b=>{ const on=b.dataset.g===GAME; b.setAttribute("aria-checked",on?"true":"false"); b.querySelector(".ck").textContent=on?"✓":""; });
}
(function(){ const btn=document.getElementById("gameBtn"), menu=document.getElementById("gameMenu"); const items=()=>[...menu.querySelectorAll("[role=menuitemradio]")];
  const open=()=>{ menu.hidden=false; btn.setAttribute("aria-expanded","true"); (items().find(b=>b.dataset.g===GAME)||items()[0]).focus(); };
  const close=(f)=>{ menu.hidden=true; btn.setAttribute("aria-expanded","false"); if(f) btn.focus(); };
  btn.onclick=()=>{ if(menu.hidden) open(); else close(); };
  btn.onkeydown=e=>{ if(e.key==="ArrowDown"||e.key==="ArrowUp"){ e.preventDefault(); open(); } };
  menu.onkeydown=e=>{ const it=items(), i=it.indexOf(document.activeElement);
    if(e.key==="ArrowDown"){ e.preventDefault(); it[(i+1)%it.length].focus(); }
    else if(e.key==="ArrowUp"){ e.preventDefault(); it[(i-1+it.length)%it.length].focus(); }
    else if(e.key==="Escape"){ e.preventDefault(); close(true); }
    else if(e.key==="Tab"){ close(false); } };
  items().forEach(b=>b.onclick=()=>{ close(false); setGame(b.dataset.g, true); });
  document.addEventListener("click",e=>{ if(!menu.hidden&&!document.getElementById("gsw").contains(e.target)) close(false); });
  applyGame();
})();
document.querySelectorAll("#rangeTabs button").forEach(b=>b.onclick=()=>{ RANGE=b.dataset.r; document.querySelectorAll("#rangeTabs button").forEach(x=>x.classList.toggle("on",x===b)); render(); });
/* 人を足す：ここで合言葉の指紋（SHA-256）を作り、その行を作り手に渡す（か admin/index.html の USERS に足す）。合言葉そのものはどこにも送らない */
function usersCard(){ const el=document.createElement("div"); el.className="card"; el.innerHTML=`<h2>入れる人</h2><div class="note">いま入れる人：${USERS.map(u=>`<b>${u.name||""}</b>（${u.email}）`).join("、")}</div>
  <div class="note" style="margin-top:8px">人を足す：メールアドレスと合言葉を入れて「行を作る」。出てきた一行を作り手へ渡すと、次の版から入れます。合言葉そのものは送られません（指紋だけ）。</div>
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><input id="nuEm" type="email" placeholder="メールアドレス" style="flex:1;min-width:200px;padding:8px 10px;border-radius:6px;border:1px solid #3a3020;background:#0F0D09;color:#EDE6D6"><input id="nuNm" placeholder="呼び名（例：広告担当）" style="flex:1;min-width:140px;padding:8px 10px;border-radius:6px;border:1px solid #3a3020;background:#0F0D09;color:#EDE6D6"><input id="nuPw" type="password" placeholder="合言葉" style="flex:1;min-width:140px;padding:8px 10px;border-radius:6px;border:1px solid #3a3020;background:#0F0D09;color:#EDE6D6"><button id="nuGo" style="padding:8px 14px;border-radius:6px;border:1px solid #C9A227;background:#C9A227;color:#1A1208;font-weight:800;cursor:pointer">行を作る</button></div>
  <pre id="nuOut" style="margin-top:10px;white-space:pre-wrap;word-break:break-all;background:#0F0D09;padding:10px;border-radius:6px;font-size:12px;color:#FFD166;display:none"></pre>`;
  el.querySelector("#nuGo").onclick=async()=>{ const em=el.querySelector("#nuEm").value.trim().toLowerCase(), nm=el.querySelector("#nuNm").value.trim(), pw=el.querySelector("#nuPw").value; if(!em||!pw){ alert("メールアドレスと合言葉を"); return; } const h=await sha256(pw); const line=`  {email:"${em}", hash:"${h}", name:"${nm||em}"},`; const o=el.querySelector("#nuOut"); o.style.display="block"; o.textContent=line+"\n\n↑ この一行をコピーして作り手へ（目安箱でも可）。admin/index.html の USERS に足せば入れるようになります"; try{ await navigator.clipboard.writeText(line); o.textContent+="\n（コピーしました）"; }catch(_){ } el.querySelector("#nuPw").value=""; };
  return el; }
async function load(){
  try{ const r=await fetch("stats.json?t="+Date.now(), {cache:"no-store"}); if(!r.ok) throw new Error(r.status); DATA=await r.json(); }
  catch(e){ document.getElementById("main").innerHTML=`<div class="card"><h2>まだ数がありません</h2><div class="note">stats.json がまだ作られていません。GitHub の <b>sengoku-daimyo-play</b> リポジトリで、<br>① Settings → Secrets and variables → Actions に <b>GOATCOUNTER_TOKEN</b>（GoatCounter の Settings → API tokens で「Read statistics」を付けて作った鍵）を入れる<br>② Actions → <b>stats</b> → Run workflow を一度押す<br>あとは六時間ごとに勝手に更新されます。</div></div>`; return; }
  document.getElementById("updated").textContent="更新 "+new Date(DATA.generated).toLocaleString("ja-JP");
  render();
  loadExtras();
}
/* 第253巡（作り手：管理画面を見なくても、クロードが自分で手を打つ）：その記録を載せる。
   戦国立身の時は ../risshin/data/kaizen.json（夜の順番表で済にした物）と、テストプレイヤー（bot）の声 ../risshin/data/players.md（あれば） */
async function loadExtras(){
  const g=GAME;
  try{
    const kr=await fetch((g==="risshin"?"../risshin/data/kaizen.json":"kaizen.json")+"?t="+Date.now(), {cache:"no-store"});
    if(kr.ok&&g===GAME){ const K=await kr.json(); const it=(K.items||[]).slice(-12).reverse();
      const card=document.getElementById("kaizenCard"); if(false && it.length&&card){ card.hidden=false;   /* 第256巡（作り手）：この欄は出さない。記録は kaizen.json に残す */
        document.getElementById("kaizenBody").innerHTML=it.map(x=>`<div style="margin:8px 0;padding:8px 10px;border-radius:8px;background:#0F0D09;border-left:3px solid #4C9A5A">
          <div style="font-weight:700;color:var(--kin)">${esc(x.date||"")}　${esc(x.title||"")}</div>
          <div class="note" style="margin-top:4px">やったこと：${esc(x.did||"")}</div>
          ${x.from?`<div class="note">きっかけ：${esc(x.from)}</div>`:""}</div>`).join(""); } }
  }catch(_){ }
  if(g!=="risshin") return;
  try{
    const r=await fetch("../risshin/data/players.md?t="+Date.now(), {cache:"no-store"});
    const card=document.getElementById("voicesCard");
    if(r.ok&&card&&g===GAME){ const md=await r.text(); if(md.trim()&&!/^\s*<!doctype/i.test(md)){ card.hidden=false; document.getElementById("voicesBody").innerHTML=mdHtml(md); } }
  }catch(_){ }
}
/* 声のまとめ（Markdown）をかんたんに HTML に：見出し・箇条・表・段落だけ。中身はすべて esc する */
function mdHtml(md){
  const inl=t=>esc(t).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/`([^`]+)`/g,"<code>$1</code>");
  const out=[]; let list=false, tbl=false;
  const endL=()=>{ if(list){ out.push("</ul>"); list=false; } if(tbl){ out.push("</table>"); tbl=false; } };
  for(const line of md.split("\n")){
    const h=line.match(/^(#{1,4})\s+(.+)/), li=line.match(/^\s*[-*]\s+(.+)/), tr=/^\s*\|.*\|\s*$/.test(line);
    if(h){ endL(); out.push(`<div style="font-weight:800;color:var(--kin);margin:${h[1].length<=2?12:8}px 0 4px">${inl(h[2])}</div>`); }
    else if(li){ if(tbl){ out.push("</table>"); tbl=false; } if(!list){ out.push('<ul style="margin:4px 0;padding-left:20px;line-height:1.7">'); list=true; } out.push(`<li>${inl(li[1])}</li>`); }

        <div class="row"><span>軍資金を「払いました」と押した人</span><span class="n">${fmtN(byPrefix("fund-paid").reduce((a,[,n])=>a+n,0))}</span></div>
        <div class="row"><span>軍資金の額を押した人（ゲーム・ウェブとiPhone）</span><span class="n">${fmtN(ev("fund-click"))}</span></div>
        <div class="row"><span>　そのうち PayPal から戻って「あとで」を押した人</span><span class="n">${fmtN(ev("fund-later"))}</span></div>
        <div class="row"><span>LP で軍資金の額を押した人</span><span class="n">${fmtN(byPrefix("lp").filter(([k])=>/^fund_\d+$/.test(k)).reduce((a,[,n])=>a+n,0))}</span></div>
        <div class="row"><span>関ヶ原（¥500）を「払いました」と押した人</span><span class="n">${fmtN(ev("paid/sekigahara"))}</span></div>
        <div class="note" style="margin-top:8px">お便りはメールで届きます（この数は送った人の数）。支払いは PayPal の頁へ送ったあと、ゲームに戻って自分で「払いました」を押した数――実際に入金があったかどうかは PayPal の明細で確かめてください。iPhone 版の課金はここには出ません（App Store Connect で見る）。</div></div>`}
      
      
    </div>
    <div class="sec card"><h2>日ごと（訪問・遊び始め・初戦を終えた）</h2>
      <svg viewBox="0 0 ${W} ${H}">
        <path d="${path('v')}" fill="none" stroke="#C9A227" stroke-width="2"/>
        <path d="${path('s')}" fill="none" stroke="#5B9BD5" stroke-width="2"/>
        <path d="${path('a')}" fill="none" stroke="#7ED67E" stroke-width="2"/>
        ${ticks}
        <text x="${pad}" y="14" font-size="11" fill="#C9A227">訪問</text>
        <text x="${pad+46}" y="14" font-size="11" fill="#5B9BD5">遊び始め</text>
        <text x="${pad+116}" y="14" font-size="11" fill="#7ED67E">初戦を終えた</text>
      </svg>
      <div class="note">いちばん多い日を天井にした目安です。数字は下の流れの欄に。</div>
    </div>
    <div class="sec card"><h2>日ごとの率（遊び始め率・継続率・離脱率）</h2>
      <svg viewBox="0 0 ${W} ${RH}">
        ${gridY}
        <path d="${rateStart}" fill="none" stroke="#5B9BD5" stroke-width="2"/>
        <path d="${rateAct}" fill="none" stroke="#7ED67E" stroke-width="2"/>
        <path d="${leave}" fill="none" stroke="#E24A3A" stroke-width="2" stroke-dasharray="4 3"/>
        <text x="${rpad}" y="14" font-size="11" fill="#5B9BD5">遊び始め率（訪問のうち）</text>
        <text x="${rpad+150}" y="14" font-size="11" fill="#7ED67E">継続率（遊び始めのうち初戦を終えた）</text>
        <text x="${rpad+380}" y="14" font-size="11" fill="#E24A3A">離脱率</text>
      </svg>
    </div>
    <div class="sec card"><h2>どこまで進んだか（人の数）</h2>
      ${(()=>{ const d=byPrefix("depth"); const order=RS?["始めた","足軽組頭候補","足軽組頭","足軽大将候補","足軽大将"]:["始めた","城3","城5","城10","城20","城30","城50"];
        const rows=order.map(k=>[k, (d.find?0:0)]); const m={}; for(const [k,n] of d) m[k]=n;
        const top=Math.max(1,...order.map(k=>m[k]||0));
        return order.map(k=>`<div class="row"><span style="min-width:72px;display:inline-block">${k}</span><span class="bar" style="display:inline-block;height:10px;background:#C9A227;width:${Math.round((m[k]||0)/top*70)}%"></span> <b>${fmtN(m[k]||0)}</b></div>`).join("");
      })()}
      <div class="note">${RS?"身分がどこまで上がったかで数えています（一度の遊びで一回。人は追いかけていません）。":"城がいくつになったかで数えています（人は追いかけていません）。"}</div>
    </div>
    <div class="sec card"><h2>一回にどれだけ遊んだか（人の数）</h2>
      ${(()=>{ const d=byPrefix("stay"); const order=["1分","5分","15分","30分","60分","120分"];
        const m={}; for(const [k,n] of d) m[k]=n;
        const top=Math.max(1,...order.map(k=>m[k]||0));
        return order.map(k=>`<div class="row"><span style="min-width:72px;display:inline-block">${k}以上</span><span style="display:inline-block;height:10px;background:#5B9BD5;width:${Math.round((m[k]||0)/top*70)}%"></span> <b>${fmtN(m[k]||0)}</b></div>`).join("");
      })()}
    </div>
    <div class="sec card"><h2>流れ（訪問 → 遊び始め → ${L.battle} → ${L.result}）</h2>
      <div class="funnel">
        <div class="st"><b>${fmtN(visits)}</b><span>訪問</span><em>100%</em></div>
        <div class="st"><b>${fmtN(starts)}</b><span>遊び始め</span><em>${pct(starts,visits)}</em></div>
        <div class="st"><b>${fmtN(battles)}</b><span>${L.battle}</span><em>${pct(battles,visits)}</em></div>
        <div class="st"><b>${fmtN(results)}</b><span>${L.result}</span><em>${pct(results,visits)}</em></div>
        ${RS?`<div class="st"><b>${fmtN(act)}</b><span>初戦を終えた</span><em>${pct(act,visits)}</em></div>`:``}
        <div class="st"><b>${fmtN(unlocks)}</b><span>課金（解除）</span><em>${pct(unlocks,visits)}</em></div>
      </div>
      ${(()=>{ const u=platRow("unlock"); return `<div class="muted" style="margin-top:6px">課金の内訳：アプリ ${fmtN(u.app)}／ウェブ ${fmtN(u.web)}${u.tot?"":"（まだ一件もありません）"}</div>`; })()}
      <div id="salesBox" class="muted" style="margin-top:6px"></div>
      <div class="muted" style="margin-top:8px">訪問＝ページを開いた数（出来事の数は含めない）。遊び始めが少なければ入口（題名の画面）、初戦を終えた人が少なければ最初の合戦で躓いている、と読めます。結びは筋書きを最後まで遊んだ人だけなので、ふだんは 0 で構いません。iPhone 版は数えていません（ブラウザ版だけ）。</div>
    </div>
    <div class="sec grid">
      <div class="card"><h2>どの筋書きで始めたか</h2>${list(scen)}</div>
      <div class="card"><h2>${L.startBy}</h2>${list(clans,"",15)}</div>
      <div class="card"><h2>${L.resultKinds}</h2>${list(resultKinds)}</div>
      
      <div class="card"><h2>${L.battleKinds}</h2>${list(battleKinds)}</div>
    </div>
    <div class="sec grid">
      ${RS?`<div class="note" style="grid-column:1/-1">下の内訳（ブラウザ・OS・国など）は GoatCounter のサイト全体の数で、戦国大名と戦国立身をあわせた物です。</div>`:""}
      
      <div class="card"><h2>OS（30日）</h2>${bl("systems")}</div>
      <div class="card"><h2>画面の大きさ（30日）</h2>${bl("sizes")}</div>
      
      <div class="card"><h2>どこから来たか（30日）</h2>${bl("toprefs")}</div>
      
    </div>
    <div class="sec note">数は GoatCounter（${esc(DATA.site)}）から六時間ごとに写しています。細かい生の数は <a href="${esc(DATA.site)}" target="_blank" rel="noopener">GoatCounter の画面</a>でも見られます。</div>`;
}
if(opened()) load();
</script>
</body>
</html>
