<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>戦国立身｜App Storeで無料プレイ</title>
  <meta name="description" content="足軽から出世する三人称の合戦ゲーム、戦国立身をApp Storeで無料プレイ。">
  <meta name="theme-color" content="#0b0907">
  <script>
  (function () {
    if (location.hostname !== 'kaitoseto1129.github.io') return;
    !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
    n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}
    (window,document,'script','https://connect.facebook.net/en_US/fbevents.js');
    window.fbq('init', '1134385575587937');
    window.fbq('track', 'PageView');
  }());
  </script>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;background:#080705 url('../risshin-lp/img/hero_p.jpg') center/cover fixed;color:#f5ead4;font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;text-align:center}body:before{content:"";position:fixed;inset:0;background:linear-gradient(rgba(8,7,5,.68),rgba(8,7,5,.94))}.card{position:relative;width:min(520px,100%);padding:38px 24px;border:1px solid #6d5125;border-radius:22px;background:rgba(14,11,7,.88);box-shadow:0 22px 70px #000}h1{margin:0 0 10px;font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:clamp(40px,11vw,62px);letter-spacing:.08em;color:#e8c263}.tag{margin:0 0 18px;font-size:21px;font-weight:800}.lead{margin:0 auto 24px;color:#e2d6bf;line-height:1.9}.cta{display:flex;align-items:center;justify-content:center;min-height:60px;padding:0 28px;border-radius:30px;background:linear-gradient(#efd077,#b6852d);color:#1b1106;font-weight:800;font-size:18px;text-decoration:none;box-shadow:0 10px 32px #000}.note{margin:14px 0 0;font-size:13px;color:#afa188}
  </style>
</head>
<body>
  <main class="card">
    <h1>戦国立身</h1>
    <p class="tag">名もなき足軽から、天下へ。</p>
    <p class="lead">桶狭間から本能寺まで、織田の三十一の戦。<br>三人称の合戦ゲームを無料で。</p>
    <a id="app-store-cta" class="cta" href="https://apps.apple.com/app/apple-store/id6816750198?pt=127917008&amp;ct=meta&amp;mt=8">App Storeで無料プレイ</a>
    <p class="note">AppleのApp Storeへ移動します</p>
  </main>
  <script>
  (function () {
    var source = new URLSearchParams(location.search).get('utm_source');
    var cta = document.getElementById('app-store-cta');
    if (source === 'google') cta.href = cta.href.replace('ct=meta', 'ct=google');
    cta.addEventListener('click', function () {
      if (typeof window.fbq === 'function') window.fbq('trackCustom', 'LPClick', {destination:'app_store', app:'risshin'});
    });
  }());
  </script>
</body>
</html>
