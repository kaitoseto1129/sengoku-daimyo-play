<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#14120f">
<title>戦国立身3D　携帯の刀</title>
<!-- K254（kaito 11/11「携帯を刀にしてパソコンで遊ぶ（QR でつなぐ・振る・突き・構え）」）：パソコンの設定の「携帯を刀にする」の QR を携帯で読むと開く頁。
     振る＝斬る（回る向きで上段・袈裟・逆袈裟・横薙ぎ、回る速さで重さ）・前へ突き出す＝突き（前への加速）・横へ寝かせる／画面を押す間＝構え。当たると震える。動きは PeerJS（WebRTC）でパソコンへ直に送る。
     DeviceMotion は https の頁でしか取れない（公開の github.io は https）。 -->
<style>
  :root { --bg: #14120f; --fg: #f1e9d8; --gold: #b8963e; --dim: #a89f8e; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 16px/1.6 "Hiragino Mincho ProN", "Yu Mincho", serif; -webkit-user-select: none; user-select: none; touch-action: none; overflow: hidden; }
  main { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 16px; box-sizing: border-box; text-align: center; }
  button { min-height: 56px; min-width: 220px; padding: 0 24px; font: inherit; font-size: 18px; color: var(--bg); background: var(--gold); border: 0; border-radius: 8px; }
  #st { min-height: 1.6em; color: var(--dim); font-size: 15px; }
  #blade { margin: 0 auto; width: 12px; height: 46vh; border-radius: 6px 6px 2px 2px; background: linear-gradient(#e9eef2, #9aa6ad); box-shadow: 0 0 0 2px #3b352c; transition: transform .12s, box-shadow .12s; }
  #blade.guard { box-shadow: 0 0 0 4px var(--gold); }
  #blade.hit { transform: rotate(-24deg); }
  #blade.tsuki { transform: translateY(-18px); }
  #blade.rein { transform: rotate(90deg) scaleY(.55); background: linear-gradient(#8a5a2b, #4a2f17); }
  #blade.cut { background: linear-gradient(#fff, #c43c2c); }
  /* K316② 鉄砲を手にしている間：刃は筒（黒鉄）に。込めてある時は火縄の金の縁・構えている間は照準の丸 */
  #blade.gun { width: 22px; background: linear-gradient(90deg, #2b2b2b, #5a5a5a 45%, #232323); border-radius: 4px; }
  #blade.gun.loaded { box-shadow: 0 0 0 3px #3b352c, 0 -6px 0 0 #c43c2c; }
  #blade.gun.step { transform: translateY(14px); }
  #sight { position: fixed; left: 50%; top: 42%; width: 64px; height: 64px; margin: -32px 0 0 -32px; border: 3px solid var(--gold); border-radius: 50%; pointer-events: none; }
  #sight::after { content: ''; position: absolute; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px 0 0 -3px; border-radius: 50%; background: #c43c2c; }
  #rld { position: fixed; left: 50%; bottom: 24px; width: 40vw; height: 10px; margin-left: -20vw; border-radius: 5px; background: rgba(241,233,216,.2); overflow: hidden; }
  #rld > i { display: block; height: 100%; width: 0; background: var(--gold); }
  #tsuba { width: 64px; height: 10px; border-radius: 5px; background: #3b352c; margin-top: -12px; }
  #tsuka { width: 18px; height: 16vh; border-radius: 4px; background: repeating-linear-gradient(45deg, #2a1d14 0 8px, #5a3e28 8px 16px); margin-top: -12px; }
  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: reduce) { #blade { transition: none; } }
</style>
</head>
<body>
<main>
  <section id="start">
    <p>画面を上にして、上の端をパソコンへ向けて握ります。<br>振ると斬る・前へ突くと突き・横へ寝かせると構え。<br>鉄砲の時は、目の前に立てて狙い、下ろすと撃つ。振って火薬、二度突いて込める。</p>
    <button id="go" type="button">刀としてつなぐ</button>
  </section>
  <section id="play" hidden aria-label="刀">
    <div id="sight" hidden aria-hidden="true"></div><div id="rld" hidden aria-hidden="true"><i></i></div><div id="blade"></div><div id="tsuba" style="margin-left:auto;margin-right:auto"></div><div id="tsuka" style="margin-left:auto;margin-right:auto"></div>
  </section>
  <p id="st" role="status" aria-live="polite"></p>
</main>
<script src="./v202611191636/src/vendor/peerjs.min.js"></script>
<label id="hap" aria-hidden="true" style="position:fixed;left:-99px;top:0;opacity:0"><input type="checkbox" switch tabindex="-1"></label>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const say = (t) => { $('st').textContent = t; };
  const room = (new URLSearchParams(location.search).get('r') || '').replace(/[^a-z0-9]/gi, '').slice(0, 12);
  if (!room) { say('パソコンの QR を読み直してください'); $('go').disabled = true; return; }
  if (!window.isSecureContext) say('公開の頁から開き直すと動きます');
  let conn = null, press = false, tilt = false, guard = false, lastSwing = 0, lastThrust = 0, rtt = 0, tiltT = 0;
  let gun = false, ld = 0, aimUp = false, aimT = 0, aimSent = 0, ax = 0, ay = 0;   // K316② 鉄砲の時：込め具合・携帯を立てて構えた・送る前の狙いの角度
  let g = null;   // 振りの途中（回る速さが閾を越えてから、山を過ぎるか 50ms まで向きを足し合わせる）
  const send = (m) => { try { if (conn && conn.open) conn.send(m); } catch (e) { /* 切れた */ } };
  const flash = (c, ms = 160) => { const b = $('blade'); b.classList.add(c); setTimeout(() => b.classList.remove(c), ms); };
  // 震え：Android は vibrate。iPhone の Safari は vibrate が無いので、iOS 18 からの「切り替えの釦」を押した時の手応えを借りる
  const buzz = (ms) => {
    try { if (navigator.vibrate && navigator.vibrate(ms)) return; } catch (e) { /* 次へ */ }
    try { $('hap').click(); } catch (e) { /* 震えなくてよい */ }
  };

  // 持ち方：画面を上にして、上の端をパソコンへ向ける。携帯の軸＝x 右・y 上の端・z 画面の表。
  //   上段（真っ向）＝x の回り（beta）が大きい／横薙ぎ＝z の回り（alpha）が大きい／袈裟＝両方（alpha の向きで袈裟と逆袈裟）
  //   突き＝前（y）への加速が大きく、回りが小さい。速さ（回る速さの山）で重さ 0.85〜1.3 倍。
  function fire(now) {
    const A = g.a, B = g.b, peak = g.peak;
    const d = Math.abs(B) > Math.abs(A) * 2 ? 'kara' : Math.abs(A) > Math.abs(B) * 2 ? 'nagi' : A > 0 ? 'kesa' : 'gyaku';
    const p = Math.max(0.85, Math.min(1.3, 0.85 + (peak - 340) / 1500));
    send({ t: 's', d, p: +p.toFixed(2), ts: g.ts });
    lastSwing = now; g = null; flash('hit'); buzz(12);
  }
  function onMotion(e) {
    const now = performance.now();
    const r = e.rotationRate || {}, a = e.acceleration || {}, ag = e.accelerationIncludingGravity || {};
    const al = r.alpha || 0, be = r.beta || 0, rot = Math.hypot(al, be, r.gamma || 0);
    // 構え：携帯を横へ寝かせる（画面を横へ向け、刃を横一文字に）と構える。0.15 秒続けたら
    // K316④ 手綱：馬に乗っている間は、傾けて曲がる（左右）・前へ倒して進む・手前へ引いて止まる。構えの寝かせは使わない
    if (ride) { rein(ag); }
    if (gun) return gunMotion(e, now, r, a, ag, rot);
    const gx = ride ? 0 : Math.abs(ag.x || 0);
    if (gx > 7) { if (!tiltT) tiltT = now; if (!tilt && now - tiltT > 150) { tilt = true; setGuard(); } }
    else if (gx < 5) { tiltT = 0; if (tilt) { tilt = false; setGuard(); } }
    if (g) {
      g.a += al; g.b += be;
      if (rot < g.last || now - g.t0 >= 50) return fire(now);
      g.peak = Math.max(g.peak, rot); g.last = rot; return;
    }
    const fwd = a.y || 0;
    if (fwd > 14 && rot < 260 && now - lastThrust > 420 && now - lastSwing > 250) { lastThrust = now; send({ t: 'k', p: Math.max(0.85, Math.min(1.3, 0.85 + (fwd - 14) / 30)), ts: Date.now() }); flash('tsuki'); buzz(12); return; }
    if (rot > 340 && now - lastSwing > 330 && now - lastThrust > 250) g = { t0: now, ts: Date.now(), a: al, b: be, peak: rot, last: rot };
  }
  // K316② 鉄砲：携帯を目の前に立てる（画面を自分へ・上の端を上へ）と構えて照準・傾けて狙う・下ろすか指を離すと撃つ。
  //   撃った後は、振ると火薬を注ぎ、上下に二度突くと込め矢で突き固める（約6秒）。
  function gunMotion(e, now, r, a, ag, rot) {
    const up = Math.abs(ag.y || 0) > 7 && Math.abs(ag.z || 0) < 6;
    if (up) { if (!aimT) aimT = now; if (!aimUp && now - aimT > 150) { aimUp = true; setGuard(); } }
    else if (Math.abs(ag.y || 0) < 5) { aimT = 0; if (aimUp) { aimUp = false; setGuard(); } }
    if (guard) {   // 構えている間：体ごと回すと横、手首で上下（回る速さ 度/秒 × 間）
      const dt = Math.min(0.05, (e.interval > 1 ? e.interval / 1000 : e.interval) || 0.016);
      ax -= (r.gamma || 0) * dt; ay -= (r.beta || 0) * dt;
      if (now - aimSent > 33 && (Math.abs(ax) + Math.abs(ay) > 0.05)) { send({ t: 'a', x: +ax.toFixed(2), y: +ay.toFixed(2) }); ax = ay = 0; aimSent = now; }
      return;
    }
    if (ld >= 1) return;
    const ram = Math.abs(a.y || 0);
    if (ram > 14 && rot < 260 && now - lastThrust > 380) { lastThrust = now; send({ t: 'k', p: 1, ts: Date.now() }); flash('step', 140); buzz(10); return; }
    if (rot > 340 && now - lastSwing > 600 && now - lastThrust > 250) { lastSwing = now; send({ t: 's', d: 'kesa', p: 1, ts: Date.now() }); flash('step', 140); buzz(10); }
  }
  function setGun(on, l) {
    ld = l;
    $('rld').firstChild.style.width = Math.round(Math.min(1, l) * 100) + '%';
    $('rld').hidden = !on || l >= 1;
    $('blade').classList.toggle('loaded', on && l >= 1);
    if (on === gun) return;
    gun = on; aimUp = false; aimT = 0; ax = ay = 0;
    $('blade').classList.toggle('gun', on);
    if (on && tilt) tilt = false;
    setGuard(); buzz(on ? 20 : 8);
  }
  // 手綱：乗った時の持ち方を基準にする。重さの z の向きで端末ごとの符号の違いを揃える
  let ride = false, base = null, reinM = '';
  function rein(ag) {
    const x = ag.x || 0, y = ag.y || 0, z = ag.z || 0;
    if (!base) base = { x, y, s: z < 0 ? -1 : 1 };
    if (stickId !== null) return;   // 親指の棒を押している間は棒が先
    const roll = -(x - base.x) * base.s / 9.8, pitch = (y - base.y) * base.s / 9.8;   // roll＋＝右へ傾けた・pitch＋＝手前へ引いた
    const sx = Math.abs(roll) < 0.15 ? 0 : Math.max(-1, Math.min(1, (roll - Math.sign(roll) * 0.15) / 0.45));
    const sy = pitch > 0.3 ? 0 : pitch < -0.12 ? -1 : 0;   // 前へ倒すと進む・手前へ引くと止まる
    const k = sx.toFixed(2) + ',' + sy;
    if (k === reinM) return; reinM = k;
    lastM = k === '0.00,0' ? '0.00,0.00' : sx.toFixed(2) + ',' + sy.toFixed(2);
    send({ t: 'm', x: +sx.toFixed(2), y: sy });
  }
  function setRide(on) {
    if (on === ride) return;
    ride = on; base = null; reinM = '';
    $('blade').classList.toggle('rein', on);
    if (on && tilt) { tilt = false; setGuard(); }
    if (!on) { lastM = '0.00,0.00'; send({ t: 'm', x: 0, y: 0 }); }
    buzz(on ? 20 : 8);
  }
  // 構え：携帯を横へ寝かせている間か、画面を押している間
  const setGuard = () => { const on = press || (gun ? aimUp : tilt); if (guard === on) return; guard = on; $('blade').classList.toggle('guard', on); $('sight').hidden = !(on && gun); send({ t: 'g', on }); };
  // K312：画面の左下は親指の棒（押して滑らせると進む・向く）。右側の押しは構え。字は使わず絵だけ
  let stickId = null, sx = 0, sy = 0, lastM = '';
  const R = 56, stickEl = document.createElement('div'), knob = document.createElement('div');
  stickEl.setAttribute('aria-hidden', 'true');
  stickEl.style.cssText = 'position:fixed;left:max(16px,env(safe-area-inset-left));bottom:16px;width:112px;height:112px;border-radius:50%;border:2px solid rgba(241,233,216,.55);background:rgba(20,18,15,.35);touch-action:none;z-index:5';
  knob.style.cssText = 'position:absolute;left:28px;top:28px;width:56px;height:56px;border-radius:50%;background:rgba(184,150,62,.85)';
  stickEl.appendChild(knob); document.body.appendChild(stickEl);
  const sendMove = (x, y) => { const k = x.toFixed(2) + ',' + y.toFixed(2); if (k === lastM) return; lastM = k; send({ t: 'm', x: +x.toFixed(2), y: +y.toFixed(2) }); };
  const stickTo = (e) => { let dx = e.clientX - sx, dy = e.clientY - sy; const d = Math.hypot(dx, dy); if (d > R) { dx = dx / d * R; dy = dy / d * R; } knob.style.transform = `translate(${dx}px,${dy}px)`; sendMove(dx / R, dy / R); };
  const stickEnd = () => { stickId = null; reinM = ''; knob.style.transform = ''; sendMove(0, 0); };
  addEventListener('pointerdown', (e) => {
    if ($('play').hidden) return;
    e.preventDefault();
    const r = stickEl.getBoundingClientRect();
    if (stickId === null && e.clientX >= r.left - 24 && e.clientX <= r.right + 24 && e.clientY >= r.top - 24) { stickId = e.pointerId; sx = r.left + r.width / 2; sy = r.top + r.height / 2; stickTo(e); return; }
    press = true; setGuard();
  });
  addEventListener('pointermove', (e) => { if (e.pointerId === stickId) stickTo(e); });
  const up = (e) => { if (e.pointerId === stickId) stickEnd(); else { press = false; setGuard(); } };
  addEventListener('pointerup', up);
  addEventListener('pointercancel', up);
  setInterval(() => { if (lastM !== '0.00,0.00' && lastM !== '') send({ t: 'm', x: +lastM.split(',')[0], y: +lastM.split(',')[1] }); }, 250);   // 止まった印を取りこぼさない
  setInterval(() => { if (guard) send({ t: 'g', on: true }); send({ t: 'p', ts: Date.now(), rtt }); }, 250);   // 構えの伝え直し・生きている印と往復の遅れ

  $('go').onclick = async () => {
    try {
      if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
        const ok = await DeviceMotionEvent.requestPermission();
        if (ok !== 'granted') { say('動きを読む許しが要ります。もう一度押してください'); return; }
      }
    } catch (e) { say('動きを読む許しが取れませんでした'); return; }
    say('つないでいます…');
    $('go').disabled = true;
    let ps = null; try { ps = JSON.parse(new URLSearchParams(location.search).get('ps') || 'null'); } catch (e) { ps = null; }
    const peer = ps ? new Peer(ps) : new Peer();
    peer.on('open', () => {
      // 振りは待たせず送る（reliable:false＝順番待ちをしない。遅れ 100ms 以下のため）
      conn = peer.connect('risshin-sword-' + room, { reliable: false, serialization: 'json' });
      conn.on('open', () => {
        say('');
        $('start').hidden = true; $('play').hidden = false;
        addEventListener('devicemotion', onMotion);
        send({ t: 'hi' });
      });
      conn.on('data', (m) => {
        if (!m) return;
        if (m.t === 'q') { rtt = Date.now() - m.ts; if ('ride' in m) setRide(!!m.ride); if ('w' in m) setGun(m.w === 'gun', +m.ld || 0); }
        else if (m.t === 'step') { buzz(18); }
        else if (m.t === 'hit') { buzz(35); flash('cut', 220); }
      });
      conn.on('close', () => { say('切れました。パソコンの QR を読み直してください'); $('play').hidden = true; $('start').hidden = false; $('go').disabled = false; });
    });
    peer.on('error', () => { say('つなげませんでした。パソコンの QR を読み直してください'); $('go').disabled = false; });
  };
  window.__sword = { stat: () => ({ rtt, guard, gun, ld, open: !!(conn && conn.open) }), motion: onMotion };
})();
</script>
</body>
</html>
