.total { display: flex; justify-content: space-between; align-items: baseline; padding: 16px 0 6px; }
.total span { letter-spacing: .2em; color: var(--washi-dim); }
.total strong { font-family: var(--display); font-size: max(12px, calc(52px * var(--text-scale, 1))); color: var(--kin); font-variant-numeric: tabular-nums; }
.total em { font-style: normal; font-size: max(12px, calc(12px * var(--text-scale, 1))); color: var(--washi-faint); margin-left: 8px; }
.verdict { font-family: var(--display); font-size: max(12px, calc(24px * var(--text-scale, 1))); margin: 14px 0; letter-spacing: .08em; }
.facts { display: grid; grid-template-columns: max-content 1fr; gap: 6px 22px; font-size: max(12px, calc(14px * var(--text-scale, 1))); margin: 10px 0 20px; }
.facts dt { color: var(--washi-dim); letter-spacing: .12em; font-size: max(12px, calc(12.5px * var(--text-scale, 1))); }
.facts dd { margin: 0; }
.promo { border: 1px solid var(--kin); padding: 20px 22px; margin: 18px 0 24px; background: linear-gradient(120deg, rgba(194,162,90,.12), transparent 70%); opacity: 0; animation: ln .6s ease-out forwards; }
.promo .lbl { font-size: max(12px, calc(12px * var(--text-scale, 1))); letter-spacing: .3em; color: var(--kin); }
.promo .rk { font-family: var(--display); font-weight: 800; font-size: max(12px, calc(clamp(26px, 5vw, 38px) * var(--text-scale, 1))); margin: 8px 0; letter-spacing: .08em; }
.promo .rk .arrow { color: var(--washi-faint); margin: 0 .4em; font-weight: 600; }
.promo .unl { font-size: max(12px, calc(14px * var(--text-scale, 1))); color: var(--washi); }
.promo .unl b { color: var(--kin); font-weight: 500; }
.promo.no { border-color: var(--line); background: none; }
.promo.no .lbl { color: var(--washi-dim); }

/* base */
.base { max-width: 980px; margin: 0 auto; padding-block: 36px; display: grid; grid-template-columns: 260px 1fr; gap: 36px; }
@media (max-width: 980px) { .base { grid-template-columns: 200px minmax(0, 1fr); gap: 20px; } }   /* 横 844 で中身が 590px に縮まない（W028） */
@media (max-width: 760px) { .base { grid-template-columns: 1fr; } }
.base aside h2 { font-family: var(--display); font-size: max(12px, calc(30px * var(--text-scale, 1))); margin: 6px 0 2px; letter-spacing: .1em; }
.base aside .rank { color: var(--kin); letter-spacing: .1em; }
.stat { display: grid; grid-template-columns: 1fr auto; font-size: max(12px, calc(13.5px * var(--text-scale, 1))); padding: 6px 0; border-bottom: 1px solid var(--line); }
.stat span { color: var(--washi-dim); }
.stat b { font-weight: 500; font-variant-numeric: tabular-nums; }
.tabs { display: flex; gap: 8px 0; border-bottom: 1px solid var(--line); margin-bottom: 18px; flex-wrap: wrap; }
.tabs button { background: none; border: 0; color: var(--washi-dim); padding: 10px 16px; font-size: max(12px, calc(14px * var(--text-scale, 1))); letter-spacing: .12em; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs button.on { color: var(--washi); border-bottom-color: var(--shu); }
.items { display: grid; gap: 8px; }
.item { display: grid; grid-template-columns: 1fr auto; gap: 4px 16px; align-items: center; padding: 12px 14px; border: 1px solid var(--line); }
.item .n { font-size: max(12px, calc(15px * var(--text-scale, 1))); }
.item .n small { color: var(--washi-faint); margin-left: 8px; font-size: max(12px, calc(12px * var(--text-scale, 1))); }
.item .x { grid-column: 1; font-size: max(12px, calc(12.5px * var(--text-scale, 1))); color: var(--washi-dim); }
.item .a { grid-row: 1 / span 2; grid-column: 2; }
.item.eq { border-color: var(--kin); }
.rel { display: grid; grid-template-columns: 70px 1fr 40px; gap: 8px; align-items: center; font-size: max(12px, calc(12px * var(--text-scale, 1))); color: var(--washi-dim); margin: 3px 0; }
.rel i { height: 5px; background: var(--sumi-3); position: relative; display: block; }
.rel i b { position: absolute; inset: 0; right: auto; background: var(--kin); }
.talk { border-left: 2px solid var(--kin); padding: 4px 0 4px 16px; margin: 12px 0; line-height: 1.9; }
.talk .sp { color: var(--kin); font-size: max(12px, calc(13px * var(--text-scale, 1))); letter-spacing: .08em; }
.choices { display: grid; gap: 8px; margin-top: 10px; }
.choices button { text-align: left; background: none; border: 1px solid var(--line); color: var(--washi); padding: 10px 14px; cursor: pointer; font-size: max(12px, calc(14px * var(--text-scale, 1))); }
.choices button:hover { border-color: var(--washi-dim); background: rgba(236,228,210,.04); }
.aiji { display: grid; grid-template-columns: repeat(3, minmax(0,140px)); gap: 12px; margin: 18px 0; }
.aiji button { background: var(--sumi-2); border: 1px solid var(--line); padding: 12px; cursor: pointer; color: var(--washi); display: grid; gap: 8px; justify-items: center; font-size: max(12px, calc(14px * var(--text-scale, 1))); }
.aiji button:hover { border-color: var(--kin); }
.aiji canvas { width: 60px; height: 120px; }

.timeline { display: grid; gap: 0; margin: 20px 0; }
.timeline .tl-row { display: grid; grid-template-columns: 160px 1fr 80px; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); align-items: baseline; }
.timeline .tl-row .b { font-family: var(--display); font-size: max(12px, calc(18px * var(--text-scale, 1))); }
.timeline .tl-row .r { color: var(--washi-dim); font-size: max(12px, calc(13.5px * var(--text-scale, 1))); }
.timeline .tl-row .m { text-align: right; font-family: var(--display); color: var(--kin); font-size: max(12px, calc(20px * var(--text-scale, 1))); font-variant-numeric: tabular-nums; }
.q { margin: 16px 0; }
.q p { margin: 0 0 8px; font-size: max(12px, calc(14.5px * var(--text-scale, 1))); }
.q .scale { display: flex; gap: 6px; flex-wrap: wrap; }
.q .scale label { border: 1px solid var(--line); padding: 6px 12px; cursor: pointer; font-size: max(12px, calc(13px * var(--text-scale, 1))); min-height: 44px; min-width: 44px; box-sizing: border-box; display: inline-flex; align-items: center; justify-content: center; }
.q .scale input { accent-color: var(--shu); margin-right: 6px; }
textarea { width: 100%; box-sizing: border-box; min-height: 90px; background: var(--sumi-2); color: var(--washi); border: 1px solid var(--line); padding: 10px; font-family: var(--ui); font-size: max(12px, calc(14px * var(--text-scale, 1))); }
pre.copy { white-space: pre-wrap; background: var(--sumi-2); border: 1px solid var(--line); padding: 12px; font-size: max(12px, calc(12px * var(--text-scale, 1))); color: var(--washi-dim); max-height: 200px; overflow: auto; }

#pause { position: fixed; inset: 0; z-index: 35; display: grid; place-items: center; background: rgba(10,9,7,.72); overflow-y: auto; }
#pause[hidden] { display: none !important; }
/* 一時停止の間は、下の台詞・知らせ・任務の札を隠す（止めた画面の釦に字が透けて重ならないように） */
body:has(#pause:not([hidden])) #hud :is(#subtitle, #bark, #banner, #objectives, #markers, #hint, #tutorial) { visibility: hidden; }
#pause div { text-align: center; }
#pause h3 { font-family: var(--display); font-size: max(12px, calc(32px * var(--text-scale, 1))); letter-spacing: .3em; margin: 0 0 10px; }
#pause p { color: var(--washi-dim); font-size: max(15px, calc(15px * var(--text-scale, 1))); line-height:1.7; }
#pause .skiphint { font-size:max(13px, calc(13px * var(--text-scale, 1))); }
#loading { position: fixed; inset: 0; display: grid; place-items: center; background: var(--sumi); }
#loading[hidden] { display: none !important; }
#loading { z-index: 70; overflow-y: auto; box-sizing: border-box; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
#ld-stage .ld-actions { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; margin-top: 16px; }

/* ---------- 改善で加えた表示 ---------- */
.bar { grid-template-columns: 34px 1fr 64px; }
.bar em { font-style: normal; font-size: max(12px, calc(12px * var(--text-scale, 1))); color: var(--washi-dim); text-align: right; font-variant-numeric: tabular-nums; letter-spacing: .02em; }
.bar.low i { animation: lowpulse .6s ease-in-out infinite alternate; }
.bar.low em { color: var(--shu); }
@keyframes lowpulse { from { box-shadow: 0 0 0 0 rgba(192,69,46,0); } to { box-shadow: 0 0 0 2px rgba(192,69,46,.55); } }
.merit-now small { margin-left: 8px; font-size: max(12px, calc(12px * var(--text-scale, 1))); color: var(--washi-faint); }
.next { display: grid; gap: 3px; font-size: max(12px, calc(12px * var(--text-scale, 1))); color: var(--washi-dim); text-shadow: 0 1px 2px #000; }
.next i { display: block; height: 3px; background: rgba(0,0,0,.5); position: relative; }
.next i b { position: absolute; inset: 0; right: auto; background: var(--kin); transition: width .4s; }
#hint { margin-top: 10px; background: rgba(10,9,7,.7); border-left: 2px solid var(--kin); padding: 8px 10px; font-size: max(12px, calc(12.5px * var(--text-scale, 1))); line-height: 1.6; pointer-events: none; }
#hint .lbl { display: block; font-size: max(12px, calc(12px * var(--text-scale, 1))); letter-spacing: .25em; color: var(--kin); margin-bottom: 2px; }
#hint .k { margin-top: 4px; color: var(--washi-dim); font-size: max(12px, calc(12px * var(--text-scale, 1))); }
#hud[data-sub="s"] #subtitle { font-size: max(12px, calc(14px * var(--text-scale, 1))); }
#hud[data-sub="l"] #subtitle { font-size: max(12px, calc(21px * var(--text-scale, 1))); }
#subtitle .sys { color: var(--washi-dim); font-style: italic; }
#crosshair { width: 26px; height: 26px; margin: -13px 0 0 -13px; background: none; box-shadow: none; opacity: 1; }
#crosshair i { position: absolute; left: 50%; top: 50%; width: 4px; height: 4px; margin: -2px 0 0 -2px; border-radius: 50%; background: var(--washi); box-shadow: 0 0 0 1px rgba(0,0,0,.6); opacity: .75; transition: background .1s, transform .1s; }
#crosshair::before, #crosshair::after { content: ""; position: absolute; inset: 3px; border: 1.5px solid transparent; border-radius: 50%; transition: border-color .12s, inset .12s; }
#crosshair.inrange i { background: var(--shu); transform: scale(1.4); }
#crosshair.inrange::before { border-color: rgba(192,69,46,.7); }
#crosshair.guard::after { inset: -2px; border-color: rgba(236,228,210,.45); border-radius: 4px; }
#crosshair.counter::before { border-color: var(--kin); inset: -4px; }
#crosshair.gun::before { inset: -5px; border: 0; border-radius: 50%; background: conic-gradient(rgba(236,228,210,.8) var(--rl, 0%), rgba(236,228,210,.14) 0); -webkit-mask: radial-gradient(circle, transparent 62%, #000 64%); mask: radial-gradient(circle, transparent 62%, #000 64%); }
#crosshair.gun.gready::before { background: rgba(243,217,138,.55); }
#crosshair.gun.gready.gaim::before { background: #f3d98a; inset: -2px; }
#crosshair.gun.gready.gaim i { background: var(--shu); }
#crosshair.gun:not(.gready) i { opacity: .35; }
#crosshair.gping::after { inset: -10px; border: 2px solid #f3d98a; border-radius: 50%; animation: gping .5s ease-out forwards; }
@keyframes gping { from { opacity: 1; transform: scale(.7); } to { opacity: 0; transform: scale(1.5); } }
#crosshair.gmiss::after { content: '外'; inset: auto; left: 18px; top: -14px; border: 0; font: 700 max(12px, calc(13px * var(--text-scale, 1))) var(--display); color: var(--washi); text-shadow: 0 1px 3px #000; animation: gmiss .7s ease-out forwards; }
@keyframes gmiss { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-8px); } }
body.rm #crosshair.gping::after, body.rm #crosshair.gmiss::after { animation-duration: .01s; }
#crosshair.hit i { animation: hitm .18s ease-out; }
@keyframes hitm { 0% { transform: scale(3); background: #fff; } 100% { transform: scale(1.4); } }
#dmgdir { position: absolute; left: 50%; top: 50%; width: 260px; height: 260px; border-radius: 50%; border-top: 6px solid rgba(200,30,10,.85); opacity: 0; pointer-events: none; }
#dmgdir.show { animation: dmg .9s ease-out; }
@keyframes dmg { 0% { opacity: 1; } 100% { opacity: 0; } }
#target { position: absolute; left: 50%; top: calc(62px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); display: grid; gap: 3px; justify-items: center; font-size: max(12px, calc(12px * var(--text-scale, 1))); text-shadow: 0 1px 2px #000; }
#target i { display: block; width: 140px; height: 4px; background: rgba(0,0,0,.6); position: relative; }
#target i b { position: absolute; inset: 0; right: auto; background: #d4553b; }
#target.locked span { color: #e36a52; }
#flash { position: absolute; left: 50%; top: 42%; transform: translateX(-50%); font-family: var(--display); font-size: max(12px, calc(22px * var(--text-scale, 1))); letter-spacing: .2em; text-shadow: 0 2px 8px #000; }
#flash.show { animation: fl 1.1s ease-out forwards; }
#flash.gold { color: var(--kin); }
#flash.red { color: #e36a52; }
#flash.dim { color: var(--washi-dim); font-family: var(--ui); font-size: max(12px, calc(14px * var(--text-scale, 1))); letter-spacing: .08em; }
@keyframes fl { 0% { opacity: 0; transform: translate(-50%, 6px); } 15% { opacity: 1; transform: translate(-50%, 0); } 75% { opacity: 1; } 100% { opacity: 0; } }
#bark { position: absolute; left: 50%; bottom: calc(150px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); display: grid; gap: 2px; justify-items: center; }
#bark .bk { font-size: max(12px, calc(13px * var(--text-scale, 1))); color: var(--washi-dim); text-shadow: 0 1px 3px #000; animation: toast 2.2s ease-out forwards; }
#bark .bk.warn { color: #e8a13a; }
#sublog { position: absolute; left: calc(20px + env(safe-area-inset-left, 0px)); bottom: calc(90px + env(safe-area-inset-bottom, 0px)); width: min(420px, 60vw); max-height: 40vh; overflow: hidden; background: rgba(10,9,7,.85); border: 1px solid var(--line); padding: 10px 12px; font-size: max(12px, calc(12.5px * var(--text-scale, 1))); line-height: 1.6; }
#sublog h5 { margin: 0 0 6px; color: var(--kin); font-weight: 500; letter-spacing: .1em; }
#sublog .sp { color: var(--kin); margin-right: .5em; }
.objnew { margin-top: 6px; font-size: max(12px, calc(12px * var(--text-scale, 1))); overflow-wrap: anywhere; text-align: right; color: var(--kin); animation: toast 3.2s ease-out forwards; }
#objectives li small { display: block; color: var(--washi-dim); font-size: max(12px, calc(12px * var(--text-scale, 1))); }
.threat { position: absolute; font-family: var(--display); font-weight: 800; font-size: max(12px, calc(22px * var(--text-scale, 1))); color: #ff6a4a; text-shadow: 0 0 6px rgba(0,0,0,.9); pointer-events: none; }
.mk.near { opacity: .35; }
/* 戦の合間の気配：画面の縁に小さな太鼓。寄せてくる時は速く打つ */
#lullcue { position: absolute; transform: translate(-50%, -50%); pointer-events: none; display: grid; justify-items: center; gap: 2px; transition: opacity .8s; }
#lullcue[hidden] { display: none; }
#lullcue i { width: 22px; height: 22px; border-radius: 50%; border: 2px solid #e36a52; background: radial-gradient(circle, rgba(227,106,82,.35), rgba(12,10,8,.6) 70%); box-shadow: 0 0 0 1px rgba(0,0,0,.5); animation: lullbeat 2.2s ease-out infinite; }
#lullcue.come i { animation-duration: .9s; }
#lullcue small { font-size: max(12px, calc(12px * var(--text-scale, 1))); color: #f0c0b0; text-shadow: 0 1px 2px #000, 0 0 4px #000; white-space: nowrap; }
@keyframes lullbeat { 0% { box-shadow: 0 0 0 0 rgba(227,106,82,.6); } 70% { box-shadow: 0 0 0 12px rgba(227,106,82,0); } 100% { box-shadow: 0 0 0 0 rgba(227,106,82,0); } }
body.rm #lullcue i { animation: none; }
/* 敵の印は下向きの三角（行き先の菱形と形でも分ける）。いちばんの行き先は少し大きく、ゆっくり光る */
.mk.red::before { width: 0; height: 0; border: 7px solid transparent; border-top: 11px solid #e36a52; border-bottom-width: 0; transform: none; margin-bottom: 3px; }
body.ca .mk.red::before { border-color: transparent; border-top-color: #ff9a1a; border-style: solid; }
.mk.main:not(.red)::before { width: 13px; height: 13px; background: rgba(194,162,90,.25); box-shadow: 0 0 10px rgba(243,217,138,.6); animation: mkmain 2.4s ease-in-out infinite; }
@keyframes mkmain { 50% { box-shadow: 0 0 2px rgba(243,217,138,.2); } }
#goalcue { position: absolute; left: 50%; top: 50%; width: 0; height: 0; pointer-events: none; transform: rotate(var(--ang, 0rad)) translateX(58px); opacity: .6; }
#goalcue::before { content: ''; position: absolute; left: -6px; top: -8px; border: 8px solid transparent; border-left: 12px solid #f3d98a; border-right-width: 0; filter: drop-shadow(0 1px 2px #000); }
#goalcue.red::before { border-left-color: #e36a52; }
#goalcue[hidden] { display: none; }
body.rm .mk.main::before { animation: none; }
.mk.edge::after { content: "▲"; position: absolute; left: 50%; top: -18px; transform: translateX(-50%) rotate(calc(var(--ang) + 90deg)); font-size: max(12px, calc(12px * var(--text-scale, 1))); }
.topc .pips { display: inline-flex; gap: 2px; flex-wrap: wrap; max-width: 150px; align-self: center; }
.topc .pips i { width: 6px; height: 10px; background: var(--moegi); display: inline-block; }
.topc .pips i.mid { background: var(--kin); }
.topc .pips i.low { background: var(--shu); }
.topc .pips i.bow { border-top: 2px solid var(--washi); }
.topc .pips i.dead { background: rgba(236,228,210,.15); }
.topc small { font-size: max(12px, calc(12px * var(--text-scale, 1))); color: var(--washi-dim); margin-left: 4px; }
.slot.cmd.ready { border-color: rgba(194,162,90,.6); }
.slot.cmd.on { border-color: #e36a52; color: #e36a52; }
.slot.cmd em { position: static; margin-right: 6px; }
#cmdpanel { min-width: 440px; }
#cmdpanel li { display: grid; grid-template-columns: auto 1fr auto; gap: 0 4px; align-items: baseline; }
#cmdpanel li em { font-style: normal; font-size: max(12px, calc(12px * var(--text-scale, 1))); color: var(--washi-faint); border: 1px solid var(--line); padding: 0 4px; }
#cmdpanel li small { grid-column: 1 / -1; font-size: max(12px, calc(12px * var(--text-scale, 1))); color: var(--washi-dim); }
#toasts { right: 290px; top: 34%; }
#pause { cursor: default; }
.pmenu { display: grid; grid-template-columns: minmax(0, 260px) minmax(0, 380px); gap: 40px; align-items: start; max-width: 720px; padding: 16px; }
.pmenu h3 { grid-column: 1 / -1; margin: 0; }
.pmenu .btns { display: grid; gap: 8px; }
.pmenu .btns .btn { text-align: left; }
.pmenu .objs { font-size: max(12px, calc(13px * var(--text-scale, 1))); line-height: 1.8; color: var(--washi-dim); }
.pmenu .objs b { color: var(--washi); font-weight: 500; }
.pmenu .confirm { grid-column: 1 / -1; border: 1px solid var(--shu); padding: 12px 14px; font-size: max(12px, calc(14px * var(--text-scale, 1))); }
@media (max-width: 700px) { .pmenu { grid-template-columns: 1fr; gap: 20px; } }
#loading .ld { font-family: var(--display); font-size: max(12px, calc(20px * var(--text-scale, 1))); letter-spacing: .3em; color: var(--washi-dim); text-align: center; }
#loading p { max-width: 30em; margin: 18px auto 0; font-family: var(--ui); font-size: max(12px, calc(13px * var(--text-scale, 1))); letter-spacing: .04em; color: var(--washi-faint); line-height: 1.8; text-align: center; padding: 0 16px; }
#glfail { position: fixed; inset: 0; background: var(--sumi); display: grid; place-items: center; padding-inline: 16px; }
.settings { display: grid; gap: 14px; max-width: 560px; }
.settings .s-row { margin-bottom: 8px; display: grid; grid-template-columns: minmax(150px, 230px) 1fr 60px; gap: 14px; align-items: center; font-size: max(12px, calc(14px * var(--text-scale, 1))); }
.settings .s-row label { color: var(--washi-dim); }
.settings .s-row output { font-variant-numeric: tabular-nums; color: var(--washi-dim); font-size: max(12px, calc(12px * var(--text-scale, 1))); text-align: right; }
.settings input[type=range] { min-height: 44px; margin: 0; width: 100%; accent-color: var(--shu); }
.settings select { min-height: 44px; min-width: 0; width: 100%; font-size: max(15px, calc(15px * var(--text-scale, 1))); background: var(--sumi-2); color: var(--washi); border: 1px solid var(--line); padding: 6px 8px; font-family: var(--ui); }
.settings input[type=checkbox] { accent-color: var(--shu); width: 44px; height: 44px; margin: 0; }
@media (max-width: 520px) { .settings .s-row { grid-template-columns: 1fr 60px; } .settings .s-row label { grid-column: 1 / -1; } }
.story p { opacity: 0; animation: ln .8s ease-out forwards; }
.story .keyhint { margin-top: 14px; font-size: max(12px, calc(12px * var(--text-scale, 1))); color: var(--washi-faint); }
.eval.fast .ln, .eval.fast .total, .eval.fast .promo, .eval.fast #ev-actions, .eval.fast .ev-more { animation-delay: 0s !important; animation-duration: .01s !important; }
.ev-more { display: flex; gap: 22px; flex-wrap: wrap; font-size: max(12px, calc(12.5px * var(--text-scale, 1))); color: var(--washi-dim); margin: 6px 0 4px; }
.ev-more b { color: var(--washi); font-weight: 500; font-variant-numeric: tabular-nums; margin-left: 4px; }

.toastbox { position: fixed; right: 20px; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--sumi-2); border: 1px solid var(--line); padding: 8px 14px; font-size: max(12px, calc(13px * var(--text-scale, 1))); animation: toast 2.4s ease-out forwards; z-index: 10; }
.confirm-row { border: 1px solid var(--shu); padding: 12px 14px; margin-top: 12px; display: grid; gap: 10px; font-size: max(12px, calc(14px * var(--text-scale, 1))); }

.savebox { font-size: max(12px, calc(12px * var(--text-scale, 1))); color: var(--washi-dim); margin-top: 10px; }
.title-foot { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
@media (max-width: 900px) { #minimap { width: 120px; height: 120px; } .tr { width: 200px; } #toasts { right: 220px; } }
@media (max-height: 620px) { .tl { gap: 3px; } #hint { display: none; } #subtitle { bottom: 76px; } }

/* ---------- 改善（第2弾） ---------- */
#boss { position: absolute; left: 50%; bottom: calc(196px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); display: grid; gap: 4px; justify-items: center; font-family: var(--display); font-size: max(12px, calc(16px * var(--text-scale, 1))); letter-spacing: .12em; text-shadow: 0 1px 3px #000; }
#boss i { display: block; width: min(420px, 60vw); height: 6px; background: rgba(0,0,0,.6); border: 1px solid rgba(236,228,210,.3); position: relative; }
#boss i b { position: absolute; inset: 0; right: auto; background: linear-gradient(90deg, #8e2f1f, #c0452e); }
#crosshair.charge::before { border-color: rgba(236,228,210,.6); inset: -1px; }
#crosshair.charged::before { border-color: var(--kin); inset: -6px; border-width: 2px; }
.toast.title b { color: var(--kin); font-size: max(12px, calc(14px * var(--text-scale, 1))); }
.topc .pips i.vet { outline: 1px solid var(--kin); outline-offset: 0; }
body.ca .mk.red, body.ca .threat { color: #ff9a1a; }

body.ca #target i b, body.ca #boss i b { background: #ff9a1a; }
body.rm *, body.rm *::before, body.rm *::after { animation-duration: .01ms !important; transition: none !important; }
body.rm .toast, body.rm #banner.show, body.rm .ln, body.rm .promo, body.rm .story p { opacity: 1 !important; }
.keybind { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 6px 18px; }
.keybind button { background: var(--sumi-2); border: 1px solid var(--line); color: var(--washi); padding: 6px 10px; text-align: left; cursor: pointer; font-size: max(12px, calc(13px * var(--text-scale, 1))); display: flex; justify-content: space-between; gap: 10px; }
.keybind button b { color: var(--kin); font-weight: 500; }
.keybind button.wait b { color: var(--shu); }
.roster { display: grid; gap: 0; }
.roster .rr { display: grid; grid-template-columns: 1fr 70px 70px 90px; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: max(12px, calc(14px * var(--text-scale, 1))); align-items: baseline; }
.roster .rr span { color: var(--washi-dim); font-size: max(12px, calc(12.5px * var(--text-scale, 1))); font-variant-numeric: tabular-nums; }
.roster .rr.head span { color: var(--washi-faint); font-size: max(12px, calc(12px * var(--text-scale, 1))); letter-spacing: .1em; }
.roster .rr .vet { color: var(--kin); }
.people { display: grid; gap: 14px; }
.people .p { border-left: 2px solid var(--line); padding: 2px 0 2px 14px; }
.people .p b { font-family: var(--display); font-size: max(12px, calc(17px * var(--text-scale, 1))); }
.people .p small { color: var(--washi-faint); margin-left: 8px; }
.people .p p { margin: 4px 0 0; font-size: max(12px, calc(13.5px * var(--text-scale, 1))); color: var(--washi-dim); line-height: 1.8; }
.gloss { display: grid; grid-template-columns: max-content 1fr; gap: 6px 18px; font-size: max(12px, calc(13.5px * var(--text-scale, 1))); line-height: 1.7; }
.gloss dt { font-family: var(--display); color: var(--kin); }
.gloss dd { margin: 0; color: var(--washi-dim); }
.diffs { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.diffs label { border: 1px solid var(--line); padding: 8px 12px; cursor: pointer; font-size: max(12px, calc(13px * var(--text-scale, 1))); display: grid; gap: 2px; max-width: 220px; }
.diffs label small { color: var(--washi-faint); font-size: max(12px, calc(12px * var(--text-scale, 1))); }
.diffs.scn label { max-width: 440px; }

.titles { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; margin: 12px 0; }
.titles div { border: 1px solid var(--line); padding: 8px 10px; font-size: max(12px, calc(13px * var(--text-scale, 1))); }
.titles div.got { border-color: var(--kin); }
.titles div b { display: block; font-family: var(--display); font-size: max(12px, calc(15px * var(--text-scale, 1))); }
.titles div:not(.got) { opacity: .8; border-style: dashed; }   /* 字の対比 4.5:1 以上（W033）。未取得は破線で示す */
.titles div:not(.got) small { color: #cdbf9f; }
.titles small { color: var(--washi-dim); }
.ev-cat { font-size: max(12px, calc(12px * var(--text-scale, 1))); letter-spacing: .2em; color: var(--washi-faint); padding-top: 12px; }
.histnote { border-left: 2px solid var(--kin); padding: 4px 0 4px 14px; margin: 18px 0; font-size: max(12px, calc(13.5px * var(--text-scale, 1))); color: var(--washi-dim); line-height: 1.9; }
.preview3d { width: 220px; height: 260px; display: block; margin: 0 auto 10px; background: radial-gradient(ellipse at 50% 70%, #2c2821, transparent 70%); }
#titlebg { position: fixed; inset: 0; width: 100%; height: 100%; z-index: -1; opacity: .55; }
#screen.withbg { background: linear-gradient(90deg, rgba(20,18,15,.95) 0%, rgba(20,18,15,.78) 55%, rgba(20,18,15,.35) 100%); }

/* ================= 第3弾：ゲームらしい見た目の HUD ================= */
:root { --lacquer: rgba(14,11,8,.68); --gold-line: rgba(194,162,90,.45); --ai-deep: #2e4f86; --ai-bright: #5e8fd6; }
#overlay { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
/* 画面の四隅をわずかに落として映画らしく */
#vignette { box-shadow: inset 0 0 180px rgba(0,0,0,.45); }
#vignette.hurt { box-shadow: inset 0 0 200px rgba(140,16,4,.6); }
/* 開戦の帯（上下の黒帯） */
#cine i { position: absolute; left: 0; right: 0; height: 0; background: #000; transition: height .6s ease; }
#cine i:first-child { top: 0; }
#cine i:last-child { bottom: 0; }
#cine.on i { height: 9vh; }
/* 低い画面では黒帯を細く、帯の間は上の札を隠す（題の札だけを見せる） */
@media (max-height: 500px) { #cine.on i { height: 5vh; } }
#hud:has(#cine.on) .tl, #hud:has(#cine.on) .tr, #hud:has(#cine.on) #armybar, #hud:has(#cine.on) #compass { opacity: 0; transition: opacity .4s; }
/* 開戦の題の札の間は、ほかの札も全部引っ込めて一枚の絵にする */
#hud:has(#banner.show) #combo { visibility: hidden; }
#hud:has(#intro:not([hidden])) :is(.bl, .bottom, #tutorial, #h-units, #h-squad, #subtitle, #bark, #markers, #situation, #skiphint) { opacity: 0; transition: opacity .4s; }
/* 一時停止など戦の上に画面を開いている間は、組の札を透かして見せない（下の釦と重なって読みにくい） */
body:has(#screen:not([hidden])) #hud #h-squad, body:has(#pause:not([hidden])) #hud :is(#h-squad, #armybar, .bl) { visibility: hidden !important; }
/* 開戦の題字の間は、指の丸も控えめに（題の一場面を釦で埋めない。触れればすぐ効く） */
body:has(#intro:not([hidden])) #tc { visibility: hidden; pointer-events: none; }
/* 左上：戦功の札 */
.tl { width: 230px; gap: 8px; }
.plaque { display: inline-flex; align-items: baseline; gap: 8px; padding: 6px 14px 6px 12px; background: var(--lacquer); box-shadow: inset 0 0 0 1px var(--gold-line); border-left: 3px solid var(--kin); width: max-content; }
.plaque .pl-lbl { font-family: var(--display); font-size: max(12px, calc(13px * var(--text-scale, 1))); letter-spacing: .3em; color: var(--kin); }
.plaque strong { font-family: var(--display); font-size: max(12px, calc(26px * var(--text-scale, 1))); color: #f3e6c4; font-variant-numeric: tabular-nums; text-shadow: 0 0 10px rgba(194,162,90,.35); }
.plaque small { font-size: max(12px, calc(12px * var(--text-scale, 1))); color: var(--washi-faint); }
.next { width: 210px; }
/* 左下：名と体力・気力・士気（太めのゲージ） */
.bl { position: absolute; left: 20px; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); width: 300px; display: grid; gap: 5px; padding: 10px 14px 12px; background: linear-gradient(90deg, var(--lacquer), rgba(14,11,8,.35)); box-shadow: inset 0 0 0 1px rgba(194,162,90,.22); }
.bl .who { font-size: max(12px, calc(18px * var(--text-scale, 1))); margin-bottom: 2px; }
.bl .bar { grid-template-columns: 34px 1fr 60px; }
.bl .bar i { height: 10px; border: 1px solid rgba(0,0,0,.8); box-shadow: inset 0 0 0 1px rgba(236,228,210,.12); background: rgba(0,0,0,.55); }
.bl .bar.hp i b { background: linear-gradient(180deg, #e0553a, #9a2716); }
.bl .bar.horse i b { background: linear-gradient(180deg, #b0875a, #6e4a2a); }
.bl .bar.breath i b { background: linear-gradient(180deg, #d9d2c0, #8f8878); }
.bl .bar.horse span, .bl .bar.breath span { white-space: nowrap; }
.bl .bar.sta i b { background: linear-gradient(180deg, #6f9ee6, #2e5aa0); }
.bl .bar.mor i { height: 6px; }
.bl .bar.mor i b { background: linear-gradient(180deg, #8fb06a, #4f6a34); }
/* 上：両軍の兵力と陣太鼓時計 */
#armybar { position: absolute; left: 50%; top: calc(12px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); display: grid; grid-template-columns: minmax(0, 290px) auto minmax(0, 290px); align-items: center; gap: 10px; width: min(760px, 94vw); }
#armybar .side { display: grid; gap: 4px; }
/* 明るい空・霧の上でも帯の字が読めるよう、後ろに薄い墨のぼかし（枠は作らない） */
#armybar::before { content: ''; position: absolute; inset: -8px -28px -6px; z-index: -1; pointer-events: none; background: radial-gradient(closest-side, rgba(10,9,7,.55), rgba(10,9,7,.3) 60%, rgba(10,9,7,0)); }
#armybar .side .nm { display: flex; align-items: center; gap: 8px; font-family: var(--display); font-size: max(12px, calc(16px * var(--text-scale, 1))); letter-spacing: .08em; text-shadow: 0 1px 3px #000, 0 0 6px #000; }
#armybar .side.b .nm { justify-content: flex-end; }
#armybar .side canvas { width: 22px; height: 22px; border-radius: 50%; box-shadow: 0 0 0 1px rgba(0,0,0,.8), 0 0 0 2px var(--gold-line); }
/* 時計を隠している間も、両軍の札は左右同じ幅に（敵の名が長いと、味方の名が「織田…」に詰まっていた） */
#armybar .side.a { grid-column: 1; } #armybar .side.b { grid-column: 3; }
#armybar .side .nm { min-width: 0; }
#armybar .side .nm .n { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#armybar .side .nm small, #armybar .side .nm canvas { flex: none; }
#armybar .side .nm small { font-family: var(--ui); font-size: max(12px, calc(12px * var(--text-scale, 1))); color: var(--washi-dim); font-variant-numeric: tabular-nums; }
#armybar .gauge { height: 9px; background: rgba(0,0,0,.65); box-shadow: inset 0 0 0 1px rgba(236,228,210,.15), 0 0 0 1px rgba(0,0,0,.8); position: relative; overflow: hidden; }
#armybar .gauge b { position: absolute; top: 0; bottom: 0; transition: width .4s; }
#armybar .a .gauge b { right: 0; background: linear-gradient(180deg, var(--ai-bright), var(--ai-deep)); }
#armybar .b .gauge b { left: 0; background: linear-gradient(180deg, #e0553a, #8e2f1f); }
#armybar .clock { min-width: 86px; text-align: center; padding: 4px 12px; background: #0c0a08; box-shadow: inset 0 0 0 1px var(--gold-line), 0 0 0 1px #000; font-family: var(--display); font-size: max(12px, calc(22px * var(--text-scale, 1))); font-weight: 800; letter-spacing: .06em; color: #f3e6c4; font-variant-numeric: tabular-nums; }
/* 戦の時計は、試合っぽさを消すため普段は隠す。軍配（M）を開いた時だけ見せる */
#armybar .clock { display: none; }
#hud.gb-open #armybar .clock { display: block; }
#armybar .clock small { display: block; font-family: var(--ui); font-weight: 500; font-size: max(12px, calc(12px * var(--text-scale, 1))); letter-spacing: .2em; color: var(--washi-faint); margin-top: -2px; }
/* 右上：年月日・季節・天気・刻 */
#dateline { white-space: nowrap; font-family: var(--display); font-size: max(12px, calc(12.5px * var(--text-scale, 1))); letter-spacing: .08em; color: #efe3c2; text-shadow: 0 1px 3px #000; text-align: right; }
#objectives { background: var(--lacquer); box-shadow: inset 0 0 0 1px rgba(194,162,90,.28); padding: 10px 14px 10px 16px; }
#objectives h4 { border-bottom: 1px solid var(--gold-line); padding-bottom: 5px; }
#minimap { border: 2px solid rgba(194,162,90,.55); box-shadow: 0 0 0 1px #000, 0 0 0 5px rgba(14,11,8,.7), 0 0 0 6px rgba(194,162,90,.3); }
/* 組の札は左下の体力の上へ */
.topc { left: 20px; top: auto; bottom: calc(150px + env(safe-area-inset-bottom, 0px)); transform: none; flex-wrap: wrap; max-width: 300px; white-space: normal; gap: 6px 14px; padding: 8px 14px; border-top: 0; border-left: 3px solid var(--shu); background: var(--lacquer); box-shadow: inset 0 0 0 1px rgba(194,162,90,.2); }
.topc .pips { max-width: 100%; order: 10; flex-basis: 100%; }
/* 下：武器・号令の札（四角い枠と小さな絵） */
.bottom { gap: 5px; }
.slot { width: 56px; height: 56px; background: rgba(12,10,8,.78); border: 1px solid rgba(0,0,0,.9); box-shadow: inset 0 0 0 1px rgba(194,162,90,.28); color: var(--washi); font-size: max(12px, calc(12px * var(--text-scale, 1))); align-content: end; padding-bottom: 4px; }
.slot svg { position: absolute; left: 50%; top: 8px; transform: translateX(-50%); width: 26px; height: 26px; stroke: #e9dcb8; fill: none; stroke-width: 1.6; }
.slot.on { box-shadow: inset 0 0 0 2px var(--kin), 0 0 12px rgba(194,162,90,.35); }
.slot.cmd { width: 68px; padding: 0 0 4px; }
.slot.cmd.ready { box-shadow: inset 0 0 0 1px rgba(194,162,90,.6); }
.slot.cmd em, .slot em { position: absolute; left: 4px; top: 2px; font-size: max(12px, calc(12px * var(--text-scale, 1))); color: var(--washi-faint); margin: 0; right: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.slot .cd { position: absolute; inset: auto 0 0 0; background: rgba(0,0,0,.6); }
/* 見出し：筆で掃いた朱の帯に白抜きの字 */
#banner { top: 26%; }
#banner .brush { display: inline-block; padding: 14px 70px 18px; background-size: 100% 100%; background-repeat: no-repeat; color: #fff; -webkit-text-stroke: 1.5px rgba(40,8,4,.9); paint-order: stroke fill; text-shadow: 0 3px 10px rgba(0,0,0,.6); }
#banner small { color: #f0e2c0; text-shadow: 0 1px 3px #000; }
#banner small { max-width: min(640px, 56vw); margin-left: auto; margin-right: auto; overflow-wrap: anywhere; text-wrap: balance; line-height: 1.55; }
/* 開戦の大見出し（藍の濃淡に白の縁取り） */
#intro { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; pointer-events: none; }
#intro .vs { font-family: var(--display); font-weight: 800; font-size: max(12px, calc(clamp(40px, 7vw, 88px) * var(--text-scale, 1))); letter-spacing: .08em; line-height: 1.1; background: linear-gradient(180deg, #ffffff 0%, #bcd4f5 40%, #2e5aa0 100%); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-stroke: 2px #fff; filter: drop-shadow(0 4px 10px rgba(0,0,0,.7)); animation: introIn 3.4s ease-out forwards; }
#intro .vs em { font-style: normal; font-size: .6em; margin: 0 .4em; -webkit-text-stroke: 1.5px #fff; }
#intro .sub { font-family: var(--display); font-size: max(12px, calc(clamp(18px, 2.4vw, 28px) * var(--text-scale, 1))); color: #f3e6c4; letter-spacing: .3em; margin-top: 10px; text-shadow: 0 2px 6px #000; animation: introIn 3.4s ease-out forwards; }
#intro .date { font-size: max(12px, calc(13px * var(--text-scale, 1))); color: var(--washi-dim); letter-spacing: .3em; margin-top: 8px; animation: introIn 3.4s ease-out forwards; text-shadow: 0 1px 3px #000; }
@keyframes introIn { 0% { opacity: 0; transform: scale(1.12); } 12% { opacity: 1; transform: scale(1); } 78% { opacity: 1; } 100% { opacity: 0; } }
/* 開戦の題の札（映画の題のように、静かに浮かんで消える） */
#intro .card { animation: introCard 4.5s ease-out forwards; padding: 26px 72px; background: radial-gradient(ellipse closest-side, rgba(10,8,6,.5), rgba(10,8,6,.28) 60%, transparent); }
#intro .card .date { font-family: var(--display); font-size: max(12px, calc(clamp(12px, 1.4vw, 15px) * var(--text-scale, 1))); letter-spacing: .45em; color: #d8cfb8; margin: 0 0 14px; animation: none; text-shadow: 0 1px 4px #000, 0 0 10px rgba(0,0,0,.8); }
#intro .card .ttl { font-family: var(--display); font-weight: 600; font-size: max(12px, calc(clamp(30px, 5vw, 60px) * var(--text-scale, 1))); letter-spacing: .32em; padding-left: .32em; color: #efe7d4; text-shadow: 0 2px 14px rgba(0,0,0,.9), 0 0 2px rgba(0,0,0,.9); line-height: 1.2; }
#intro .card .rule { display: block; width: min(420px, 64vw); height: 1px; margin: 16px auto 12px; background: linear-gradient(90deg, transparent, rgba(236,228,210,.7), transparent); }
#intro .card .sides { font-family: var(--display); font-size: max(12px, calc(clamp(14px, 1.7vw, 19px) * var(--text-scale, 1))); letter-spacing: .35em; color: #e4dac2; text-shadow: 0 1px 6px #000; }
#intro .card .sides em { font-style: normal; margin: 0 .9em; color: #c98a6e; font-size: .85em; }
/* 動きを減らす時は、題の札を動かさずにそのまま見せる（消すのは時間で） */
body.rm #intro .card { animation: none !important; opacity: 1; }
@media (prefers-reduced-motion: reduce) { #intro .card { animation: none !important; opacity: 1; } }
/* 背の低い画面（スマホ横）：開戦の題の札が戦場の3分の1を超えて食わないよう、余白と字を小さく */
@media (max-height: 500px) {
  #intro .card { padding: 12px 28px; }
  #intro .card .date { font-size: max(12px, calc(12px * var(--text-scale, 1))); margin: 0 0 8px; }
  #intro .card .ttl { font-size: max(12px, calc(clamp(20px, 4vw, 34px) * var(--text-scale, 1))); letter-spacing: .2em; padding-left: .2em; }
  #intro .card .rule { width: min(220px, 40vw); margin: 10px auto 8px; }
  #intro .card .sides { font-size: max(12px, calc(clamp(13px, 1.6vw, 15px) * var(--text-scale, 1))); letter-spacing: .2em; }
  #intro .card .sides em { font-size: max(12px, calc(12px * var(--text-scale, 1))); }
  /* 同じ低い画面の決まり：戦の途中の見出し札（#banner。例「朝倉の先手」）も3分の1を超えないよう縮める */
  #banner { top: 20%; font-size: max(12px, calc(clamp(18px, 4.4vw, 34px) * var(--text-scale, 1))); }
  #banner .brush { padding: 7px 28px 9px; }
  #banner small { font-size: max(12px, calc(12px * var(--text-scale, 1))); margin-top: 3px; letter-spacing: .08em; line-height: 1.5; }
  /* 任務が変わった時の長い字が枠で切れない：左右に余白を取り、字は折り返す（携帯 844×390） */
  #banner { padding: 0 max(16px, env(safe-area-inset-left)) 0 max(16px, env(safe-area-inset-right)); box-sizing: border-box; }

.slot.cmd.dim { opacity: .4; }
/* 使えない札も字は読めるように（薄めすぎず、理由の字で見せる） */

/* 平時はまわりの札を薄く */
#hud.calm #objectives, #hud.calm .bottom, #hud.calm .topc, #hud.calm #compass, #hud.calm .tr canvas { opacity: .45; transition: opacity .8s; }
#hud #objectives, #hud .bottom, #hud .topc, #hud #compass { transition: opacity .3s; }
/* HUD の三つの層（RDR2・Ghost of Tsushima の考え）：平時（敵が近くにいない・戦っていない時）は、
   両軍の兵力の帯・戦況・操作の札・満ちた体力の札を消して、世界そのものを見せる。敵が近づけばすぐ戻る */
#hud #armybar, #hud #situation, #hud .bl, #hud .tl { transition: opacity .6s; }
#hud.calm #situation, #hud.calm .bottom, #hud.calm .bl.full { opacity: 0; transition: opacity 1.6s; }
/* 兵力の差（両軍の残り）は平時でも消さず、戦の間ずっと出す（薄くするだけ。kaito 10/2 指摘1） */
#hud.calm #armybar { opacity: .82; transition: opacity 1.2s; }
#hud.calm .tl { opacity: .5; transition: opacity 1.6s; }
#hud.calm #objectives { opacity: .85; }
#hud #dateline { transition: opacity 1.2s; }
/* 兵力の帯は細めに（空と旗の林を広く見せる） */
@media (min-width: 1001px) { #armybar { width: min(640px, 60vw); } }
#hud.army-off #armybar, #hud.date-off #dateline { opacity: 0; visibility: hidden; transition: opacity 1.2s, visibility 0s 1.2s; }
/* 戦の中は「次の身分まで」を出さない（戦の後の評価で見せる） */
#hud .tl .next { display: none; }
/* 任務の札：ふだんは全部。高さの低い画面（携帯の横向き）では今やる一つだけと「ほか n 件」 */
#objectives li.more { display: none; }
@media (max-height: 500px) {
  #objectives:not(.expand) li:not(.cur):not(.more) { display: none; }
  #objectives.expand li.more { display: none; }
  /* 読むだけの任務には見回す指を通す。一覧を開く行と、開いた一覧だけが指を受ける。 */
  #hud #objectives { pointer-events: none; cursor: default; }
  #hud #objectives.expand, #hud #objectives li.more { pointer-events: auto; cursor: pointer; }
  #objectives li.more { display: block; font-size: max(12px, calc(12px * var(--text-scale, 1))); color: var(--washi-dim); text-align: right; margin-top: 2px; min-height: 44px; line-height: 44px; }
  #objectives h4 { display: none; }
  /* iPhone横：今やる任務は一つだけなので、大きく・下地を付けて目立たせる（kaito 10/2 指摘2） */
  #objectives li.cur:not(.done) { font-size: max(12px, calc(16.5px * var(--text-scale, 1))); line-height: 1.4; padding: 6px 8px; background: rgba(194,162,90,.16); box-shadow: inset 0 0 0 1px var(--gold-line); border-radius: 2px; }
  #objectives li.cur:not(.done) .tag { font-size: max(12px, calc(12.5px * var(--text-scale, 1))); }
  /* 組の札（#h-squad）は顔の札と同じ事を言うので、低い画面では出さない */
  #hud #h-squad { display: none; }
  /* 顔の札は低く（顔・士気の輪・数・名だけ） */
  #hud #h-units .uc { height: 78px; width: 56px; }
  #hud #h-units .face { width: 40px; height: 40px; margin-top: 3px; }
  #hud #h-units .ring { width: 50px; height: 50px; margin-left: -25px; top: 3px; }
  #hud #h-units .cnt { top: 32px; }
  #hud #h-units .nm { margin-top: 5px; max-width: 54px; }
  #hud #h-units .uc.ally .st { display: none; }
  #hud #h-units .ready { display: none; }
  /* 指の端末の低い画面：兵力の帯は細く、方角の帯はその下へ。顔の札は号令の丸に掛からない幅に */
  html.touch #hud #armybar { width: min(360px, 40vw); }
  html.touch #hud #armybar .clock { min-width: 52px; padding: 1px 6px; font-size: max(12px, calc(16px * var(--text-scale, 1))); }
  html.touch #hud #armybar .side .nm small { display: none; }
  html.touch #hud #compass { top: calc(58px + env(safe-area-inset-top, 0px)); width: min(340px, 40vw); }
  html.touch #hud #h-units { max-width: 22vw; }
  /* 触れない低い画面：顔の札（一段・幅の 45% まで）の左に字幕を寄せる */
  html:not(.touch) #hud:has(#h-units:not([hidden])) #subtitle { left: 16px; bottom: 104px; transform: none; max-width: calc(55vw - 56px); text-align: left; }
  html.touch #hud .tl { width: 176px; }
  /* 知らせ（#bark）は低い画面では方角の帯の下の一か所に（照準・一時の字とぶつけない） */
  #hud #bark { top: calc(112px + env(safe-area-inset-top, 0px)); bottom: auto; left: 58%; transform: translateX(-50%); max-width: min(40vw, 350px); }
  #hud #bark .bk { font-size: max(12px, calc(14px * var(--text-scale, 1))); }
  #hud:has(#boss:not([hidden])) #bark { top: calc(150px + env(safe-area-inset-top, 0px)); }
  /* 字幕は小さめにして二行に収める（戦場の真ん中を塞がない） */
  #hud:not([data-sub="l"]) #subtitle { font-size: max(12px, calc(14.5px * var(--text-scale, 1))); line-height: 1.45; }
  /* 左下の札は名と体力だけに（士気は顔の札の輪で見る） */
  #hud .bl .who small { display: none; }
}
/* 狙いの札は方角の帯の下へ（帯の字と重ねない） */
#hud #h-squad + #target { top: calc(100px + env(safe-area-inset-top, 0px)); }
/* 四隅の札の縁：金の太い線をやめ、細く沈んだ線にして画面の四隅を軽く（字の読みやすさは下地で保つ） */
#hud .plaque { box-shadow: inset 0 0 0 1px rgba(194,162,90,.22); border-left-width: 2px; }
#hud #minimap { border: 1px solid rgba(194,162,90,.4); box-shadow: 0 0 0 1px rgba(0,0,0,.7), 0 0 0 4px rgba(14,11,8,.45); }
#hud #objectives { box-shadow: inset 0 0 0 1px rgba(194,162,90,.16); }
#hud.novice #compass, #hud.novice #minimap { visibility: hidden; }
/* 平時は照準の点も消す（敵が近づけば戻る） */
#hud.calm #crosshair { opacity: 0; transition: opacity 1.2s; }
/* 手ほどきの札が出ている間は、組の札（顔の札と同じ事を言う）を畳む */
#hud:has(#tutorial:not([hidden])) #h-squad { display: none; }
/* 今やる任務の一行は少し大きく、方角の帯の◆と同じ金で */
#objectives li.cur:not(.done) { font-size: max(12px, calc(14.5px * var(--text-scale, 1))); color: #f3e6c4; }
#objectives li.cur:not(.done) .tag { color: var(--kin); border-color: var(--gold-line); }
/* 指の端末：字幕を押すと会話の記録が開く事を、字幕の右端の小さな印で */
html.touch #hud #subtitle:not(:empty)::after { content: '記録'; display: inline-block; margin-left: 8px; padding: 0 5px; font-size: max(12px, calc(12px * var(--text-scale, 1))); line-height: 1.5; color: var(--kin); border: 1px solid var(--gold-line); vertical-align: middle; }

.mk.dimmed { opacity: .5; }
#hud .mk.minor::before { width: 5px; height: 5px; border-width: 1px; }
.mk.quiet { opacity: .6; transform: translate(-50%, -100%) scale(.88); transition: opacity .6s; }
/* HUD「最小」：平時は任務（今やる一つだけ残す）・小地図・方角・戦功も引っ込める */
#hud.hudmin.calm :is(#compass, .tr canvas, .tl) { opacity: 0; transition: opacity 1.6s; }

#hud.hudmin.calm #objectives h4 { display: none; }

#hud.ending :is(.tl, .tr, .bl, .bottom, #armybar, #compass, #h-units, #h-squad, #markers, #tutorial, #situation, #crosshair, #staring, #threats, #target, #boss, #prompt, #skiphint) { opacity: 0; transition: opacity 1.2s; pointer-events: none; }
/* 満ちた気力の棒は畳む */
#hud .bar.sta.full { display: none; }
/* コントラストを上げる */
#hud.hc .bl, #hud.hc #objectives, #hud.hc .plaque, #hud.hc .topc, #hud.hc .slot { background: rgba(0,0,0,.92); }
#hud.hc { font-weight: 500; }
#hud.hc #subtitle { text-shadow: 0 0 4px #000, 0 0 8px #000, 0 0 12px #000; }
/* 字幕の下地 */
#hud.subbg #subtitle:not(:empty) { background: rgba(8,7,5,.62); padding: 6px 16px; }
/* 任務札：主は大きく、命令は朱の帯 */
#objectives li.main { font-size: max(12px, calc(13.5px * var(--text-scale, 1))); }

.townsky { height: 34px; margin-bottom: 4px; background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 600 34' preserveAspectRatio='none'><path d='M0 34 V22 L20 14 L40 22 V20 L60 12 L80 20 V24 L95 18 L110 24 V16 L135 6 L160 16 V22 L180 14 L200 22 V18 L225 10 L250 18 V24 L265 17 L280 24 V14 L300 4 L320 14 V22 L340 15 L360 22 V19 L385 9 L410 19 V23 L425 16 L440 23 V15 L465 7 L490 15 V22 L510 14 L530 22 V20 L555 11 L580 20 L600 20 V34 Z' fill='%232c2821'/></svg>") no-repeat bottom / 100% 100%; opacity: .9; }
.tabs button svg { width: 15px; height: 15px; vertical-align: -3px; margin-right: 5px; stroke: currentColor; fill: none; stroke-width: 1.6; }

#ld-lore small { font-family: var(--ui); font-size: max(12px, calc(12px * var(--text-scale, 1))); letter-spacing: .3em; color: var(--kin); border-right: 2px solid var(--kin); padding-right: 8px; text-align: right; }
@media (max-height: 500px) { #ld-lore { margin-top: 10px; gap: 4px; } #ld-lore p { font-size: max(12px, calc(14px * var(--text-scale, 1))); } }
/* 進みの棒（10/2）：左から伸びる。動かすのは main.js の ldStep・題までは下の #boot の小さな script */
#loading .ldbar, #boot .ldbar { width: min(320px, 70vw); height: 6px; border-radius: 3px; background: var(--sumi-3); margin: 16px auto 0; overflow: hidden; position: relative; }
#loading .ldbar i, #boot .ldbar i { position: absolute; inset: 0; background: var(--kin); transform-origin: left center; transform: scaleX(0); will-change: transform; }
#boot { position: fixed; inset: 0; z-index: 60; box-sizing: border-box; overflow-y: auto; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: grid; place-items: center; background: var(--sumi); color: var(--washi); text-align: center; transition: opacity .35s; }
#boot.out { opacity: 0; pointer-events: none; }
#boot .bt { font-family: var(--display); font-size: max(12px, calc(28px * var(--text-scale, 1))); letter-spacing: .3em; color: var(--washi); }
#boot #boot-st { margin-top: 12px; font-family: var(--ui); font-size: max(12px, calc(15px * var(--text-scale, 1))); }
#boot #boot-left { margin-top: 4px; font-family: var(--ui); font-size: max(12px, calc(13px * var(--text-scale, 1))); opacity: .85; min-height: 1.4em; }
@keyframes ldbar { from { left: -40%; } to { left: 100%; } }

/* ================= 第5弾 ================= */
kbd.cap { display: inline-block; min-width: 1.4em; padding: 0 5px; margin: 0 2px; border: 1px solid rgba(236,228,210,.45); border-bottom-width: 2px; border-radius: 3px; font-family: var(--ui); font-size: .92em; line-height: 1.35; text-align: center; color: #f3e6c4; background: rgba(255,255,255,.04); }
#subtitle .sp.me { color: #f1e9d6; }
#subtitle .sp.grunt { color: var(--washi-dim); }
#subtitle .sp.foe { color: #ff9a86; }
#subtitle .sp.lord { color: var(--kin); }
#crosshair[data-style="cross"] i { width: 14px; height: 2px; margin: -1px 0 0 -7px; border-radius: 0; box-shadow: 0 0 0 1px rgba(0,0,0,.6); }
#crosshair[data-style="cross"] i::after { content: ""; position: absolute; left: 6px; top: -6px; width: 2px; height: 14px; background: inherit; }
#crosshair[data-style="none"] i { opacity: 0; }
#tutorial { position: absolute; left: calc(20px + env(safe-area-inset-left, 0px)); top: 36%; width: 220px; padding: 10px 12px; background: var(--lacquer); box-shadow: inset 0 0 0 1px var(--gold-line); font-size: max(12px, calc(12.5px * var(--text-scale, 1))); line-height: 1.9; }
#tutorial h5 { margin: 0 0 4px; font-family: var(--display); font-size: max(12px, calc(14px * var(--text-scale, 1))); color: var(--kin); letter-spacing: .1em; display: flex; justify-content: space-between; }
#tutorial h5 span { font-family: var(--ui); font-size: max(12px, calc(12px * var(--text-scale, 1))); color: var(--washi-dim); }
#tutorial div { display: flex; gap: 8px; align-items: center; }
#tutorial div i { width: 14px; height: 14px; border: 1px solid var(--washi-faint); font-style: normal; font-size: max(12px, calc(12px * var(--text-scale, 1))); display: grid; place-items: center; color: var(--kin); }
#tutorial div.done { color: var(--washi-faint); }
#tutorial div.done i { border-color: var(--kin); }
/* 判断の札は右上の端に小さく（戦場の真ん中を隠さない）。携帯横は別の場所へ上の規則で動かす */
#choice { position: absolute; right: calc(16px + env(safe-area-inset-right, 0px)); left: auto; top: calc(16px + env(safe-area-inset-top, 0px)); transform: none; width: min(320px, 46vw); padding: 10px 14px; background: rgba(12,10,8,.9); box-shadow: inset 0 0 0 1px var(--gold-line), 0 0 0 1px #000; }
#choice h5 { margin: 0 0 10px; font-family: var(--display); font-size: max(12px, calc(16px * var(--text-scale, 1))); font-weight: 600; color: #f3e6c4; }
#choice .opt { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; width: 100%; min-height: 44px; box-sizing: border-box; padding: 8px 0; border: 0; border-top: 1px solid var(--line); background: transparent; color: var(--washi); font: inherit; text-align: left; pointer-events: auto; cursor: pointer; }
#choice .opt + .opt { margin-top: 8px; }
#choice .opt:active { background: rgba(236,228,210,.12); }
#choice .opt:focus-visible { outline: 3px solid var(--kin); outline-offset: 0; box-shadow: 0 0 0 5px #14120f; }
#choice .opt b { font-weight: 500; }
#choice .opt small { grid-column: 2; color: var(--washi-dim); font-size: max(12px, calc(12px * var(--text-scale, 1))); }
/* 実績は斬り合いの画面を塞がず、戦功の札へ送る。 */
body:has(#hud.battle-active:not([hidden])) .zk-toasts, body:has(#hud.battle-active):has(#pause:not([hidden])) .zk-toasts { display: none; }
#choice .choice-help { margin: 0 0 4px; font-size: max(12px, calc(12px * var(--text-scale, 1))); line-height: 1.4; }
#choice .tm { height: 2px; background: var(--sumi-3); margin-top: 8px; position: relative; }
#choice .tm i { position: absolute; inset: 0; right: auto; background: var(--kin); }
/* 判断の札が出ている間は、戦場が札に食われないよう、ほかの一時の札を引っ込める（パソコンの広い画面でも） */
#hud:has(#choice:not([hidden])) :is(#compass, #bark, #boss, #tutorial, #skiphint, #flash, #cmdpanel) { visibility: hidden; }
/* パソコンでは判断の札と任務の札がどちらも右上にあり、字が重なって読めなかった（10/2 志賀 1600×900）。札が出ている間は任務を引っ込める */
@media (min-height: 501px) { #hud:has(#choice:not([hidden])) #objectives { visibility: hidden; } }

/* ================= 第5弾（画面） ================= */
.pb { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; font-size: max(12px, calc(12px * var(--text-scale, 1))); font-weight: 700; color: #111; font-family: var(--ui); }
.pb-a { background: #6fbf5a; } .pb-b { background: #d9534a; } .pb-x { background: #4f8fd9; } .pb-y { background: #e0b23a; }
.mdiag { display: block; max-width: 360px; margin-top: 10px; border: 1px solid var(--line); }
.sic svg { width: 16px; height: 16px; vertical-align: -3px; margin-right: 6px; stroke: var(--washi-dim); fill: none; stroke-width: 1.5; }
.bossline { font-size: max(12px, calc(14px * var(--text-scale, 1))); margin: 6px 0 10px; }
.bossline b { color: var(--kin); font-weight: 500; margin-right: 6px; font-family: var(--display); }
.base.tod-2 { background: linear-gradient(180deg, rgba(160,180,200,.05), transparent 30%); }
.base.tod-1 { background: linear-gradient(180deg, rgba(220,200,150,.05), transparent 30%); }
.base.tod-0 { background: linear-gradient(180deg, rgba(200,120,70,.08), transparent 35%); }
.preview3d.flash { animation: pvflash .6s ease-out; }
@keyframes pvflash { 0% { box-shadow: 0 0 0 0 rgba(194,162,90,.0); } 30% { box-shadow: 0 0 30px 6px rgba(194,162,90,.5); } 100% { box-shadow: 0 0 0 0 rgba(194,162,90,0); } }
.settings .s-row label small { display: block; font-size: max(12px, calc(12px * var(--text-scale, 1))); color: var(--washi-faint); margin-top: 2px; line-height: 1.5; }
.st-tabs { margin-bottom: 4px; }
.botpanel { position: fixed; right: 16px; top: 16px; z-index: 50; width: min(520px, 90vw); max-height: 80vh; overflow: auto; background: rgba(12,10,8,.94); border: 1px solid var(--gold-line); padding: 12px 14px; font-size: max(12px, calc(12.5px * var(--text-scale, 1))); line-height: 1.7; }
.botpanel pre { white-space: pre-wrap; font-size: max(12px, calc(12px * var(--text-scale, 1))); color: var(--washi-dim); }
.debugbar { position: fixed; left: 50%; bottom: 4px; transform: translateX(-50%); z-index: 50; display: flex; gap: 6px; align-items: center; background: rgba(12,10,8,.85); padding: 4px 8px; font-size: max(12px, calc(12px * var(--text-scale, 1))); border: 1px solid var(--line); }
.debugbar button { font-size: max(12px, calc(12px * var(--text-scale, 1))); background: var(--sumi-2); color: var(--washi); border: 1px solid var(--line); padding: 2px 8px; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--kin); outline-offset: 2px; box-shadow: 0 0 12px rgba(194,162,90,.35); }

/* ================= 第6弾 ================= */
#prompt small { color: var(--washi-dim); margin-left: 4px; }
.holdbar { display: block; height: 3px; margin-top: 4px; background: rgba(0,0,0,.6); position: relative; }
.holdbar b { position: absolute; inset: 0; right: auto; background: var(--kin); }
