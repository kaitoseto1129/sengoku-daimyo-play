/* 疲れの縁は、脈打たせると画面の端が黒く明滅して見える（kaito 報告）。動かさず一段暗くするだけにする */
#vignette.winded:not(.hurt) { animation: none; box-shadow: inset 0 0 220px rgba(0,0,0,.62); }
@keyframes vside { 0% { background: radial-gradient(circle at var(--hx) var(--hy), rgba(170,20,0,.55), transparent 45%); } 100% { background: radial-gradient(circle at var(--hx) var(--hy), rgba(170,20,0,0), transparent 45%); } }
#hud.no-minimap #minimap, #hud.no-compass #compass, #hud.no-army #armybar, #hud.no-army #situation, #hud.no-squad .topc, #hud.no-bottom .bottom, #hud.no-objectives #objectives { display: none !important; }
body.mincho, body.mincho button, body.mincho .note { font-family: var(--display); }
#objectives li.justdone .tag { animation: jd .8s ease-out; background: var(--kin); color: var(--sumi); }
@keyframes jd { 0% { transform: scale(1.8); } 100% { transform: scale(1); } }
/* 場面の切り替え：墨の帯が画面を掃く */
#wipe { position: fixed; inset: 0; pointer-events: none; z-index: 40; background: linear-gradient(100deg, transparent 0%, rgba(8,7,5,.0) 30%, rgba(8,7,5,.96) 42%, rgba(8,7,5,.96) 58%, rgba(8,7,5,0) 70%, transparent 100%); background-size: 300% 100%; background-position: 100% 0; opacity: 0; }
#wipe.go { animation: wipe .7s ease-in-out; }
@keyframes wipe { 0% { background-position: 100% 0; opacity: 1; } 100% { background-position: 0% 0; opacity: 1; } }
/* 城下の案内 */
.tour { position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,.55); }
.tour .box { position: absolute; box-shadow: 0 8px 28px rgba(0,0,0,.5); }
.tour .box::before { content: ''; position: absolute; top: -7px; left: var(--arrow, 24px); width: 12px; height: 12px; background: var(--sumi-2); border-left: 1px solid var(--kin); border-top: 1px solid var(--kin); transform: rotate(45deg); }
.tour .box { max-width: 420px; background: var(--sumi-2); border: 1px solid var(--kin); padding: 14px 16px; font-size: max(12px, calc(14px * var(--text-scale, 1))); line-height: 1.8; }
.tour .box b { font-family: var(--display); color: var(--kin); display: block; margin-bottom: 4px; }
.tourhl { position: relative; z-index: 31; box-shadow: 0 0 0 2px var(--kin), 0 0 24px rgba(194,162,90,.6) !important; background: var(--sumi-2) !important; }
/* 評定 */
.grade { display: inline-grid; place-items: center; min-width: 64px; height: 64px; padding: 0 8px; border: 2px solid var(--shu); color: var(--shu); font-family: var(--display); font-weight: 800; font-size: max(12px, calc(26px * var(--text-scale, 1))); transform: rotate(-6deg); float: right; margin-top: -6px; background: rgba(192,69,46,.06); animation: pop .5s ease-out; }
.grade.g-甲上 { border-color: var(--kin); color: var(--kin); }
/* 記録帳・稽古場の結果 */
.records { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; margin: 14px 0; }
.records div { border: 1px solid var(--line); padding: 10px 12px; }
.records b { display: block; font-family: var(--display); font-size: max(12px, calc(24px * var(--text-scale, 1))); color: var(--kin); }
.records small { color: var(--washi-dim); font-size: max(12px, calc(12px * var(--text-scale, 1))); }
@media (max-width: 900px) { .records { grid-template-columns: repeat(3, 1fr); } }

/* 下地を薄くした分、HUD の字に影を落として読みやすく */
.bl, #objectives, #tutorial, #hint, .topc, .plaque, #squadbox { text-shadow: 0 1px 2px rgba(0,0,0,.75); }
/* 小さな添え字も 11px を下回らない */
.titles small, #prompt small, .objs small, kbd.cap { font-size: max(12px, .92em); }
/* 出世の道：十段の階段 */
.ladder { max-width: 1180px; }
.ld-title { font-family: var(--display); font-size: max(12px, calc(clamp(28px, 4vw, 40px) * var(--text-scale, 1))); letter-spacing: .12em; margin: 8px 0 6px; }
.ld-stair { position: relative; display: grid; grid-template-columns: repeat(10, 1fr); gap: 6px; align-items: end; height: 190px; margin: 22px 0 10px; padding-bottom: 14px; }
.ld-step { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 2px; margin-bottom: calc(var(--i) * 12px); min-height: 72px; padding: 8px 4px 6px; background: linear-gradient(180deg, #2a241c, #1b1813); border: 1px solid var(--line); border-top: 3px solid #3a3226; color: var(--washi-dim); cursor: pointer; transition: transform .15s, border-color .15s, background .15s; font-family: inherit; }
.ld-step .k { font-family: var(--display); font-size: max(12px, calc(12px * var(--text-scale, 1))); color: var(--washi-faint); letter-spacing: .1em; }
.ld-step b { font-family: var(--display); font-size: max(12px, calc(15px * var(--text-scale, 1))); font-weight: 800; color: var(--washi); letter-spacing: .06em; line-height: 1.25; text-align: center; }
.ld-step small { font-size: max(12px, calc(12px * var(--text-scale, 1))); color: var(--washi-faint); text-align: center; }
.ld-step em { position: absolute; top: -12px; right: -4px; font-style: normal; font-size: max(12px, calc(12px * var(--text-scale, 1))); font-weight: 700; letter-spacing: .1em; padding: 1px 6px; background: var(--shu); color: #fff6e6; }
.ld-step em.nx { background: none; border: 1px dashed var(--kin); color: var(--kin); }
.ld-step.st-done { border-top-color: var(--kin); background: linear-gradient(180deg, #33291a, #1f1a12); }
.ld-step.st-done b { color: var(--kin); }
.ld-step.st-now { border-color: var(--shu); border-top-color: var(--shu); box-shadow: 0 0 0 1px var(--shu), 0 0 22px rgba(192,69,46,.35); }
.ld-step.st-next { border-style: dashed; border-top-style: solid; border-top-color: var(--kin); }
.ld-step.st-far { opacity: .95; }   /* 字の対比 4.5:1 以上（W047） */
.ld-step small, .ld-step .k { color: var(--washi-dim); }
.ld-step.beyond { background: repeating-linear-gradient(135deg, #1d1a15 0 6px, #211d17 6px 12px); }
.ld-step.sel { transform: translateY(-6px); border-color: var(--kin); opacity: 1; }
.ld-step.sel::after { content: ''; position: absolute; left: 20%; right: 20%; bottom: -9px; height: 3px; background: var(--kin); }
.ld-step:hover { opacity: 1; border-color: rgba(194,162,90,.6); }
.ld-line { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: var(--line); }
.ld-line i { display: block; height: 100%; background: linear-gradient(90deg, var(--kin), var(--shu)); }
.ld-body { display: grid; grid-template-columns: minmax(280px, 380px) 1fr; gap: 28px; align-items: start; margin-top: 18px; }
.ld-look .preview3d { width: 100%; height: 400px; margin: 0; }
.ld-name { font-family: var(--display); font-size: max(12px, calc(34px * var(--text-scale, 1))); font-weight: 800; letter-spacing: .12em; color: var(--washi); }
.ld-name small { display: block; font-size: max(13px, calc(13px * var(--text-scale, 1))); color: var(--kin); letter-spacing: .3em; margin-bottom: 2px; }
.ld-cmd { margin: 6px 0 4px; color: var(--washi-dim); font-size: max(15px, calc(15px * var(--text-scale, 1))); }
.ld-cmd b { color: var(--washi); font-size: max(12px, calc(17px * var(--text-scale, 1))); font-variant-numeric: tabular-nums; }
.ld-cond { display: inline-block; margin: 6px 0 14px; padding: 3px 10px; font-size: max(12px, calc(13px * var(--text-scale, 1))); border: 1px solid var(--line); color: var(--washi-dim); }
.ld-cond.st-now { border-color: var(--shu); color: #f0c9b8; }
.ld-cond.st-done { border-color: var(--kin); color: var(--kin); }
.ld-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-bottom: 16px; }
.ld-cols h5 { margin: 0 0 6px; font-size: max(13px, calc(13px * var(--text-scale, 1))); letter-spacing: .25em; color: var(--kin); font-weight: 500; }
.ld-cols p { margin: 0; padding: 5px 0; border-bottom: 1px solid var(--line); font-size: max(12px, calc(14px * var(--text-scale, 1))); line-height: 1.6; }
@media (max-width: 900px) { .ld-stair { grid-template-columns: repeat(5, 1fr); height: auto; } .ld-step { margin-bottom: 0; } .ld-body { grid-template-columns: 1fr; } .ld-line { display: none; } }
/* 馬屋 */
.stable { display: grid; grid-template-columns: 300px 1fr; gap: 22px; align-items: start; }
.stable .preview3d, .stable-lock .preview3d { width: 300px; height: 300px; }
.stable-lock { display: grid; grid-template-columns: 300px 1fr; gap: 22px; align-items: center; }
.stable-lock .preview3d { filter: grayscale(.8) brightness(.7); }
.st-name { text-align: center; font-family: var(--display); font-size: max(12px, calc(24px * var(--text-scale, 1))); letter-spacing: .15em; color: var(--washi); margin: 4px 0 8px; }
.st-name small { display: block; font-family: var(--ui); font-size: max(12px, calc(12px * var(--text-scale, 1))); letter-spacing: .1em; color: var(--kin); }
.hstats { display: grid; grid-template-columns: 34px 1fr 34px 1fr 34px 1fr; gap: 4px 6px; align-items: center; margin-top: 6px; font-size: max(13px, calc(13px * var(--text-scale, 1))); color: var(--washi-dim); }
.hstats .hb { display: block; height: 5px; background: rgba(0,0,0,.4); border: 1px solid var(--line); }
.hstats .hb b { display: block; height: 100%; background: var(--kin); }
@media (max-width: 900px) { .stable, .stable-lock { grid-template-columns: 1fr; } }
/* 昇進の場面の小さな階段 */
.pc-look .preview3d.wide { width: 340px; height: 300px; }
.pc-ladder { display: flex; gap: 4px; justify-content: center; align-items: flex-end; margin: 4px 0 14px; }
.pc-ladder i { display: block; width: 26px; height: calc(8px + var(--i) * 3px); background: #2c271f; border-top: 2px solid #3a3226; }
.pc-ladder i.done { background: #3a2f1c; border-top-color: var(--kin); }
.pc-ladder i.now { background: var(--shu); border-top-color: #f0c9b8; box-shadow: 0 0 12px rgba(192,69,46,.6); animation: pop .6s ease-out 1s both; }
.pc-ladder-lbl { font-size: max(12px, calc(12px * var(--text-scale, 1))); color: var(--washi-dim); letter-spacing: .2em; margin-top: -8px; margin-bottom: 12px; }
/* エンディングの流れる字幕 */
.credits { height: min(34vh, 260px); margin: 10px 0 14px; overflow: hidden; position: relative; mask-image: linear-gradient(transparent, #000 15%, #000 85%, transparent); -webkit-mask-image: linear-gradient(transparent, #000 15%, #000 85%, transparent); }
.credits .roll { position: absolute; left: 0; right: 0; text-align: center; animation: roll 36s linear 5.5s both; line-height: 2.4; font-size: max(15px, calc(15px * var(--text-scale, 1))); color: var(--washi-dim); }
.credits .roll b { display: block; font-family: var(--display); font-size: max(12px, calc(18px * var(--text-scale, 1))); color: var(--washi); margin-top: 18px; }
@keyframes roll { from { transform: translateY(min(34vh, 260px)); } to { transform: translateY(-100%); } }
/* 写真モード */
#photoui { position: fixed; left: calc(16px + env(safe-area-inset-left, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 20; background: rgba(12,10,8,.7); padding: 8px 12px; font-size: max(12px, calc(12px * var(--text-scale, 1))); color: var(--washi-dim); line-height: 1.8; }
#photoui b { color: var(--kin); font-weight: 500; }
.photogrid { position: fixed; inset: 0; pointer-events: none; z-index: 19; background-image: linear-gradient(to right, transparent calc(33.33% - 1px), rgba(255,255,255,.25) 33.33%, transparent calc(33.33% + 1px), transparent calc(66.66% - 1px), rgba(255,255,255,.25) 66.66%, transparent calc(66.66% + 1px)), linear-gradient(to bottom, transparent calc(33.33% - 1px), rgba(255,255,255,.25) 33.33%, transparent calc(33.33% + 1px), transparent calc(66.66% - 1px), rgba(255,255,255,.25) 66.66%, transparent calc(66.66% + 1px)); }
.shot { position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,.85); display: grid; place-items: center; gap: 10px; align-content: center; }
.shot img { max-width: 86vw; max-height: 74vh; border: 1px solid var(--kin); }
.renm { background: none; border: 1px solid var(--line); color: var(--washi-dim); font-size: max(12px, calc(12px * var(--text-scale, 1))); min-height: 28px; min-width: 44px; padding: 2px 8px; margin-left: 6px; cursor: pointer; }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition: none !important; } .ledger .ln, .promo { opacity: 1; } }

/* ---------------- 日本地図（src/japan.js） ---------------- */
#screen.jp-open { padding: 0; overflow: hidden; background: var(--sumi); }
.jp { position: absolute; inset: 0; display: grid; grid-template-columns: minmax(0, 1fr) 360px; }
.jp-map { position: relative; overflow: hidden; background: #b9c0b4; }
.jp-map::after { content: ''; position: absolute; inset: 0; pointer-events: none; box-shadow: inset 0 0 0 1px rgba(0,0,0,.45), inset 0 0 70px rgba(50,36,18,.38); }
.jp-map canvas { display: block; cursor: grab; touch-action: none; }
.jp-season { position: absolute; left: calc(16px + env(safe-area-inset-left, 0px)); top: 14px; z-index: 1; display: flex; align-items: center; gap: 10px; padding: 7px 14px 7px 7px; background: rgba(236,226,202,.92); color: #241c14; box-shadow: 0 0 0 1px rgba(60,45,30,.4), 0 3px 10px rgba(0,0,0,.25); }
.jp-season b { font-family: var(--display); font-size: max(12px, calc(26px * var(--text-scale, 1))); width: 44px; height: 44px; display: grid; place-items: center; border-radius: 50%; background: #8e2f1f; color: #f3ead6; }
.jp-loop { list-style: none; margin: 0 0 10px; padding: 0; display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.jp-loop button { width: 100%; min-height: 44px; display: flex; align-items: center; justify-content: center; gap: 5px; padding: 2px 4px; background: rgba(44,40,33,.9); color: var(--washi); border: 1px solid rgba(194,162,90,.4); font: 600 max(12px, calc(13px * var(--text-scale, 1))) var(--ui); cursor: pointer; }
.jp-loop button i { font-style: normal; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: max(12px, calc(12px * var(--text-scale, 1))); border: 1px solid var(--kin); color: var(--kin); }
.jp-loop button.ok i { background: var(--kin); color: #14120f; }
.jp-loop button.on { border-color: var(--kin); background: rgba(194,162,90,.18); }
.jp-season span { font-family: var(--display); font-size: max(12px, calc(13px * var(--text-scale, 1))); line-height: 1.5; letter-spacing: .06em; }
.jp-moves { position: absolute; left: calc(16px + env(safe-area-inset-left, 0px)); top: 80px; z-index: 1; padding: 6px 12px 8px; background: rgba(236,226,202,.92); color: #241c14; box-shadow: 0 0 0 1px rgba(60,45,30,.4); max-width: min(300px, 44%); }
.jp-moves[hidden] { display: none; }
.jp-moves > small { display: block; font-size: max(12px, calc(12px * var(--text-scale, 1))); letter-spacing: .2em; color: #5a4a36; }
.jp-moves ul { list-style: none; margin: 2px 0 0; padding: 0; display: grid; gap: 2px; font-size: max(12px, calc(13px * var(--text-scale, 1))); }
.jp-moves li { display: flex; align-items: center; gap: 6px; white-space: nowrap; overflow: hidden; }
.jp-moves li i { flex: 0 0 auto; width: 10px; height: 10px; box-shadow: 0 0 0 1px rgba(0,0,0,.4); }
.jp-moves li em { font-style: normal; font-size: max(12px, calc(12px * var(--text-scale, 1))); margin-left: auto; padding: 0 5px; border: 1px solid #7a6a52; }
.jp-moves li.wn em { background: #7a2a1c; color: #f4ecd8; border-color: #7a2a1c; }
.jp-moves li.th em { color: #7a2a1c; border-color: #7a2a1c; font-weight: 700; }
@media (max-height: 500px) { .jp-moves { top: 66px; left: 8px; padding: 4px 8px; } .jp-moves ul { font-size: max(12px, calc(12px * var(--text-scale, 1))); } }
.jp-tools { position: absolute; right: calc(16px + env(safe-area-inset-right, 0px)); top: 14px; z-index: 1; display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; max-width: calc(100% - 32px - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px)); }
.jp-tools .btn { white-space: nowrap; background: rgba(236,226,202,.92); color: #241c14; border-color: rgba(60,45,30,.55); min-width: 40px; padding: 6px 12px; }
.jp-tools .btn:hover { background: #241c14; color: var(--washi); }
#jp-toolstgl { display: none; }
.jp-sidebtn { display: none; }
.jp-legend { position: absolute; left: calc(16px + env(safe-area-inset-left, 0px)); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); z-index: 1; display: flex; flex-wrap: wrap; gap: 6px 14px; max-width: calc(100% - 120px); padding: 6px 12px; background: rgba(236,226,202,.9); color: #2a2017; font-size: max(12px, calc(12px * var(--text-scale, 1))); box-shadow: 0 0 0 1px rgba(60,45,30,.35); }
.jp-legend .lg { display: inline-block; width: 12px; height: 12px; margin-right: 5px; vertical-align: -2px; border: 1.5px solid #2a2017; box-sizing: border-box; }
.jp-legend .lg.yama { border-radius: 50% 50% 2px 2px; background: rgba(120,98,66,.55); }
.jp-legend .lg.hira { background: rgba(80,110,130,.35); }
.jp-legend .lg.toride { border-style: dashed; border-radius: 50%; }
.jp-legend .lg.hq { border-radius: 50%; border-color: #b8963e; border-width: 2.5px; }
.jp-legend .lg.tgt { border-radius: 50%; border-color: #b8402a; border-style: dashed; border-width: 2px; }
.jp-hint { position: absolute; left: 50%; top: calc(18px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); z-index: 1; margin: 0; font-size: max(12px, calc(12px * var(--text-scale, 1))); color: #2a2017; background: rgba(236,226,202,.78); padding: 4px 10px; white-space: nowrap; }
.jp-side { overflow-y: auto; padding: 20px 20px 22px; background: linear-gradient(180deg, var(--sumi-2), var(--sumi)); border-left: 1px solid var(--line); transition: transform .22s ease; }
.jp-when { font-family: var(--display); font-size: max(12px, calc(28px * var(--text-scale, 1))); font-weight: 800; letter-spacing: .1em; margin: 6px 0 10px; }
.jp-when span { color: var(--kin); }
.jp-scn { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.jp-scn button { background: transparent; color: var(--washi-dim); border: 1px solid var(--line); padding: 5px 10px; font-size: max(12px, calc(12px * var(--text-scale, 1))); letter-spacing: .06em; cursor: pointer; }
.jp-scn button:hover { border-color: var(--washi-dim); color: var(--washi); }
.jp-scn button.on { color: var(--sumi); background: var(--washi); border-color: var(--washi); }
.jp-me { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; padding: 8px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.jp-me b { font-family: var(--display); font-size: max(12px, calc(18px * var(--text-scale, 1))); letter-spacing: .08em; }
.jp-me span { font-size: max(12px, calc(12px * var(--text-scale, 1))); color: var(--washi-dim); }
.jp .dot { display: inline-block; width: 11px; height: 11px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; box-shadow: 0 0 0 1px rgba(0,0,0,.55), 0 0 0 2px rgba(236,228,210,.25); }
.jp-card { border: 1px solid var(--gold-line); background: rgba(14,11,8,.55); padding: 12px 14px; margin: 12px 0 6px; }
.jp-card .row { margin-top: 10px; }
.jp-cn { margin-bottom: 6px; }
.jp-cn b { font-family: var(--display); font-size: max(12px, calc(22px * var(--text-scale, 1))); letter-spacing: .08em; }
.jp-cn small { display: block; font-size: max(12px, calc(12px * var(--text-scale, 1))); color: var(--washi-dim); letter-spacing: .06em; }
.jp-kv { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 5px 0; border-bottom: 1px solid var(--line); font-size: max(12px, calc(13px * var(--text-scale, 1))); }
.jp-kv span { color: var(--washi-dim); white-space: nowrap; }
.jp-kv b { font-weight: 500; text-align: right; }
.jp-nb { display: flex; flex-wrap: wrap; gap: 4px 8px; justify-content: flex-end; }
.jp-link { background: transparent; border: 0; border-bottom: 2px solid var(--c); color: var(--washi); font-size: max(12px, calc(13px * var(--text-scale, 1))); padding: 8px 6px 4px; min-height: 32px; min-width: 44px; cursor: pointer; font-family: var(--ui); }
.jp-link:hover { color: var(--kin); }
.jp-h { font-family: var(--display); font-size: max(12px, calc(14px * var(--text-scale, 1))); letter-spacing: .14em; color: var(--kin); margin: 16px 0 6px; font-weight: 600; }
.jp-pw { display: grid; grid-template-columns: 118px 1fr 26px; align-items: center; gap: 8px; font-size: max(12px, calc(13px * var(--text-scale, 1))); padding: 3px 0; }
.jp-pw .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.jp-pw .bar { height: 8px; background: rgba(236,228,210,.08); }
.jp-pw .bar i { display: block; height: 100%; box-shadow: inset 0 0 0 1px rgba(0,0,0,.3); }
.jp-pw.me .nm { color: var(--kin); font-weight: 700; }
.jp-pw b { text-align: right; font-family: var(--display); font-variant-numeric: tabular-nums; }
.jp-log p { margin: 0; padding: 5px 0; font-size: max(12px, calc(13px * var(--text-scale, 1))); line-height: 1.6; border-bottom: 1px solid var(--line); color: var(--washi-dim); }
.jp-log p small { display: inline-block; min-width: 20px; color: var(--washi-faint); font-size: max(12px, calc(12px * var(--text-scale, 1))); margin-right: 6px; }
.jp-log p.good { color: #b3c894; }
.jp-log p.bad { color: #e38c76; }
.jp-log p.big { color: var(--washi); font-weight: 700; }
.jp-foot { margin-top: 16px; }
.jp-result { position: absolute; inset: 0; z-index: 2; display: grid; place-items: center; background: rgba(10,9,7,.5); }
.jp-rc { width: min(440px, 90%); box-sizing: border-box; background: var(--sumi-2); border: 1px solid var(--gold-line); padding: 22px 24px; box-shadow: 0 20px 60px rgba(0,0,0,.6); max-height: calc(100% - 16px); overflow-y: auto; }
.jp-rc h3 { font-family: var(--display); font-size: max(12px, calc(34px * var(--text-scale, 1))); font-weight: 800; letter-spacing: .14em; margin: 8px 0 10px; }
.jp-rc.won h3 { color: var(--kin); }
.jp-rc.lost h3 { color: var(--washi-dim); }
.jp-rc p { font-size: max(12px, calc(14px * var(--text-scale, 1))); line-height: 1.8; }
/* 携帯（横・縦とも）：地図を画面いっぱいに。横の欄は城を押した時だけ出る札に（jp-side.jp-show） */
@media (max-width: 820px), (max-height: 560px) {
  #screen.jp-open { overflow: hidden; }
  .jp { position: absolute; grid-template-columns: 1fr; grid-template-rows: 1fr; }
  .jp-side { position: absolute; inset: 0 0 0 auto; width: min(360px, 88vw); max-width: 100%; border-left: 0; border-top: 0; box-shadow: -10px 0 30px rgba(0,0,0,.55); transform: translateX(105%); z-index: 5; pointer-events: none; }
  .jp-side.jp-show { transform: translateX(0); pointer-events: auto; }
  .jp-hint { display: none; }
  .jp-legend { max-width: calc(100% - 40px); }
  .jp-sidebtn { display: inline-flex; min-width: max-content; flex: 0 0 auto; }   /* 字が縮んで切れ、隣の釦と重ならない（W044） */
  #jp-toolstgl { display: inline-flex; }
  .jp-tools:not(.open) > .btn:not(#jp-toolstgl):not(.jp-sidebtn) { display: none; }
}

/* ================= 第7弾：画面の決まり（docs/ui-guidelines.md。HIG・M3・デジタル庁に合わせる） ================= */
/* 薄い字も墨の地で 4.5:1 を超える明るさに。朱の字は明るい朱で */
:root { --washi-faint: #9a9282; --shu-text: #e38a74; --focus-in: #e9c874; --focus-out: #0b0906; }
.titles small, #prompt small, .objs small, kbd.cap { font-size: max(12px, .92em); }
/* 焦点の輪：金の輪 3px と外の墨の縁（明るい和紙の上でも暗い地でも見える） */
:where(button, [role=button], [role=tab], a, summary, input, select, textarea, canvas[tabindex], [tabindex]):focus-visible,
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, summary:focus-visible {
  outline: 3px solid var(--focus-in) !important; outline-offset: 2px; box-shadow: 0 0 0 6px var(--focus-out) !important; border-radius: 1px;
}
.diffs label:focus-within, .q .scale label:focus-within { outline: 3px solid var(--focus-in); outline-offset: 2px; box-shadow: 0 0 0 6px var(--focus-out); }
.diffs input:focus-visible, .q .scale input:focus-visible { outline: none !important; box-shadow: none !important; }
/* 押せる所は 44px 以上（主な操作は 48px） */
.btn { min-height: 48px; line-height: 1.2; }
.btn.small { min-height: 44px; padding: 10px 16px; }
.btn:active:not(:disabled) { filter: brightness(.88); }
.btn:disabled { opacity: .38; }
.btn.danger { border-color: var(--shu); color: var(--shu-text); }
.btn.danger:hover { background: var(--shu); color: #fff5ea; }
.tabs button { min-height: 44px; }
.tabs button:hover { color: var(--washi); background: rgba(236,228,210,.06); }
.tabs button[aria-selected="true"] { color: var(--washi); }
.tabs .tdot { display: inline-block; margin-left: 6px; padding: 0 5px; font-size: max(12px, calc(12px * var(--text-scale, 1))); line-height: 1.5; color: var(--sumi); background: var(--kin); letter-spacing: 0; }
.choices button { min-height: 44px; line-height: 1.5; }
.choices button:active { background: rgba(236,228,210,.1); }
.slotcard { min-height: 52px; }
.slotcard:hover { border-color: var(--washi-dim); }
.slotcard[aria-pressed="true"] b::after { content: '　選択中'; font-family: var(--ui); font-size: max(12px, calc(12px * var(--text-scale, 1))); color: var(--kin); letter-spacing: .1em; }
.diffs label { min-height: 44px; box-sizing: border-box; align-content: center; }
.diffs label:hover { border-color: var(--washi-dim); }
.diffs label:has(input:checked) { border-color: var(--kin); box-shadow: inset 0 0 0 1px var(--kin); background: rgba(194,162,90,.07); }
.diffs label small { font-size: max(12px, calc(12.5px * var(--text-scale, 1))); line-height: 1.6; }
details > summary { min-height: 44px; display: flex; align-items: center; gap: 6px; list-style: none; }
details > summary::-webkit-details-marker { display: none; }
details > summary::before { content: '▸'; color: var(--kin); transition: transform .15s; }
details[open] > summary::before { transform: rotate(90deg); }
.q .scale label { min-width: 44px; min-height: 44px; box-sizing: border-box; display: inline-flex; align-items: center; justify-content: center; }
.q .scale label:has(input:checked) { border-color: var(--kin); color: var(--washi); }
.keybind button { min-height: 44px; align-items: center; }
.keybind button:hover { border-color: var(--washi-dim); }
.settings .s-row { min-height: 44px; }
.settings select { min-height: 44px; font-size: max(12px, calc(14px * var(--text-scale, 1))); }
.settings input[type=checkbox] { width: 22px; height: 22px; }
.settings input[type=range] { min-height: 44px; }
.renm { min-height: 44px; }
.aiji button:focus-visible, .aiji button:hover { border-color: var(--kin); }
.roster .rr[data-who]:hover { background: none; }
/* 注と補足の字（13px・薄すぎない色） */
.note { font-size: max(12px, calc(13px * var(--text-scale, 1))); }
#objectives li.fail, .ledger .ln.neg .p, .ev2 .evc.ng .evc-h .p, .ev2 .evc.ng .evc-h .k, .ev2 .evc.ng .evmk { color: var(--shu-text); }
/* 確認の札：何が起きるかを書き、やめる（安全な方）を先に */
.confirm-row { border-color: var(--shu); background: rgba(192,69,46,.07); line-height: 1.7; }
.confirm-row .cf-msg b { color: var(--washi); }
.confirm-row .cf-msg small { display: block; color: var(--washi-dim); font-size: max(12px, calc(13px * var(--text-scale, 1))); }
.errbox { border: 1px solid var(--shu); background: rgba(192,69,46,.08); padding: 10px 14px; font-size: max(12px, calc(14px * var(--text-scale, 1))); color: var(--washi); }
.errbox::before { content: '！'; display: inline-grid; place-items: center; width: 20px; height: 20px; margin-right: 8px; background: var(--shu); color: #fff5ea; font-weight: 700; font-size: max(12px, calc(13px * var(--text-scale, 1))); vertical-align: 1px; }
/* タイトル：主の操作を下の帯に常に見せる */
.title-act { position: sticky; bottom: 0; z-index: 2; margin: 22px calc(50% - 50vw + 8px) 0; padding: 14px calc(50vw - 50% - 8px) 16px; background: linear-gradient(180deg, rgba(20,18,15,0), rgba(20,18,15,.92) 26%); display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
#screen { overflow-x: hidden; }
/* 設定（スマホ横）：左上に「戻る」があるので、下の帯は張り付けない（設定の行を隠さないように） */
@media (max-height: 520px) { .title-act.st-act { position: static; background: none; } }
.title-act .hintk { font-size: max(12px, calc(13px * var(--text-scale, 1))); color: var(--washi-dim); margin-left: auto; }
.title-more { margin-top: 12px; }
.title-more .lbl, .title-more summary.lbl { font-size: max(12px, calc(12px * var(--text-scale, 1))); letter-spacing: .2em; color: var(--washi-dim); margin-bottom: 8px; }
.title-more summary.lbl { cursor: pointer; display: block; min-height: 44px; display: flex; align-items: center; }
.title-more[open] summary.lbl { margin-bottom: 8px; }
.title-more .row { margin-top: 0; }
/* タイトル：主の二つ（続きから・新しく始める）の横に、小さな三つ（別の遊び方・保存データ・設定） */
.title-act .tt-sub { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-left: 8px; padding-left: 16px; border-left: 1px solid var(--line); }
.title-act .tt-sub .btn[aria-expanded="true"] { border-color: var(--kin); color: var(--kin); }
.tt-panel { margin-top: 14px; padding: 12px 16px 16px; border: 1px solid var(--line); background: rgba(20,18,15,.72); }
.tt-panel .tt-ph { font-family: var(--display); font-size: max(12px, calc(18px * var(--text-scale, 1))); letter-spacing: .12em; margin: 0 0 4px; font-weight: 600; }
.tt-panel .row { gap: 8px; flex-wrap: wrap; }
@media (max-width: 700px) { .title-act .tt-sub { margin-left: 0; padding-left: 0; border-left: 0; } }
/* HUD：字は 12px 以上、状態は色と印で */
#objectives li.order .tag { color: var(--shu-text); }
#radial .rw.locked::after { content: '（まだ）'; font-size: max(12px, calc(12px * var(--text-scale, 1))); font-family: var(--ui); }
#objectives li.main { color: #f3e6c4; }
#objectives li.main .tag { color: var(--kin); border-color: var(--gold-line); }
#objectives li.side { color: var(--washi); }
#objectives li.opt, #objectives li.opt .tag { color: var(--washi-dim); }
#objectives li.done .tag::after { content: ''; }
#objectives li.fail .tag::after { content: '✕'; margin-left: 2px; }
/* 敵将の札は画面の上（戦況の下）。狙いの札はその下へずらし、知らせと重ねない */
#boss { top: calc(118px + env(safe-area-inset-top, 0px)); bottom: auto; }
#hud:has(#boss:not([hidden])) #target { top: calc(166px + env(safe-area-inset-top, 0px)); }
#bark { bottom: calc(196px + env(safe-area-inset-bottom, 0px)); }
#bark .bk { font-size: max(12px, calc(16px * var(--text-scale, 1))); }
.slot em, .slot.cmd em { font-size: max(12px, calc(12px * var(--text-scale, 1))); color: var(--washi-dim); }
/* 日本地図：＋－などは 44px、筋書きの札も 44px */
.jp-tools .btn { min-width: 44px; min-height: 44px; }
.jp-tools .jp-sidebtn { min-width: max-content !important; width: max-content !important; flex: 0 0 auto; justify-self: end; }   /* 字が縮んで切れ、隣の釦と重ならない（W044） */
.jp-scn button { min-height: 44px; padding: 8px 12px; font-size: max(12px, calc(13px * var(--text-scale, 1))); }
.jp-scn button[aria-pressed="true"] { color: var(--sumi); background: var(--washi); border-color: var(--washi); }
.jp-link { min-height: 44px; }
.jp-hint, .jp-legend { font-size: max(12px, calc(13px * var(--text-scale, 1))); }
.jp-hint { left: auto; right: 16px; top: 68px; transform: none; white-space: normal; max-width: 300px; text-align: right; }
.jp-tlist { display: flex; flex-wrap: wrap; gap: 6px 8px; margin-top: 8px; }
/* 動きを減らす：OS の設定でも、ゲームの設定でも。止めた後は中身をすぐ見せる（無限に続く動きは点滅にならないよう止める） */
body.rm *, body.rm *::before, body.rm *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
body.rm #wipe { display: none; }
body.rm .bk, body.rm .objnew, body.rm .toastbox, body.rm .evc, body.rm .ev-big, body.rm .ev-sum, body.rm .ev-actbar, body.rm .ev-more-wrap, body.rm .card, body.rm .pc-say, body.rm .st-tip, body.rm #intro .vs, body.rm #intro .sub, body.rm #intro .date { opacity: 1 !important; }
body.rm .credits { height: auto; overflow: visible; mask-image: none; -webkit-mask-image: none; }
body.rm .credits .roll { position: static; transform: none; }
body.rm #crosshair.gping::after { opacity: 0; }
/* 外れた印は動かさずに消す。付いたままのクラスでも字が残らない。 */
@keyframes stillMiss { 0%, 75% { opacity: 1; } 100% { opacity: 0; } }
body.rm #crosshair.gmiss::after { animation: stillMiss .7s linear forwards !important; }
html.touch body.rm #hud #tutorial.coach.hintc.in { animation: none !important; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
  #wipe { display: none; }
  .toast, #banner.show, .ln, .bk, .objnew, .toastbox, .story p, .evc, .ev-big, .ev-sum, .ev-actbar, .ev-more-wrap, .card, .pc-say, .promo, .st-tip, #intro .vs, #intro .sub, #intro .date { opacity: 1 !important; }
  .credits { height: auto; overflow: visible; mask-image: none; -webkit-mask-image: none; }
  .credits .roll { position: static; transform: none; }
  #crosshair.gping::after { opacity: 0; }
  #crosshair.gmiss::after { animation: stillMiss .7s linear forwards !important; }
  html.touch #hud #tutorial.coach.hintc.in { animation: none !important; }
}
/* 筒の準備と狙い定めは、色に加えて四角と印でも示す。 */
#crosshair.gun.gready i { border-radius: 0; }
#crosshair.gun.gready.gaim i { clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%); }
#target.locked span::before { content: '◎ '; }
#hud .bar.low i { background-image: repeating-linear-gradient(135deg, transparent 0 5px, rgba(0,0,0,.65) 5px 8px); }
/* 幅の狭い画面：上の兵力の帯を左右の札の間に収め、下の札は右へ寄せ、字幕と知らせは左の札を避けて置く */
@media (max-width: 1000px) {
  #armybar { width: calc(100vw - 460px); grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 6px; }
  #armybar .clock { min-width: 64px; padding: 3px 8px; font-size: max(12px, calc(19px * var(--text-scale, 1))); }
  #armybar .side .nm { font-size: max(12px, calc(14px * var(--text-scale, 1))); }
  #armybar .side canvas { display: none; }
  #compass { width: calc(100vw - 480px); }
  #dateline { white-space: normal; font-size: max(12px, calc(12px * var(--text-scale, 1))); }
  .jp-hint { display: none; }
  .bottom { left: auto; right: 16px; transform: none; }
  .slot { width: 50px; height: 50px; }
  .slot.cmd { width: 56px; }
  .slot svg { top: 6px; width: 22px; height: 22px; }
  #subtitle, #bark { left: calc(50vw + 140px); max-width: calc(100vw - 310px); }
  #subtitle { bottom: calc(86px + env(safe-area-inset-bottom, 0px)); }
}
/* 狭い画面（900×600 など） */
@media (max-height: 640px) {
  #boss { top: calc(96px + env(safe-area-inset-top, 0px)); }
  #hud:has(#boss:not([hidden])) #target { top: calc(140px + env(safe-area-inset-top, 0px)); }
  #bark { bottom: calc(204px + env(safe-area-inset-bottom, 0px)); }
  .wrap { padding-block: 28px; }
}

/* ================= 改善 501〜520（戦の中の表示と操作） ================= */
/* 501・502・503 任務札：字は左寄せ、済んだ任務は畳んで「済 n」、進み具合に細い帯 */
#objectives { text-align: left; }
#objectives h4 { text-align: right; }
#objectives li { line-height: 1.45; display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: 0; align-items: baseline; }
#objectives li .obj-text { min-width: 0; overflow-wrap: anywhere; }
#objectives li .tag { grid-row: 1 / span 3; align-self: start; margin-top: 1px; }
#objectives li small, #objectives li .opb { grid-column: 2; }
#objectives li .opb { display: block; height: 4px; margin: 3px 0 2px; background: rgba(0,0,0,.6); box-shadow: inset 0 0 0 1px rgba(236,228,210,.14); position: relative; }
#objectives li .opb b { position: absolute; inset: 0; right: auto; background: var(--kin); transition: width .4s; }
#objectives li.folded { display: block; margin-top: 6px; padding-top: 4px; border-top: 1px dashed rgba(194,162,90,.3); font-size: max(12px, calc(12px * var(--text-scale, 1))); color: var(--washi-dim); text-align: right; letter-spacing: .1em; }
/* 504・505 任務の印：名は墨の下地、距離は薄い字 */
.mk { display: grid; justify-items: center; gap: 1px; width: max-content; }   /* 画面の端で幅が縮んで字が縦に一文字ずつ並ばないように */
.mk b { font-weight: 500; font-size: max(12px, calc(13px * var(--text-scale, 1))); padding: 1px 7px; background: rgba(12,10,8,.72); box-shadow: inset 0 0 0 1px rgba(194,162,90,.35); line-height: 1.4; }
.mk.red b { box-shadow: inset 0 0 0 1px rgba(227,106,82,.45); }
.mk small { font-size: max(12px, calc(12px * var(--text-scale, 1))); color: #efe3c2; text-shadow: 0 1px 2px #000, 0 0 4px #000; font-variant-numeric: tabular-nums; }
/* 507 号令の輪：一つ 100×44、選んだ所は金の塗りと ▶、早打ちの鍵を添える */
#radial::before { left: -220px; top: -220px; width: 440px; height: 440px; background: radial-gradient(circle, rgba(12,10,8,.25) 26%, rgba(12,10,8,.74) 27%, rgba(12,10,8,.74) 70%, transparent 71%); }
#radial .rw { left: -60px; top: -22px; width: 120px; white-space: nowrap; height: 44px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; gap: 4px; font-size: max(12px, calc(16px * var(--text-scale, 1))); text-shadow: 0 1px 2px #000; border-radius: 2px; }
/* 号令の名が二行に折れて隣にかからないように（「ついて来い」など） */
#radial .rw, #radial .rw * { white-space: nowrap; }
#radial .rw { left: -66px; width: 132px; }
#radial .rw kbd { font-family: var(--ui); font-size: max(12px, calc(12px * var(--text-scale, 1))); color: var(--kin); border: 1px solid var(--gold-line); padding: 0 4px; line-height: 1.4; }
#radial .rw.on { background: rgba(194,162,90,.88); color: #1a140c; border-color: #f3e6c4; text-shadow: none; font-weight: 800; }
#radial .rw.on kbd { color: #1a140c; border-color: rgba(26,20,12,.5); }
#radial .rw .sel { font-size: max(12px, calc(12px * var(--text-scale, 1))); }
#radial .rw.locked { flex-direction: column; gap: 0; line-height: 1.2; }
#radial .rc { left: -70px; width: 140px; font-size: max(12px, calc(13px * var(--text-scale, 1))); color: #efe3c2; text-shadow: 0 1px 2px #000, 0 0 6px rgba(0,0,0,.85); }
/* 508 兵力の帯：減った分を白く残す */
#armybar .gauge s { position: absolute; top: 0; bottom: 0; background: rgba(243,230,196,.75); }
#armybar .a .gauge s { right: 0; }
#armybar .b .gauge s { left: 0; }
/* 510 深手：数字を朱の字で太く */
.bl .bar.hp.deep span, .bl .bar.hp.deep em { color: var(--shu-text, #e38a74); font-weight: 700; }
.bl .bar.hp.deep em { font-size: max(12px, calc(13px * var(--text-scale, 1))); }
/* 511 台詞をとばした時の添え書き */
#subtitle .more { display: block; margin-top: 2px; font-size: max(12px, calc(12px * var(--text-scale, 1))); color: var(--washi-dim); font-style: normal; }
/* 512 大見出しの間は知らせを控えめに */
#bark .bk { transition: opacity .3s; }
#hud:has(#banner.show) #bark { opacity: .55; }
#hud:has(#banner.show) #bark .bk { font-size: max(12px, calc(14px * var(--text-scale, 1))); }
/* 513 戦功の加算は左上の戦功の札のすぐ下。札の数字は一度だけ弾む */
.tl #toasts { position: static; right: auto; top: auto; justify-items: start; gap: 2px; }
.tl .toast { animation-name: toastL; }
@keyframes toastL { 0% { opacity: 0; transform: translateX(-10px); } 8% { opacity: 1; transform: none; } 80% { opacity: 1; } 100% { opacity: 0; } }
.tl .toast b { font-size: max(12px, calc(17px * var(--text-scale, 1))); }
.tl .toast.big { font-size: max(12px, calc(16px * var(--text-scale, 1))); color: #f3e6c4; }
.tl .toast.big b { font-size: max(12px, calc(24px * var(--text-scale, 1))); }
#h-merit { display: inline-block; }
#h-merit.bump { animation: mbump .45s ease-out; }
@keyframes mbump { 0% { transform: scale(1); } 30% { transform: scale(1.22); color: #fff3cf; } 100% { transform: scale(1); } }
body.rm #h-merit.bump { animation: none; }
body.rm .tl .toast { opacity: 1 !important; }
/* 515 狙いの札：種類と残り */
#target span { display: inline-flex; align-items: baseline; gap: 6px; font-size: max(12px, calc(13px * var(--text-scale, 1))); }
#target span .lk { font-style: normal; font-size: max(12px, calc(12px * var(--text-scale, 1))); color: #1a140c; background: #e36a52; padding: 0 5px; }
#target span .kd { font-size: max(12px, calc(12px * var(--text-scale, 1))); color: var(--washi-dim); border: 1px solid var(--line); padding: 0 4px; }
#target i.deep b { animation: lowpulse .5s ease-in-out infinite alternate; }
body.ca #target span .lk { background: #ff9a1a; }
#target.locked span { color: #f3e6c4; }
/* 517 戦術マップの凡例と操作（地図の下の札） */
#maphint { bottom: calc(10px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 4px; justify-items: center; padding: 6px 16px; background: rgba(12,10,8,.82); box-shadow: inset 0 0 0 1px var(--gold-line); font-size: max(12px, calc(13px * var(--text-scale, 1))); white-space: nowrap; }
#maphint .lg, #maphint .op { display: flex; gap: 16px; }
#maphint .op { color: var(--washi-dim); }
#maphint i { font-style: normal; margin-right: 4px; }
#maphint i.me, #maphint i.sq { color: #f1e9d6; }
#maphint i.al { color: #8fb0e0; }
#maphint i.en { color: #e36a52; }
#maphint i.ob { color: var(--kin); }
#maphint i.fl { color: #f1e9d6; }
body.ca #maphint i.en { color: #ff9a1a; }
#bigmap { width: min(80vh - 60px, 80vw); height: min(80vh - 60px, 80vw); top: 0; bottom: 60px; }
#maphint { z-index: 2; }
#hud:has(#bigmap:not([hidden])) .bottom, #hud:has(#bigmap:not([hidden])) #subtitle, #hud:has(#bigmap:not([hidden])) #bark, #hud:has(#bigmap:not([hidden])) #markers { visibility: hidden; }
/* 519 方角の帯：まとめた▲の数 */
#compass .c.foe.many span { margin-top: 8px; line-height: 1; }
/* 519 早見表・会話の記録：見出しに閉じる鍵 */
#cheat h5, #sublog h5 { margin: 0 0 6px; display: flex; justify-content: space-between; align-items: baseline; font-family: var(--display); font-size: max(12px, calc(14px * var(--text-scale, 1))); font-weight: 600; color: var(--kin); letter-spacing: .1em; }
#cheat h5 span, #sublog h5 span { font-family: var(--ui); font-size: max(12px, calc(12px * var(--text-scale, 1))); color: var(--washi-dim); letter-spacing: .02em; }
#cheat, #sublog { font-size: max(12px, calc(13px * var(--text-scale, 1))); }
/* 520 下の札：使えない理由を字で */
.slot .why { font-size: max(12px, calc(12px * var(--text-scale, 1))); color: #ffcf7a; white-space: nowrap; position: relative; z-index: 1; }
.slot.cmd.dim { opacity: .75; }
.slot.cmd.dim svg { opacity: .45; }
/* 軍勢の UI：部隊の帯（右下）。札を押すか Alt＋数字で号令先を選ぶ。字は 12px 以上、押せる所は 44px 以上 */
#h-units { position: absolute; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; flex-wrap: wrap-reverse; justify-content: flex-end; align-items: flex-end; gap: 8px; pointer-events: auto; }
#h-units .uc { position: relative; width: 72px; height: 104px; box-sizing: border-box; padding: 4px 0 0; display: grid; justify-items: center; align-content: start; gap: 2px; background: rgba(12,10,8,.8); border: 1px solid rgba(0,0,0,.9); box-shadow: inset 0 0 0 1px rgba(194,162,90,.28); color: var(--washi); font: inherit; font-size: max(12px, calc(12px * var(--text-scale, 1))); line-height: 1.3; cursor: default; }
#h-units button.uc { cursor: pointer; }
#h-units button.uc:hover { background: rgba(40,34,26,.86); }
#h-units button.uc:active { background: rgba(58,50,38,.9); }
#h-units .uc.on { box-shadow: inset 0 0 0 2px var(--kin), 0 0 0 1px #000; transform: translateY(-4px); }
#h-units .uc.on .nm::before { content: '●'; color: var(--kin); margin-right: 2px; font-size: max(12px, calc(12px * var(--text-scale, 1))); }
#h-units .uc.all { width: 52px; align-content: center; }
#h-units .uc.all b { font-family: var(--display); font-size: max(12px, calc(24px * var(--text-scale, 1))); color: var(--washi); line-height: 1.1; }
#h-units .face { width: 52px; height: 52px; margin-top: 4px; border-radius: 50%; background-size: cover; background-position: center; box-shadow: 0 0 0 1px #000; transition: transform .6s; }
#h-units .face.waver { transform: rotate(-9deg) translateY(2px); filter: saturate(.6) brightness(.85); }
#h-units .ring { position: absolute; left: 50%; top: 4px; width: 64px; height: 64px; margin-left: -32px; margin-top: -2px; pointer-events: none; }
#h-units .ring circle { fill: none; stroke-width: 4; }
#h-units .ring .bg { stroke: rgba(0,0,0,.75); stroke-width: 6; }
#h-units .ring .mo { stroke-linecap: butt; }
#h-units .ord { position: absolute; left: 3px; top: 3px; min-width: 20px; height: 20px; display: grid; place-items: center; font-style: normal; font-family: var(--display); font-size: max(12px, calc(13px * var(--text-scale, 1))); font-weight: 700; color: #1a140c; background: #ece4d2; box-shadow: 0 0 0 1px #000; }
#h-units .ord.pend { background: transparent; color: var(--washi); box-shadow: inset 0 0 0 1px var(--washi-dim), 0 0 0 1px #000; }
#h-units .cnt { position: absolute; right: 3px; top: 44px; min-width: 22px; padding: 0 3px; box-sizing: border-box; font-style: normal; font-size: max(12px, calc(12px * var(--text-scale, 1))); font-weight: 700; line-height: 18px; text-align: center; color: #1a140c; box-shadow: 0 0 0 1px #000; font-variant-numeric: tabular-nums; }
#h-units .cnt.ally { background: #8fb0e0; }
/* 数の札は白一色（士気の輪の色と意味を混ぜない）。減り具合は左の細い色の帯で */
#h-units .cnt:not(.ally) { background: #ece4d2; padding-left: 7px; }
#h-units .nm { margin-top: 10px; max-width: 70px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 1px 2px #000; }
#h-units .st { color: var(--washi-dim); font-size: max(12px, calc(12px * var(--text-scale, 1))); }
#h-units kbd { position: absolute; right: 3px; top: 3px; font-family: var(--ui); font-size: max(12px, calc(12px * var(--text-scale, 1))); line-height: 1.3; color: var(--kin); border: 1px solid var(--gold-line); padding: 0 4px; background: rgba(0,0,0,.5); }
#h-units .uc.all kbd { right: 50%; transform: translateX(50%); top: auto; bottom: 4px; }
#h-units .uc.ally { box-shadow: inset 0 0 0 1px rgba(143,176,224,.4); }
#h-units .uc.ally.fight .st { color: #f3d98a; }
#h-units .uc.ally.back .st { color: var(--shu-text, #e38a74); }
#hud:has(#h-units:not([hidden])) #skiphint { bottom: calc(136px + env(safe-area-inset-bottom, 0px)); }
#hud.calm #h-units { opacity: .45; transition: opacity .8s; }
@media (max-width: 1000px) { #h-units { bottom: calc(90px + env(safe-area-inset-bottom, 0px)); } #h-units .uc { width: 60px; } #h-units .nm { max-width: 58px; } }
body.rm #h-units .uc.on { transform: none; }
/* 鉄砲の組の札：込め終えて撃てる数 */
#h-units .ready { position: absolute; left: 50%; bottom: 2px; transform: translateX(-50%); font-style: normal; font-size: max(12px, calc(12px * var(--text-scale, 1))); line-height: 15px; padding: 0 4px; color: #f3e6c4; background: rgba(12,10,8,.85); font-variant-numeric: tabular-nums; }
/* 大きな組の帯（一人ずつの点の代わり） */
.topc .sqbar { position: relative; display: inline-block; width: 120px; height: 8px; background: rgba(0,0,0,.6); box-shadow: inset 0 0 0 1px rgba(236,228,210,.2); vertical-align: middle; }
.topc .sqbar i { position: absolute; inset: 0; right: auto; background: #8fb06a; }
.topc .sqbar em { position: absolute; left: 100%; top: -5px; margin-left: 6px; font-style: normal; font-size: max(12px, calc(12px * var(--text-scale, 1))); color: #e38a74; white-space: nowrap; }
/* 号令の輪：この身分で増えた号令の「新」 */
#radial .rw .newm { font-style: normal; font-size: max(12px, calc(12px * var(--text-scale, 1))); line-height: 1.3; padding: 0 3px; color: #1a140c; background: #e8c46a; }
/* 使番が走っている間：顔の札の左下に「使 n」（着くまでの秒） */
#h-units .runner { position: absolute; left: 3px; top: 26px; font-style: normal; font-size: max(12px, calc(12px * var(--text-scale, 1))); line-height: 16px; padding: 0 3px; color: #f3e6c4; background: rgba(12,10,8,.85); box-shadow: 0 0 0 1px rgba(194,162,90,.5); }
/* 五字の名（木下藤吉郎など）は字の間を詰めて札に収める */
#h-units .nm.long { letter-spacing: -.07em; max-width: 100%; }
/* 済んだ任務の印：主の金の字が金の地に消えないよう、跳ねる間は墨の字、済んだ後は薄い字と線で */
#objectives li.justdone .tag { color: var(--sumi); background: var(--kin); border-color: var(--kin); }
#objectives li.done:not(.justdone) .tag { color: var(--washi-dim); border-color: var(--line); background: transparent; }
body.rm #h-units .face { transition: none; }
/* 号令の輪：いまの号令「今」、使えない理由、号令先の隊の札 */
#radial .rw.locked::after { content: none; }
#radial .rw .why { font-size: max(12px, calc(12px * var(--text-scale, 1))); font-family: var(--ui); color: var(--washi-dim); }
#radial .rw.now { box-shadow: inset 0 0 0 1px rgba(236,228,210,.5); }
#radial .rw .nowm { font-style: normal; font-size: max(12px, calc(12px * var(--text-scale, 1))); font-family: var(--ui); color: #1a140c; background: #ece4d2; padding: 0 3px; line-height: 1.3; }
#radial .rw.on .nowm { background: #1a140c; color: #ece4d2; }
#radial .rc .rg { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; margin-top: 6px; }
#radial .rc .rg span { display: inline-flex; align-items: center; gap: 3px; padding: 1px 5px; font-size: max(12px, calc(12px * var(--text-scale, 1))); color: var(--washi); border: 1px solid var(--line); background: rgba(0,0,0,.4); }
#radial .rc .rg span.on { border-color: var(--kin); background: rgba(194,162,90,.88); color: #1a140c; font-weight: 700; }
#radial .rc .rg i { display: inline-block; width: 8px; height: 8px; box-shadow: 0 0 0 1px #000; }
#radial .rc .rg kbd { font-family: var(--ui); font-size: max(12px, calc(12px * var(--text-scale, 1))); color: var(--kin); }
#radial .rc .rg span.on kbd { color: #1a140c; }
#radial .rc .rgk { display: block; margin-top: 4px; font-size: max(12px, calc(12px * var(--text-scale, 1))); color: var(--washi-dim); }
/* 戦術マップの凡例：隊旗の形と札の色 */
#maphint { white-space: normal; max-width: min(760px, calc(100vw - 720px)); min-width: 420px; box-sizing: border-box; }
#maphint .lg, #maphint .op { flex-wrap: wrap; justify-content: center; gap: 2px 14px; }
