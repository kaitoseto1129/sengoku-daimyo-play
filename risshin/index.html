<style>
:root {
  color-scheme: dark;
  --sumi: #14120f;
  --sumi-2: #1f1c17;
  --sumi-3: #2c2821;
  --washi: #ece4d2;
  --washi-dim: #b9b09c;
  --washi-faint: #7d7566;
  --shu: #c0452e;
  --shu-deep: #8e2f1f;
  --kin: #c2a25a;
  --moegi: #6f8a4e;
  --ai: #5b7aa6;
  --line: rgba(236, 228, 210, 0.16);
  --display: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --ui: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; background: var(--sumi); color: var(--washi); font-family: var(--ui); overflow: hidden; }
canvas#view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
/* 画面の四隅をわずかに落とす（レンズの周辺減光。HUD には掛けない） */
#lens { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 48%, transparent 58%, rgba(8,6,4,.32) 100%); }
button { font-family: var(--ui); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--kin); outline-offset: 2px; }

/* ---------- HUD ---------- */
#hud { position: fixed; inset: 0; pointer-events: none; font-size: 13px; }
#hud[hidden] { display: none !important; }
.tl { position: absolute; left: 20px; top: calc(16px + env(safe-area-inset-top, 0px)); width: 240px; display: grid; gap: 6px; }
.who { font-family: var(--display); font-size: 17px; letter-spacing: .04em; text-shadow: 0 1px 3px #000; }
.who small { font-family: var(--ui); font-size: 12px; color: var(--washi-dim); margin-left: 6px; letter-spacing: .08em; }
.bar { display: grid; grid-template-columns: 34px 1fr; align-items: center; gap: 8px; font-size: 12px; color: var(--washi-dim); letter-spacing: .1em; }
.bar i { display: block; height: 7px; background: rgba(0,0,0,.55); border: 1px solid var(--line); position: relative; }
.bar i b { position: absolute; inset: 0; right: auto; width: 100%; background: var(--shu); transition: width .15s; }
.bar.sta i b { background: var(--washi-dim); }
.bar.mor i b { background: var(--moegi); }
.merit-now { margin-top: 4px; font-size: 12px; color: var(--washi-dim); letter-spacing: .08em; text-shadow: 0 1px 2px #000; }
.merit-now strong { font-family: var(--display); font-size: 22px; color: var(--kin); margin-left: 6px; font-variant-numeric: tabular-nums; }

.tr { position: absolute; right: 20px; top: calc(16px + env(safe-area-inset-top, 0px)); width: 250px; display: grid; gap: 10px; justify-items: end; }
#objectives { background: linear-gradient(90deg, transparent, rgba(10,9,7,.64) 18%); padding: 10px 12px 10px 28px; width: 100%; box-sizing: border-box; text-align: right; }
#objectives h4 { margin: 0 0 6px; font-family: var(--display); font-size: 14px; font-weight: 600; letter-spacing: .12em; color: var(--kin); }
#objectives li { list-style: none; margin: 3px 0; font-size: 12.5px; line-height: 1.45; color: var(--washi); }
#objectives ul { margin: 0; padding: 0; }
#objectives li.done { color: var(--washi-faint); text-decoration: line-through; }
#objectives li.fail { color: var(--shu); text-decoration: line-through; }
#objectives li .tag { font-size: 12px; letter-spacing: .1em; color: var(--washi-dim); border: 1px solid var(--line); padding: 0 4px; margin-right: 6px; }
#objectives li.order .tag { color: var(--shu); border-color: rgba(192,69,46,.5); }
#minimap { width: 170px; height: 170px; border: 1px solid var(--line); background: rgba(10,9,7,.6); border-radius: 50%; }
#bigmap { position: absolute; inset: 0; margin: auto; width: min(80vh, 80vw); height: min(80vh, 80vw); background: rgba(10,9,7,.85); border: 1px solid var(--line); }

.topc { position: absolute; left: 50%; top: calc(16px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); display: flex; gap: 18px; align-items: baseline; padding: 6px 18px; background: rgba(10,9,7,.66); border-top: 2px solid var(--shu); font-size: 12px; letter-spacing: .06em; white-space: nowrap; }
.topc b { font-family: var(--display); font-size: 16px; color: var(--washi); margin-left: 4px; font-variant-numeric: tabular-nums; }
.topc .ord { color: var(--kin); }

#crosshair { position: absolute; left: 50%; top: 50%; width: 4px; height: 4px; margin: -2px 0 0 -2px; background: var(--washi); border-radius: 50%; opacity: .7; box-shadow: 0 0 0 1px rgba(0,0,0,.6); }

.bottom { position: absolute; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); display: flex; gap: 6px; align-items: flex-end; }
.slot { width: 58px; height: 46px; border: 1px solid var(--line); background: rgba(10,9,7,.66); display: grid; place-items: center; font-size: 12px; position: relative; color: var(--washi-dim); }
.slot em { position: absolute; left: 4px; top: 2px; font-style: normal; font-size: 12px; color: var(--washi-faint); }
.slot.on { border-color: var(--kin); color: var(--washi); }
.slot.locked { opacity: .35; }
.slot.cmd { width: auto; padding: 0 12px; color: var(--washi); }
.slot.cmd.off { display: none; }

#cmdpanel { position: absolute; left: 50%; bottom: calc(80px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: rgba(10,9,7,.78); border: 1px solid var(--line); border-top: 2px solid var(--kin); padding: 12px 16px; min-width: 360px; }
#cmdpanel h5 { margin: 0 0 8px; font-family: var(--display); font-size: 14px; font-weight: 600; color: var(--kin); letter-spacing: .12em; display: flex; justify-content: space-between; }
#cmdpanel h5 span { font-family: var(--ui); font-size: 12px; color: var(--washi-dim); letter-spacing: .04em; }
#cmdpanel ol { margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
#cmdpanel li { list-style: none; border: 1px solid var(--line); padding: 6px 8px; font-size: 13px; }
#cmdpanel li kbd { font-family: var(--ui); color: var(--kin); margin-right: 6px; }
#cmdpanel li.cur { border-color: var(--kin); background: rgba(194,162,90,.12); }
#cmdpanel .grp { margin-top: 8px; font-size: 12px; color: var(--washi-dim); }
#cmdpanel .grp b { color: var(--washi); font-weight: 500; }

#subtitle { position: absolute; left: 50%; bottom: calc(92px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); max-width: min(680px, 90vw); text-align: center; font-size: 17px; line-height: 1.55; text-shadow: 0 1px 3px #000, 0 0 10px rgba(0,0,0,.8); }
#subtitle .sp { color: var(--kin); margin-right: .6em; font-size: 14px; letter-spacing: .06em; }
#prompt { position: absolute; left: 50%; top: 58%; transform: translateX(-50%); padding: 4px 12px; background: rgba(10,9,7,.75); border: 1px solid var(--line); font-size: 13px; }
#prompt kbd { color: var(--kin); font-family: var(--ui); margin-right: 6px; }

#toasts { position: absolute; right: 290px; top: 38%; display: grid; gap: 4px; justify-items: end; }
.toast { font-size: 14px; text-shadow: 0 1px 3px #000; animation: toast 2.6s ease-out forwards; white-space: nowrap; }
.toast b { font-family: var(--display); color: var(--kin); margin-right: 8px; font-size: 18px; }
.toast.neg b { color: var(--shu); }
@keyframes toast { 0% { opacity: 0; transform: translateX(12px); } 8% { opacity: 1; transform: none; } 80% { opacity: 1; } 100% { opacity: 0; } }

#banner { position: absolute; left: 0; right: 0; top: 30%; text-align: center; font-family: var(--display); font-weight: 800; font-size: clamp(34px, 6vw, 64px); letter-spacing: .2em; text-shadow: 0 2px 16px rgba(0,0,0,.9); opacity: 0; }
#banner small { display: block; font-family: var(--ui); font-weight: 500; font-size: 14px; letter-spacing: .3em; color: var(--washi-dim); margin-top: 6px; }
#banner.show { animation: banner 3.2s ease-out forwards; }
@keyframes banner { 0% { opacity: 0; letter-spacing: .5em; } 15% { opacity: 1; letter-spacing: .2em; } 75% { opacity: 1; } 100% { opacity: 0; } }

#markers { position: absolute; inset: 0; }
.mk { position: absolute; transform: translate(-50%, -100%); text-align: center; font-size: 12px; color: var(--kin); text-shadow: 0 1px 2px #000; white-space: nowrap; }
.mk::before { content: ""; display: block; width: 10px; height: 10px; margin: 0 auto 2px; border: 2px solid var(--kin); transform: rotate(45deg); }
.mk.red { color: #e36a52; }
.mk.red::before { border-color: #e36a52; }

#vignette { position: absolute; inset: 0; box-shadow: inset 0 0 160px rgba(120,10,0,.0); transition: box-shadow .3s; }
#vignette.hurt { box-shadow: inset 0 0 160px rgba(140,16,4,.55); }

#fps { position: absolute; left: 20px; bottom: 12px; font-size: 12px; color: var(--washi-faint); }

/* ---------- Screens ---------- */
#screen { position: fixed; inset: 0; overflow-y: auto; background: radial-gradient(ellipse at 30% 20%, #26211a 0%, var(--sumi) 60%); padding-inline: 16px; }
#screen[hidden] { display: none !important; }
#screen.clear { background: rgba(10,9,7,.78); backdrop-filter: blur(3px); }
.wrap { max-width: 880px; margin: 0 auto; padding-block: 48px; }
.eyebrow { font-size: 12px; letter-spacing: .3em; color: var(--washi-dim); }
h1.title { font-family: var(--display); font-weight: 800; font-size: clamp(52px, 10vw, 104px); letter-spacing: .12em; margin: 12px 0 4px; line-height: 1.05; text-wrap: balance; }
h1.title span { color: var(--shu); }
.lead { max-width: 34em; color: var(--washi-dim); line-height: 1.9; font-size: 15px; }
.btn { appearance: none; border: 1px solid var(--washi); background: transparent; color: var(--washi); padding: 12px 28px; font-size: 15px; letter-spacing: .14em; cursor: pointer; transition: background .15s, color .15s; }
.btn:hover { background: var(--washi); color: var(--sumi); }
.btn.primary { background: var(--shu); border-color: var(--shu); color: #fff5ea; }
.btn.primary:hover { background: #d5563d; color: #fff; }
.btn.small { padding: 7px 16px; font-size: 13px; letter-spacing: .08em; }
.btn:disabled { opacity: .35; cursor: not-allowed; }
.btn:disabled:hover { background: transparent; color: var(--washi); }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.field { display: grid; gap: 6px; max-width: 320px; }
.field label { font-size: 12px; letter-spacing: .14em; color: var(--washi-dim); }
.field input { background: transparent; border: 0; border-bottom: 1px solid var(--washi-dim); color: var(--washi); font-family: var(--display); font-size: 26px; padding: 4px 0; }
.keys { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 6px 20px; font-size: 13px; color: var(--washi-dim); max-width: 720px; }
.keys kbd { font-family: var(--ui); color: var(--washi); display: inline-block; min-width: 54px; }
.note { font-size: 12px; color: var(--washi-faint); line-height: 1.7; }

/* story card */
.story { min-height: 100%; display: grid; place-items: center; text-align: center; }
.story .year { font-size: 13px; letter-spacing: .4em; color: var(--washi-dim); }
.story h2 { font-family: var(--display); font-weight: 800; font-size: clamp(36px, 7vw, 72px); letter-spacing: .18em; margin: 14px 0 22px; }
.story p { max-width: 30em; margin: 0 auto 28px; line-height: 2.1; color: var(--washi-dim); font-size: 15px; }

/* evaluation */
.eval { max-width: 640px; margin: 0 auto; padding-block: 44px; }
.eval .head { border-bottom: 1px solid var(--line); padding-bottom: 14px; margin-bottom: 14px; }
.eval h2 { font-family: var(--display); font-size: 34px; letter-spacing: .14em; margin: 6px 0 0; font-weight: 800; }
.ledger { display: grid; gap: 0; }
.ledger .ln { display: grid; grid-template-columns: 1fr auto 70px; gap: 12px; padding: 8px 0; border-bottom: 1px dashed var(--line); font-size: 15px; opacity: 0; animation: ln .35s ease-out forwards; }
.ledger .ln .d { color: var(--washi-faint); font-size: 12.5px; align-self: center; }
.ledger .ln .p { text-align: right; font-family: var(--display); font-size: 18px; font-variant-numeric: tabular-nums; }
.ledger .ln.neg .p { color: var(--shu); }
.ledger .ln.sp { color: var(--kin); }
@keyframes ln { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
.total { display: flex; justify-content: space-between; align-items: baseline; padding: 16px 0 6px; }
.total span { letter-spacing: .2em; color: var(--washi-dim); }
.total strong { font-family: var(--display); font-size: 52px; color: var(--kin); font-variant-numeric: tabular-nums; }
.total em { font-style: normal; font-size: 12px; color: var(--washi-faint); margin-left: 8px; }
.verdict { font-family: var(--display); font-size: 24px; margin: 14px 0; letter-spacing: .08em; }
.facts { display: grid; grid-template-columns: max-content 1fr; gap: 6px 22px; font-size: 14px; margin: 10px 0 20px; }
.facts dt { color: var(--washi-dim); letter-spacing: .12em; font-size: 12.5px; }
.facts dd { margin: 0; }
.promo { border: 1px solid var(--kin); padding: 20px 22px; margin: 18px 0 24px; background: linear-gradient(120deg, rgba(194,162,90,.12), transparent 70%); opacity: 0; animation: ln .6s ease-out forwards; }
.promo .lbl { font-size: 12px; letter-spacing: .3em; color: var(--kin); }
.promo .rk { font-family: var(--display); font-weight: 800; font-size: clamp(26px, 5vw, 38px); margin: 8px 0; letter-spacing: .08em; }
.promo .rk .arrow { color: var(--washi-faint); margin: 0 .4em; font-weight: 600; }
.promo .unl { font-size: 14px; color: var(--washi); }
.promo .unl b { color: var(--kin); font-weight: 500; }
.promo.no { border-color: var(--line); background: none; }
.promo.no .lbl { color: var(--washi-dim); }

/* base */
.base { max-width: 980px; margin: 0 auto; padding-block: 36px; display: grid; grid-template-columns: 260px 1fr; gap: 36px; }
@media (max-width: 760px) { .base { grid-template-columns: 1fr; } }
.base aside h2 { font-family: var(--display); font-size: 30px; margin: 6px 0 2px; letter-spacing: .1em; }
.base aside .rank { color: var(--kin); letter-spacing: .1em; }
.stat { display: grid; grid-template-columns: 1fr auto; font-size: 13.5px; padding: 6px 0; border-bottom: 1px solid var(--line); }
.stat span { color: var(--washi-dim); }
.stat b { font-weight: 500; font-variant-numeric: tabular-nums; }
.tabs { display: flex; gap: 4px 0; border-bottom: 1px solid var(--line); margin-bottom: 18px; flex-wrap: wrap; }
.tabs button { background: none; border: 0; color: var(--washi-dim); padding: 10px 16px; font-size: 14px; letter-spacing: .12em; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs button.on { color: var(--washi); border-bottom-color: var(--shu); }
.items { display: grid; gap: 8px; }
.item { display: grid; grid-template-columns: 1fr auto; gap: 4px 16px; align-items: center; padding: 12px 14px; border: 1px solid var(--line); }
.item .n { font-size: 15px; }
.item .n small { color: var(--washi-faint); margin-left: 8px; font-size: 12px; }
.item .x { grid-column: 1; font-size: 12.5px; color: var(--washi-dim); }
.item .a { grid-row: 1 / span 2; grid-column: 2; }
.item.eq { border-color: var(--kin); }
.rel { display: grid; grid-template-columns: 70px 1fr 40px; gap: 8px; align-items: center; font-size: 12px; color: var(--washi-dim); margin: 3px 0; }
.rel i { height: 5px; background: var(--sumi-3); position: relative; display: block; }
.rel i b { position: absolute; inset: 0; right: auto; background: var(--kin); }
.talk { border-left: 2px solid var(--kin); padding: 4px 0 4px 16px; margin: 12px 0; line-height: 1.9; }
.talk .sp { color: var(--kin); font-size: 13px; letter-spacing: .08em; }
.choices { display: grid; gap: 6px; margin-top: 10px; }
.choices button { text-align: left; background: none; border: 1px solid var(--line); color: var(--washi); padding: 10px 14px; cursor: pointer; font-size: 14px; }
.choices button:hover { border-color: var(--washi-dim); background: rgba(236,228,210,.04); }
.aiji { display: grid; grid-template-columns: repeat(3, minmax(0,140px)); gap: 12px; margin: 18px 0; }
.aiji button { background: var(--sumi-2); border: 1px solid var(--line); padding: 12px; cursor: pointer; color: var(--washi); display: grid; gap: 8px; justify-items: center; font-size: 14px; }
.aiji button:hover { border-color: var(--kin); }
.aiji canvas { width: 60px; height: 120px; }

.timeline { display: grid; gap: 0; margin: 20px 0; }
.timeline .tl-row { display: grid; grid-template-columns: 160px 1fr 80px; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); align-items: baseline; }
.timeline .tl-row .b { font-family: var(--display); font-size: 18px; }
.timeline .tl-row .r { color: var(--washi-dim); font-size: 13.5px; }
.timeline .tl-row .m { text-align: right; font-family: var(--display); color: var(--kin); font-size: 20px; font-variant-numeric: tabular-nums; }
.q { margin: 16px 0; }
.q p { margin: 0 0 8px; font-size: 14.5px; }
.q .scale { display: flex; gap: 6px; flex-wrap: wrap; }
.q .scale label { border: 1px solid var(--line); padding: 6px 12px; cursor: pointer; font-size: 13px; }
.q .scale input { accent-color: var(--shu); margin-right: 6px; }
textarea { width: 100%; box-sizing: border-box; min-height: 90px; background: var(--sumi-2); color: var(--washi); border: 1px solid var(--line); padding: 10px; font-family: var(--ui); font-size: 14px; }
pre.copy { white-space: pre-wrap; background: var(--sumi-2); border: 1px solid var(--line); padding: 12px; font-size: 12px; color: var(--washi-dim); max-height: 200px; overflow: auto; }

#pause { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(10,9,7,.72); overflow-y: auto; }
#pause[hidden] { display: none !important; }
#pause div { text-align: center; }
#pause h3 { font-family: var(--display); font-size: 32px; letter-spacing: .3em; margin: 0 0 10px; }
#pause p { color: var(--washi-dim); font-size: 13px; }
#loading { position: fixed; inset: 0; display: grid; place-items: center; background: var(--sumi); }
#loading[hidden] { display: none !important; }

/* ---------- 改善で加えた表示 ---------- */
.bar { grid-template-columns: 34px 1fr 64px; }
.bar em { font-style: normal; font-size: 12px; color: var(--washi-dim); text-align: right; font-variant-numeric: tabular-nums; letter-spacing: .02em; }
.bar.low i { animation: lowpulse .6s ease-in-out infinite alternate; }
.bar.low em { color: var(--shu); }
@keyframes lowpulse { from { box-shadow: 0 0 0 0 rgba(192,69,46,0); } to { box-shadow: 0 0 0 2px rgba(192,69,46,.55); } }
.merit-now small { margin-left: 8px; font-size: 12px; color: var(--washi-faint); }
.next { display: grid; gap: 3px; font-size: 12px; color: var(--washi-dim); text-shadow: 0 1px 2px #000; }
.next i { display: block; height: 3px; background: rgba(0,0,0,.5); position: relative; }
.next i b { position: absolute; inset: 0; right: auto; background: var(--kin); transition: width .4s; }
#hint { margin-top: 10px; background: rgba(10,9,7,.7); border-left: 2px solid var(--kin); padding: 8px 10px; font-size: 12.5px; line-height: 1.6; pointer-events: none; }
#hint .lbl { display: block; font-size: 12px; letter-spacing: .25em; color: var(--kin); margin-bottom: 2px; }
#hint .k { margin-top: 4px; color: var(--washi-dim); font-size: 12px; }
#hud[data-sub="s"] #subtitle { font-size: 14px; }
#hud[data-sub="l"] #subtitle { font-size: 21px; }
#subtitle .sys { color: var(--washi-dim); font-style: italic; }
#crosshair { width: 26px; height: 26px; margin: -13px 0 0 -13px; background: none; box-shadow: none; opacity: 1; }
#crosshair i { position: absolute; left: 50%; top: 50%; width: 4px; height: 4px; margin: -2px 0 0 -2px; border-radius: 50%; background: var(--washi); box-shadow: 0 0 0 1px rgba(0,0,0,.6); opacity: .75; transition: background .1s, transform .1s; }
#crosshair::before, #crosshair::after { content: ""; position: absolute; inset: 3px; border: 1.5px solid transparent; border-radius: 50%; transition: border-color .12s, inset .12s; }
#crosshair.inrange i { background: var(--shu); transform: scale(1.4); }
#crosshair.inrange::before { border-color: rgba(192,69,46,.7); }
#crosshair.guard::after { inset: -2px; border-color: rgba(236,228,210,.45); border-radius: 4px; }
#crosshair.counter::before { border-color: var(--kin); inset: -4px; }
#crosshair.hit i { animation: hitm .18s ease-out; }
@keyframes hitm { 0% { transform: scale(3); background: #fff; } 100% { transform: scale(1.4); } }
#dmgdir { position: absolute; left: 50%; top: 50%; width: 260px; height: 260px; border-radius: 50%; border-top: 6px solid rgba(200,30,10,.85); opacity: 0; pointer-events: none; }
#dmgdir.show { animation: dmg .9s ease-out; }
@keyframes dmg { 0% { opacity: 1; } 100% { opacity: 0; } }

#sublog { position: absolute; left: 20px; bottom: 90px; width: min(420px, 60vw); max-height: 40vh; overflow: hidden; background: rgba(10,9,7,.85); border: 1px solid var(--line); padding: 10px 12px; font-size: 12.5px; line-height: 1.6; }

.mk.near { opacity: .35; }

.topc .pips { display: inline-flex; gap: 2px; flex-wrap: wrap; max-width: 150px; align-self: center; }

.slot.cmd.ready { border-color: rgba(194,162,90,.6); }

#toasts { right: 290px; top: 34%; }

.pmenu { display: grid; grid-template-columns: minmax(0, 260px) minmax(0, 380px); gap: 40px; align-items: start; max-width: 720px; padding: 16px; }

#loading .ld { font-family: var(--display); font-size: 20px; letter-spacing: .3em; color: var(--washi-dim); text-align: center; }
#loading p { max-width: 30em; margin: 18px auto 0; font-family: var(--ui); font-size: 13px; letter-spacing: .04em; color: var(--washi-faint); line-height: 1.8; text-align: center; padding: 0 16px; }
#glfail { position: fixed; inset: 0; background: var(--sumi); display: grid; place-items: center; padding-inline: 16px; }
.settings { display: grid; gap: 14px; max-width: 560px; }

.skiphint { font-size: 12px; color: var(--washi-faint); margin-top: 10px; }
.toastbox { position: fixed; right: 20px; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--sumi-2); border: 1px solid var(--line); padding: 8px 14px; font-size: 13px; animation: toast 2.4s ease-out forwards; z-index: 10; }
.confirm-row { border: 1px solid var(--shu); padding: 12px 14px; margin-top: 12px; display: grid; gap: 10px; font-size: 14px; }
.item .cmp { font-size: 12px; color: var(--moegi); margin-left: 8px; }

/* ---------- 改善（第2弾） ---------- */
#boss { position: absolute; left: 50%; bottom: calc(196px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); display: grid; gap: 4px; justify-items: center; font-family: var(--display); font-size: 16px; letter-spacing: .12em; text-shadow: 0 1px 3px #000; }
#boss i { display: block; width: min(420px, 60vw); height: 6px; background: rgba(0,0,0,.6); border: 1px solid rgba(236,228,210,.3); position: relative; }
#boss i b { position: absolute; inset: 0; right: auto; background: linear-gradient(90deg, #8e2f1f, #c0452e); }
#crosshair.charge::before { border-color: rgba(236,228,210,.6); inset: -1px; }
#crosshair.charged::before { border-color: var(--kin); inset: -6px; border-width: 2px; }
.toast.title b { color: var(--kin); font-size: 14px; }
.topc .pips i.vet { outline: 1px solid var(--kin); outline-offset: 0; }
body.ca .mk.red, body.ca .threat { color: #ff9a1a; }
body.ca .mk.red::before { border-color: #ff9a1a; border-style: dashed; }
body.ca #target i b, body.ca #boss i b { background: #ff9a1a; }
body.rm *, body.rm *::before, body.rm *::after { animation-duration: .01ms !important; transition: none !important; }
body.rm .toast, body.rm #banner.show, body.rm .ln, body.rm .promo, body.rm .story p { opacity: 1 !important; }
.keybind { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 6px 18px; }
.keybind button { background: var(--sumi-2); border: 1px solid var(--line); color: var(--washi); padding: 6px 10px; text-align: left; cursor: pointer; font-size: 13px; display: flex; justify-content: space-between; gap: 10px; }
.keybind button b { color: var(--kin); font-weight: 500; }
.keybind button.wait b { color: var(--shu); }
.roster { display: grid; gap: 0; }
.roster .rr { display: grid; grid-template-columns: 1fr 70px 70px 90px; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; align-items: baseline; }
.roster .rr span { color: var(--washi-dim); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.roster .rr.head span { color: var(--washi-faint); font-size: 12px; letter-spacing: .1em; }
.roster .rr .vet { color: var(--kin); }
.people { display: grid; gap: 14px; }
.people .p { border-left: 2px solid var(--line); padding: 2px 0 2px 14px; }
.people .p b { font-family: var(--display); font-size: 17px; }
.people .p small { color: var(--washi-faint); margin-left: 8px; }
.people .p p { margin: 4px 0 0; font-size: 13.5px; color: var(--washi-dim); line-height: 1.8; }
.gloss { display: grid; grid-template-columns: max-content 1fr; gap: 6px 18px; font-size: 13.5px; line-height: 1.7; }
.gloss dt { font-family: var(--display); color: var(--kin); }
.gloss dd { margin: 0; color: var(--washi-dim); }
.diffs { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.diffs label { border: 1px solid var(--line); padding: 8px 12px; cursor: pointer; font-size: 13px; display: grid; gap: 2px; max-width: 220px; }
.diffs label small { color: var(--washi-faint); font-size: 12px; }
.diffs.scn label { max-width: 440px; }
.diffs input { accent-color: var(--shu); }
.titles { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; margin: 12px 0; }
.titles div { border: 1px solid var(--line); padding: 8px 10px; font-size: 13px; }
.titles div.got { border-color: var(--kin); }
.titles div b { display: block; font-family: var(--display); font-size: 15px; }
.titles div:not(.got) { opacity: .45; }
.titles small { color: var(--washi-dim); }
.ev-cat { font-size: 12px; letter-spacing: .2em; color: var(--washi-faint); padding-top: 12px; }
.histnote { border-left: 2px solid var(--kin); padding: 4px 0 4px 14px; margin: 18px 0; font-size: 13.5px; color: var(--washi-dim); line-height: 1.9; }
.preview3d { width: 220px; height: 260px; display: block; margin: 0 auto 10px; background: radial-gradient(ellipse at 50% 70%, #2c2821, transparent 70%); }
#titlebg { position: fixed; inset: 0; width: 100%; height: 100%; z-index: -1; opacity: .55; }
#screen.withbg { background: linear-gradient(90deg, rgba(20,18,15,.95) 0%, rgba(20,18,15,.78) 55%, rgba(20,18,15,.35) 100%); }

/* ================= 第3弾：ゲームらしい見た目の HUD ================= */
:root { --lacquer: rgba(14,11,8,.68); --gold-line: rgba(194,162,90,.45); --ai-deep: #2e4f86; --ai-bright: #5e8fd6; }
#overlay { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
/* 画面の四隅をわずかに落として映画らしく */
#vignette { box-shadow: inset 0 0 180px rgba(0,0,0,.45); }
#vignette.hurt { box-shadow: inset 0 0 200px rgba(140,16,4,.6); }
/* 開戦の帯（上下の黒帯） */
#cine i { position: absolute; left: 0; right: 0; height: 0; background: #000; transition: height .6s ease; }
#cine i:first-child { top: 0; }
#cine i:last-child { bottom: 0; }
#cine.on i { height: 9vh; }
/* 左上：戦功の札 */
.tl { width: 230px; gap: 8px; }
.plaque { display: inline-flex; align-items: baseline; gap: 8px; padding: 6px 14px 6px 12px; background: var(--lacquer); box-shadow: inset 0 0 0 1px var(--gold-line); border-left: 3px solid var(--kin); width: max-content; }
.plaque .pl-lbl { font-family: var(--display); font-size: 13px; letter-spacing: .3em; color: var(--kin); }
.plaque strong { font-family: var(--display); font-size: 26px; color: #f3e6c4; font-variant-numeric: tabular-nums; text-shadow: 0 0 10px rgba(194,162,90,.35); }
.plaque small { font-size: 12px; color: var(--washi-faint); }
.next { width: 210px; }
/* 左下：名と体力・気力・士気（太めのゲージ） */
.bl { position: absolute; left: 20px; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); width: 300px; display: grid; gap: 5px; padding: 10px 14px 12px; background: linear-gradient(90deg, var(--lacquer), rgba(14,11,8,.35)); box-shadow: inset 0 0 0 1px rgba(194,162,90,.22); }
.bl .who { font-size: 18px; margin-bottom: 2px; }
.bl .bar { grid-template-columns: 34px 1fr 60px; }
.bl .bar i { height: 10px; border: 1px solid rgba(0,0,0,.8); box-shadow: inset 0 0 0 1px rgba(236,228,210,.12); background: rgba(0,0,0,.55); }
.bl .bar.hp i b { background: linear-gradient(180deg, #e0553a, #9a2716); }
.bl .bar.horse i b { background: linear-gradient(180deg, #b0875a, #6e4a2a); }
.bl .bar.breath i b { background: linear-gradient(180deg, #d9d2c0, #8f8878); }
.bl .bar.horse span, .bl .bar.breath span { white-space: nowrap; }
.bl .bar.sta i b { background: linear-gradient(180deg, #6f9ee6, #2e5aa0); }
.bl .bar.mor i { height: 6px; }
.bl .bar.mor i b { background: linear-gradient(180deg, #8fb06a, #4f6a34); }
/* 上：両軍の兵力と陣太鼓時計 */
#armybar { position: absolute; left: 50%; top: calc(12px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); display: grid; grid-template-columns: minmax(0, 290px) auto minmax(0, 290px); align-items: center; gap: 10px; width: min(760px, 94vw); }
#armybar .side { display: grid; gap: 4px; }
#armybar .side .nm { display: flex; align-items: center; gap: 8px; font-family: var(--display); font-size: 16px; letter-spacing: .08em; text-shadow: 0 1px 3px #000, 0 0 6px #000; }
#armybar .side.b .nm { justify-content: flex-end; }
#armybar .side canvas { width: 22px; height: 22px; border-radius: 50%; box-shadow: 0 0 0 1px rgba(0,0,0,.8), 0 0 0 2px var(--gold-line); }
#armybar .side .nm small { font-family: var(--ui); font-size: 12px; color: var(--washi-dim); font-variant-numeric: tabular-nums; }
#armybar .gauge { height: 9px; background: rgba(0,0,0,.65); box-shadow: inset 0 0 0 1px rgba(236,228,210,.15), 0 0 0 1px rgba(0,0,0,.8); position: relative; overflow: hidden; }
#armybar .gauge b { position: absolute; top: 0; bottom: 0; transition: width .4s; }
#armybar .a .gauge b { right: 0; background: linear-gradient(180deg, var(--ai-bright), var(--ai-deep)); }
#armybar .b .gauge b { left: 0; background: linear-gradient(180deg, #e0553a, #8e2f1f); }
#armybar .clock { min-width: 86px; text-align: center; padding: 4px 12px; background: #0c0a08; box-shadow: inset 0 0 0 1px var(--gold-line), 0 0 0 1px #000; font-family: var(--display); font-size: 22px; font-weight: 800; letter-spacing: .06em; color: #f3e6c4; font-variant-numeric: tabular-nums; }
#armybar .clock small { display: block; font-family: var(--ui); font-weight: 500; font-size: 12px; letter-spacing: .2em; color: var(--washi-faint); margin-top: -2px; }
/* 右上：年月日・季節・天気・刻 */
#dateline { white-space: nowrap; font-family: var(--display); font-size: 12.5px; letter-spacing: .08em; color: #efe3c2; text-shadow: 0 1px 3px #000; text-align: right; }
#objectives { background: var(--lacquer); box-shadow: inset 0 0 0 1px rgba(194,162,90,.28); padding: 10px 14px 10px 16px; }
#objectives h4 { border-bottom: 1px solid var(--gold-line); padding-bottom: 5px; }
#minimap { border: 2px solid rgba(194,162,90,.55); box-shadow: 0 0 0 1px #000, 0 0 0 5px rgba(14,11,8,.7), 0 0 0 6px rgba(194,162,90,.3); }
/* 組の札は左下の体力の上へ */
.topc { left: 20px; top: auto; bottom: calc(150px + env(safe-area-inset-bottom, 0px)); transform: none; flex-wrap: wrap; max-width: 300px; white-space: normal; gap: 6px 14px; padding: 8px 14px; border-top: 0; border-left: 3px solid var(--shu); background: var(--lacquer); box-shadow: inset 0 0 0 1px rgba(194,162,90,.2); }
.topc .pips { max-width: 100%; order: 10; flex-basis: 100%; }
/* 下：武器・号令の札（四角い枠と小さな絵） */
.bottom { gap: 5px; }
.slot { width: 56px; height: 56px; background: rgba(12,10,8,.78); border: 1px solid rgba(0,0,0,.9); box-shadow: inset 0 0 0 1px rgba(194,162,90,.28); color: var(--washi); font-size: 12px; align-content: end; padding-bottom: 4px; }
.slot svg { position: absolute; left: 50%; top: 8px; transform: translateX(-50%); width: 26px; height: 26px; stroke: #e9dcb8; fill: none; stroke-width: 1.6; }
.slot.on { box-shadow: inset 0 0 0 2px var(--kin), 0 0 12px rgba(194,162,90,.35); }
.slot.cmd { width: 64px; padding: 0 0 4px; }
.slot.cmd.ready { box-shadow: inset 0 0 0 1px rgba(194,162,90,.6); }
.slot.cmd em, .slot em { position: absolute; left: 4px; top: 2px; font-size: 12px; color: var(--washi-faint); margin: 0; }
.slot .cd { position: absolute; inset: auto 0 0 0; background: rgba(0,0,0,.6); }
/* 見出し：筆で掃いた朱の帯に白抜きの字 */
#banner { top: 26%; }
#banner .brush { display: inline-block; padding: 14px 70px 18px; background-size: 100% 100%; background-repeat: no-repeat; color: #fff; -webkit-text-stroke: 1.5px rgba(40,8,4,.9); paint-order: stroke fill; text-shadow: 0 3px 10px rgba(0,0,0,.6); }
#banner small { color: #f0e2c0; text-shadow: 0 1px 3px #000; }
/* 開戦の大見出し（藍の濃淡に白の縁取り） */
#intro { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; pointer-events: none; }
#intro .vs { font-family: var(--display); font-weight: 800; font-size: clamp(40px, 7vw, 88px); letter-spacing: .08em; line-height: 1.1; background: linear-gradient(180deg, #ffffff 0%, #bcd4f5 40%, #2e5aa0 100%); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-stroke: 2px #fff; filter: drop-shadow(0 4px 10px rgba(0,0,0,.7)); animation: introIn 3.4s ease-out forwards; }
#intro .vs em { font-style: normal; font-size: .6em; margin: 0 .4em; -webkit-text-stroke: 1.5px #fff; }
#intro .sub { font-family: var(--display); font-size: clamp(18px, 2.4vw, 28px); color: #f3e6c4; letter-spacing: .3em; margin-top: 10px; text-shadow: 0 2px 6px #000; animation: introIn 3.4s ease-out forwards; }
#intro .date { font-size: 13px; color: var(--washi-dim); letter-spacing: .3em; margin-top: 8px; animation: introIn 3.4s ease-out forwards; text-shadow: 0 1px 3px #000; }
@keyframes introIn { 0% { opacity: 0; transform: scale(1.12); } 12% { opacity: 1; transform: scale(1); } 78% { opacity: 1; } 100% { opacity: 0; } }
/* 戦況の知らせ（中央下の白抜き文字） */
#bark { bottom: calc(190px + env(safe-area-inset-bottom, 0px)); }
/* 狭い画面では字幕が二、三行になるので、知らせをその上へ逃がす（重ならないように） */
@media (max-width: 1000px) { #bark { bottom: calc(246px + env(safe-area-inset-bottom, 0px)); } }
@media (max-width: 1000px) and (max-height: 620px) { #bark { bottom: calc(226px + env(safe-area-inset-bottom, 0px)); } }
#bark .bk { font-family: var(--display); font-size: 16px; color: #fff; -webkit-text-stroke: .6px rgba(0,0,0,.8); paint-order: stroke fill; text-shadow: 0 1px 4px #000, 0 0 10px rgba(0,0,0,.7); letter-spacing: .04em; }
#bark .bk.warn { color: #ffcf7a; }
#subtitle { bottom: calc(100px + env(safe-area-inset-bottom, 0px)); }
#subtitle .sp { font-family: var(--display); }
.toast b { text-shadow: 0 0 8px rgba(194,162,90,.4); }
#target { top: calc(64px + env(safe-area-inset-top, 0px)); }
#h-squad[hidden] + #target { top: calc(64px + env(safe-area-inset-top, 0px)); }
@media (max-width: 900px) { #armybar { grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); } .bl { width: 240px; } .topc { max-width: 240px; } }
@media (max-height: 620px) { .bl { padding: 6px 10px; } .topc { bottom: 120px; } }

/* ================= 第4弾 ================= */
.bl .bar.hp i s { position: absolute; inset: 0; right: auto; background: rgba(255,240,220,.7); transition: none; }
.bl .bar.hp i b { z-index: 1; }
#compass { position: absolute; left: 50%; top: calc(66px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); width: min(520px, 70vw); height: 26px; overflow: hidden; background: linear-gradient(90deg, transparent, rgba(12,10,8,.55) 15%, rgba(12,10,8,.55) 85%, transparent); border-bottom: 1px solid rgba(194,162,90,.35); }
#compass::after { content: ""; position: absolute; left: 50%; bottom: 0; width: 0; height: 0; border: 5px solid transparent; border-bottom-color: var(--kin); transform: translateX(-50%); }

#compass .c small { display: block; font-size: 12px; color: var(--washi-dim); }

#compass .c.mine span { color: #f1e9d6; font-size: 12px; display: block; margin-top: 12px; }
body.ca #compass .c.foe span { color: #ff9a1a; }
#situation { position: absolute; left: 50%; top: calc(96px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); font-family: var(--display); font-size: 13px; letter-spacing: .3em; color: #f3e6c4; text-shadow: 0 1px 3px #000; }
#situation.good { color: #9fc4ff; }
#situation.bad { color: #ff9a86; }
#target { top: calc(120px + env(safe-area-inset-top, 0px)); }
#floats .floatm { position: absolute; transform: translate(-50%, -50%); font-family: var(--display); font-size: 15px; color: #f3d98a; -webkit-text-stroke: .5px rgba(0,0,0,.8); paint-order: stroke fill; text-shadow: 0 1px 3px #000; pointer-events: none; white-space: nowrap; }
#floats .floatm.neg { color: #ff8a70; }
#radial { position: absolute; left: 50%; top: 50%; width: 0; height: 0; }
#radial::before { content: ""; position: absolute; left: -160px; top: -160px; width: 320px; height: 320px; border-radius: 50%; background: radial-gradient(circle, rgba(12,10,8,.2) 30%, rgba(12,10,8,.72) 31%, rgba(12,10,8,.72) 70%, transparent 71%); box-shadow: inset 0 0 0 1px rgba(194,162,90,.3); }
#radial .rw { position: absolute; left: -44px; top: -16px; width: 88px; height: 32px; display: grid; place-items: center; font-family: var(--display); font-size: 15px; color: var(--washi); border: 1px solid transparent; }
#radial .rw.on { color: #fff; border-color: var(--kin); background: rgba(194,162,90,.25); }
#radial .rw.locked { color: var(--washi-faint); }
#radial .rc { position: absolute; left: -60px; top: -20px; width: 120px; text-align: center; font-size: 12px; color: var(--washi-dim); line-height: 1.4; }
#combo { position: absolute; left: calc(50% + 40px); top: calc(50% + 18px); font-family: var(--display); font-size: 18px; color: #f3e6c4; text-shadow: 0 1px 3px #000; }

@keyframes pop { 0% { transform: scale(1.6); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
#killmark { position: absolute; left: 50%; top: 50%; margin: -20px 0 0 -14px; font-family: var(--display); font-weight: 800; font-size: 28px; color: #e2472c; -webkit-text-stroke: 1px rgba(0,0,0,.8); paint-order: stroke fill; text-shadow: 0 1px 4px rgba(0,0,0,.8); }
#staring { position: absolute; left: calc(50% - 44px); top: calc(50% - 10px); width: 20px; height: 20px; border-radius: 50%; background: conic-gradient(#8fb4ec calc(var(--p) * 1%), rgba(0,0,0,.4) 0); -webkit-mask: radial-gradient(circle, transparent 5px, #000 6px); mask: radial-gradient(circle, transparent 5px, #000 6px); opacity: .85; }
#staring.low { background: conic-gradient(#e2472c calc(var(--p) * 1%), rgba(0,0,0,.4) 0); }
#skiphint { position: absolute; right: 20px; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); padding: 6px 12px; background: var(--lacquer); box-shadow: inset 0 0 0 1px var(--gold-line); font-size: 12.5px; }

#maphint { position: absolute; left: 50%; bottom: calc(40px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); font-size: 13px; color: #f3e6c4; text-shadow: 0 1px 3px #000; }
#bigmap { pointer-events: auto; cursor: crosshair; }
#cheat { position: absolute; right: 20px; bottom: calc(80px + env(safe-area-inset-bottom, 0px)); width: 300px; padding: 12px 14px; background: rgba(12,10,8,.82); box-shadow: inset 0 0 0 1px var(--gold-line); font-size: 12px; line-height: 1.8; }

.threat.edge { font-size: 26px; color: #ff7a5a; }
.threat.edge::after { content: "後"; font-size: 12px; display: block; text-align: center; margin-top: -4px; }
.mk.weak { color: #ffb04a; animation: lowpulse .6s ease-in-out infinite alternate; }
.mk.fresh::before { animation: fresh .5s ease-in-out 4 alternate; }
@keyframes fresh { from { transform: rotate(45deg) scale(1); } to { transform: rotate(45deg) scale(1.8); } }
.topc .pips i.blink { animation: lowpulse .4s ease-in-out infinite alternate; }
.slot.cmd.dim { opacity: .4; }
/* 平時はまわりの札を薄く */
#hud.calm #objectives, #hud.calm .bottom, #hud.calm .topc, #hud.calm #compass, #hud.calm .tr canvas { opacity: .45; transition: opacity .8s; }
#hud #objectives, #hud .bottom, #hud .topc, #hud #compass { transition: opacity .3s; }
/* コントラストを上げる */
#hud.hc .bl, #hud.hc #objectives, #hud.hc .plaque, #hud.hc .topc, #hud.hc .slot { background: rgba(0,0,0,.92); }
#hud.hc { font-weight: 500; }
#hud.hc #subtitle { text-shadow: 0 0 4px #000, 0 0 8px #000, 0 0 12px #000; }
/* 字幕の下地 */
#hud.subbg #subtitle:not(:empty) { background: rgba(8,7,5,.62); padding: 6px 16px; }
/* 任務札：主は大きく、命令は朱の帯 */
#objectives li.main { font-size: 13.5px; }
#objectives li.order { border-right: 3px solid var(--shu); padding-right: 6px; }
#hud.photo > *:not(#vignette) { display: none !important; }
body:has(#hud.photo) #overlay { display: none; }

/* ================= 第4弾（画面） ================= */
.slots { display: flex; gap: 8px; flex-wrap: wrap; }
.slotcard { background: var(--sumi-2); border: 1px solid var(--line); color: var(--washi); padding: 8px 12px; text-align: left; cursor: pointer; display: grid; gap: 2px; min-width: 150px; font-family: var(--ui); }
.slotcard b { font-family: var(--display); font-size: 14px; }
.slotcard small { font-size: 12px; color: var(--washi-dim); line-height: 1.5; }
.slotcard.on { border-color: var(--kin); box-shadow: inset 0 0 0 1px var(--kin); }
.promo-cine { min-height: 100%; display: grid; place-items: center; align-content: center; gap: 14px; text-align: center; padding-block: 30px; }
.promo-cine .pc-lbl { font-size: 13px; letter-spacing: .6em; color: var(--kin); }
.promo-cine .pc-rank { font-family: var(--display); font-weight: 800; font-size: clamp(30px, 6vw, 60px); letter-spacing: .08em; animation: pop .6s ease-out; }
.promo-cine .pc-rank .old { color: var(--washi-faint); font-size: .55em; }
.promo-cine .pc-rank .arrow { color: var(--kin); margin: 0 .3em; font-size: .6em; }
.promo-cine .pc-rank .new { background: linear-gradient(180deg, #fff, #f3d98a 55%, #b88a32); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 3px 8px rgba(0,0,0,.6)); }
.promo-cine .pc-look { display: flex; align-items: center; gap: 12px; justify-content: center; flex-wrap: wrap; }
.promo-cine .pc-look small { display: block; font-size: 12px; color: var(--washi-dim); letter-spacing: .2em; }
.promo-cine .pc-arrow { font-size: 26px; color: var(--kin); }
.promo-cine .pc-unl { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; max-width: 720px; }
.promo-cine .card { border: 1px solid var(--kin); padding: 8px 14px; background: rgba(194,162,90,.08); font-size: 14px; opacity: 0; animation: ln .5s ease-out forwards; }
.promo-cine .card small { display: block; font-size: 12px; letter-spacing: .3em; color: var(--kin); }
.seal { display: inline-grid; place-items: center; width: 18px; height: 18px; margin-right: 8px; border: 1px solid var(--shu); color: var(--shu); font-style: normal; font-family: var(--display); font-size: 12px; letter-spacing: 0; vertical-align: -3px; }
.seal.neg { border-color: var(--washi-faint); color: var(--washi-faint); }
.rec { margin-left: 8px; font-size: 12px; color: var(--sumi); background: var(--kin); padding: 1px 6px; }
.cmap { max-width: 420px; display: block; margin: 6px 0 14px; background: radial-gradient(ellipse at 50% 60%, rgba(111,138,78,.12), transparent 70%); border: 1px solid var(--line); }
.townsky { height: 34px; margin-bottom: 4px; background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 600 34' preserveAspectRatio='none'><path d='M0 34 V22 L20 14 L40 22 V20 L60 12 L80 20 V24 L95 18 L110 24 V16 L135 6 L160 16 V22 L180 14 L200 22 V18 L225 10 L250 18 V24 L265 17 L280 24 V14 L300 4 L320 14 V22 L340 15 L360 22 V19 L385 9 L410 19 V23 L425 16 L440 23 V15 L465 7 L490 15 V22 L510 14 L530 22 V20 L555 11 L580 20 L600 20 V34 Z' fill='%232c2821'/></svg>") no-repeat bottom / 100% 100%; opacity: .9; }
.tabs button svg { width: 15px; height: 15px; vertical-align: -3px; margin-right: 5px; stroke: currentColor; fill: none; stroke-width: 1.6; }
.people .p { display: grid; grid-template-columns: auto 1fr; column-gap: 10px; }
.people .p .pmon { width: 30px; height: 30px; border-radius: 50%; grid-row: span 3; box-shadow: 0 0 0 1px var(--line); }
.people .p p { grid-column: 2; }
.base main > * { animation: ln .35s ease-out; }
.roster .rr[data-who]:hover { background: rgba(236,228,210,.04); }
#loading .ldmon { width: 56px; height: 56px; margin: 0 auto 16px; border-radius: 50%; border: 2px solid var(--kin); border-top-color: transparent; animation: spin 1.1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
#loading .ldbar { width: 240px; height: 3px; background: var(--sumi-3); margin: 14px auto 0; overflow: hidden; position: relative; }
#loading .ldbar i { position: absolute; top: 0; bottom: 0; width: 40%; background: var(--kin); animation: ldbar 1.2s ease-in-out infinite; }
@keyframes ldbar { from { left: -40%; } to { left: 100%; } }

/* ================= 第5弾 ================= */
kbd.cap { display: inline-block; min-width: 1.4em; padding: 0 5px; margin: 0 2px; border: 1px solid rgba(236,228,210,.45); border-bottom-width: 2px; border-radius: 3px; font-family: var(--ui); font-size: .92em; line-height: 1.35; text-align: center; color: #f3e6c4; background: rgba(255,255,255,.04); }
#subtitle .sp.me { color: #f1e9d6; }
#subtitle .sp.grunt { color: var(--washi-dim); }
#subtitle .sp.foe { color: #ff9a86; }
#subtitle .sp.lord { color: var(--kin); }
#crosshair[data-style="cross"] i { width: 14px; height: 2px; margin: -1px 0 0 -7px; border-radius: 0; box-shadow: 0 0 0 1px rgba(0,0,0,.6); }
#crosshair[data-style="cross"] i::after { content: ""; position: absolute; left: 6px; top: -6px; width: 2px; height: 14px; background: inherit; }
#crosshair[data-style="none"] i { opacity: 0; }
#tutorial { position: absolute; left: 20px; top: 36%; width: 220px; padding: 10px 12px; background: var(--lacquer); box-shadow: inset 0 0 0 1px var(--gold-line); font-size: 12.5px; line-height: 1.9; }
#tutorial h5 { margin: 0 0 4px; font-family: var(--display); font-size: 14px; color: var(--kin); letter-spacing: .1em; display: flex; justify-content: space-between; }
#tutorial h5 span { font-family: var(--ui); font-size: 12px; color: var(--washi-dim); }
#tutorial div { display: flex; gap: 8px; align-items: center; }
#tutorial div i { width: 14px; height: 14px; border: 1px solid var(--washi-faint); font-style: normal; font-size: 12px; display: grid; place-items: center; color: var(--kin); }
#tutorial div.done { color: var(--washi-faint); }
#tutorial div.done i { border-color: var(--kin); }
#choice { position: absolute; left: 50%; top: 40%; transform: translateX(-50%); width: min(460px, 90vw); padding: 14px 16px; background: rgba(12,10,8,.9); box-shadow: inset 0 0 0 1px var(--gold-line), 0 0 0 1px #000; }
#choice h5 { margin: 0 0 10px; font-family: var(--display); font-size: 16px; font-weight: 600; color: #f3e6c4; }
#choice .opt { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; padding: 8px 0; border-top: 1px solid var(--line); }
#choice .opt b { font-weight: 500; }
#choice .opt small { grid-column: 2; color: var(--washi-dim); font-size: 12px; }
#choice .tm { height: 2px; background: var(--sumi-3); margin-top: 8px; position: relative; }
#choice .tm i { position: absolute; inset: 0; right: auto; background: var(--kin); }

/* ================= 第5弾（画面） ================= */
.pb { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; font-size: 12px; font-weight: 700; color: #111; font-family: var(--ui); }
.pb-a { background: #6fbf5a; } .pb-b { background: #d9534a; } .pb-x { background: #4f8fd9; } .pb-y { background: #e0b23a; }
.mdiag { display: block; max-width: 360px; margin-top: 10px; border: 1px solid var(--line); }
.sic svg { width: 16px; height: 16px; vertical-align: -3px; margin-right: 6px; stroke: var(--washi-dim); fill: none; stroke-width: 1.5; }
.bossline { font-size: 14px; margin: 6px 0 10px; }
.bossline b { color: var(--kin); font-weight: 500; margin-right: 6px; font-family: var(--display); }
.base.tod-2 { background: linear-gradient(180deg, rgba(160,180,200,.05), transparent 30%); }
.base.tod-1 { background: linear-gradient(180deg, rgba(220,200,150,.05), transparent 30%); }
.base.tod-0 { background: linear-gradient(180deg, rgba(200,120,70,.08), transparent 35%); }
.preview3d.flash { animation: pvflash .6s ease-out; }
@keyframes pvflash { 0% { box-shadow: 0 0 0 0 rgba(194,162,90,.0); } 30% { box-shadow: 0 0 30px 6px rgba(194,162,90,.5); } 100% { box-shadow: 0 0 0 0 rgba(194,162,90,0); } }
.settings .s-row label small { display: block; font-size: 12px; color: var(--washi-faint); margin-top: 2px; line-height: 1.5; }
.st-tabs { margin-bottom: 4px; }
.botpanel { position: fixed; right: 16px; top: 16px; z-index: 50; width: min(520px, 90vw); max-height: 80vh; overflow: auto; background: rgba(12,10,8,.94); border: 1px solid var(--gold-line); padding: 12px 14px; font-size: 12.5px; line-height: 1.7; }
.botpanel pre { white-space: pre-wrap; font-size: 12px; color: var(--washi-dim); }
.debugbar { position: fixed; left: 50%; bottom: 4px; transform: translateX(-50%); z-index: 50; display: flex; gap: 6px; align-items: center; background: rgba(12,10,8,.85); padding: 4px 8px; font-size: 12px; border: 1px solid var(--line); }
.debugbar button { font-size: 12px; background: var(--sumi-2); color: var(--washi); border: 1px solid var(--line); padding: 2px 8px; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--kin); outline-offset: 2px; box-shadow: 0 0 12px rgba(194,162,90,.35); }

/* ================= 第6弾 ================= */
#prompt small { color: var(--washi-dim); margin-left: 4px; }
.holdbar { display: block; height: 3px; margin-top: 4px; background: rgba(0,0,0,.6); position: relative; }
.holdbar b { position: absolute; inset: 0; right: auto; background: var(--kin); }
#vignette.side { animation: vside .7s ease-out; }
@keyframes vside { 0% { background: radial-gradient(circle at var(--hx) var(--hy), rgba(170,20,0,.55), transparent 45%); } 100% { background: radial-gradient(circle at var(--hx) var(--hy), rgba(170,20,0,0), transparent 45%); } }
#hud.no-minimap #minimap, #hud.no-compass #compass, #hud.no-army #armybar, #hud.no-army #situation, #hud.no-squad .topc, #hud.no-bottom .bottom, #hud.no-objectives #objectives { display: none !important; }
body.mincho, body.mincho button, body.mincho .note { font-family: var(--display); }
#objectives li.justdone .tag { animation: jd .8s ease-out; background: var(--kin); color: var(--sumi); }
@keyframes jd { 0% { transform: scale(1.8); } 100% { transform: scale(1); } }
/* 場面の切り替え：墨の帯が画面を掃く */
#wipe { position: fixed; inset: 0; pointer-events: none; z-index: 40; background: linear-gradient(100deg, transparent 0%, rgba(8,7,5,.0) 30%, rgba(8,7,5,.96) 42%, rgba(8,7,5,.96) 58%, rgba(8,7,5,0) 70%, transparent 100%); background-size: 300% 100%; background-position: 100% 0; opacity: 0; }
#wipe.go { animation: wipe .7s ease-in-out; }
@keyframes wipe { 0% { background-position: 100% 0; opacity: 1; } 100% { background-position: 0% 0; opacity: 1; } }
/* 城下の案内 */
.tour { position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,.55); }
.tour .box { position: absolute; box-shadow: 0 8px 28px rgba(0,0,0,.5); }
.tour .box::before { content: ''; position: absolute; top: -7px; left: var(--arrow, 24px); width: 12px; height: 12px; background: var(--sumi-2); border-left: 1px solid var(--kin); border-top: 1px solid var(--kin); transform: rotate(45deg); }
.tour .box { max-width: 420px; background: var(--sumi-2); border: 1px solid var(--kin); padding: 14px 16px; font-size: 14px; line-height: 1.8; }
.tour .box b { font-family: var(--display); color: var(--kin); display: block; margin-bottom: 4px; }
.tourhl { position: relative; z-index: 31; box-shadow: 0 0 0 2px var(--kin), 0 0 24px rgba(194,162,90,.6) !important; background: var(--sumi-2) !important; }
/* 評定 */
.grade { display: inline-grid; place-items: center; min-width: 64px; height: 64px; padding: 0 8px; border: 2px solid var(--shu); color: var(--shu); font-family: var(--display); font-weight: 800; font-size: 26px; transform: rotate(-6deg); float: right; margin-top: -6px; background: rgba(192,69,46,.06); animation: pop .5s ease-out; }
.grade.g-甲上 { border-color: var(--kin); color: var(--kin); }
/* 記録帳・稽古場の結果 */
.records { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; margin: 14px 0; }
.records div { border: 1px solid var(--line); padding: 10px 12px; }
.records b { display: block; font-family: var(--display); font-size: 24px; color: var(--kin); }
.records small { color: var(--washi-dim); font-size: 12px; }
@media (max-width: 900px) { .records { grid-template-columns: repeat(3, 1fr); } }

/* 下地を薄くした分、HUD の字に影を落として読みやすく */
.bl, #objectives, #tutorial, #hint, .topc, .plaque, #squadbox { text-shadow: 0 1px 2px rgba(0,0,0,.75); }
/* 小さな添え字も 11px を下回らない */
.titles small, #prompt small, .objs small, kbd.cap { font-size: max(11px, .92em); }
/* 出世の道：十段の階段 */
.ladder { max-width: 1180px; }
.ld-title { font-family: var(--display); font-size: clamp(28px, 4vw, 40px); letter-spacing: .12em; margin: 8px 0 6px; }
.ld-stair { position: relative; display: grid; grid-template-columns: repeat(10, 1fr); gap: 6px; align-items: end; height: 190px; margin: 22px 0 10px; padding-bottom: 14px; }
.ld-step { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 2px; margin-bottom: calc(var(--i) * 12px); min-height: 72px; padding: 8px 4px 6px; background: linear-gradient(180deg, #2a241c, #1b1813); border: 1px solid var(--line); border-top: 3px solid #3a3226; color: var(--washi-dim); cursor: pointer; transition: transform .15s, border-color .15s, background .15s; font-family: inherit; }
.ld-step .k { font-family: var(--display); font-size: 12px; color: var(--washi-faint); letter-spacing: .1em; }
.ld-step b { font-family: var(--display); font-size: 15px; font-weight: 800; color: var(--washi); letter-spacing: .06em; line-height: 1.25; text-align: center; }
.ld-step small { font-size: 12px; color: var(--washi-faint); text-align: center; }
.ld-step em { position: absolute; top: -12px; right: -4px; font-style: normal; font-size: 12px; font-weight: 700; letter-spacing: .1em; padding: 1px 6px; background: var(--shu); color: #fff6e6; }
.ld-step em.nx { background: none; border: 1px dashed var(--kin); color: var(--kin); }
.ld-step.st-done { border-top-color: var(--kin); background: linear-gradient(180deg, #33291a, #1f1a12); }
.ld-step.st-done b { color: var(--kin); }
.ld-step.st-now { border-color: var(--shu); border-top-color: var(--shu); box-shadow: 0 0 0 1px var(--shu), 0 0 22px rgba(192,69,46,.35); }
.ld-step.st-next { border-style: dashed; border-top-style: solid; border-top-color: var(--kin); }
.ld-step.st-far { opacity: .78; }
.ld-step.beyond { background: repeating-linear-gradient(135deg, #1d1a15 0 6px, #211d17 6px 12px); }
.ld-step.sel { transform: translateY(-6px); border-color: var(--kin); opacity: 1; }
.ld-step.sel::after { content: ''; position: absolute; left: 20%; right: 20%; bottom: -9px; height: 3px; background: var(--kin); }
.ld-step:hover { opacity: 1; border-color: rgba(194,162,90,.6); }
.ld-line { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: var(--line); }
.ld-line i { display: block; height: 100%; background: linear-gradient(90deg, var(--kin), var(--shu)); }
.ld-body { display: grid; grid-template-columns: minmax(280px, 380px) 1fr; gap: 28px; align-items: start; margin-top: 18px; }
.ld-look .preview3d { width: 100%; height: 400px; margin: 0; }
.ld-name { font-family: var(--display); font-size: 34px; font-weight: 800; letter-spacing: .12em; color: var(--washi); }
.ld-name small { display: block; font-size: 13px; color: var(--kin); letter-spacing: .3em; margin-bottom: 2px; }
.ld-cmd { margin: 6px 0 4px; color: var(--washi-dim); font-size: 14px; }
.ld-cmd b { color: var(--washi); font-size: 17px; font-variant-numeric: tabular-nums; }
.ld-cond { display: inline-block; margin: 6px 0 14px; padding: 3px 10px; font-size: 13px; border: 1px solid var(--line); color: var(--washi-dim); }
.ld-cond.st-now { border-color: var(--shu); color: #f0c9b8; }
.ld-cond.st-done { border-color: var(--kin); color: var(--kin); }
.ld-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-bottom: 16px; }
.ld-cols h5 { margin: 0 0 6px; font-size: 12px; letter-spacing: .25em; color: var(--kin); font-weight: 500; }
.ld-cols p { margin: 0; padding: 5px 0; border-bottom: 1px solid var(--line); font-size: 14px; line-height: 1.6; }
@media (max-width: 900px) { .ld-stair { grid-template-columns: repeat(5, 1fr); height: auto; } .ld-step { margin-bottom: 0; } .ld-body { grid-template-columns: 1fr; } .ld-line { display: none; } }
/* 馬屋 */
.stable { display: grid; grid-template-columns: 300px 1fr; gap: 22px; align-items: start; }
.stable .preview3d, .stable-lock .preview3d { width: 300px; height: 300px; }
.stable-lock { display: grid; grid-template-columns: 300px 1fr; gap: 22px; align-items: center; }
.stable-lock .preview3d { filter: grayscale(.8) brightness(.7); }
.st-name { text-align: center; font-family: var(--display); font-size: 24px; letter-spacing: .15em; color: var(--washi); margin: 4px 0 8px; }
.st-name small { display: block; font-family: var(--ui); font-size: 12px; letter-spacing: .1em; color: var(--kin); }
.hstats { display: grid; grid-template-columns: 34px 1fr 34px 1fr 34px 1fr; gap: 4px 6px; align-items: center; margin-top: 6px; font-size: 12px; color: var(--washi-dim); }
.hstats .hb { display: block; height: 5px; background: rgba(0,0,0,.4); border: 1px solid var(--line); }
.hstats .hb b { display: block; height: 100%; background: var(--kin); }
@media (max-width: 900px) { .stable, .stable-lock { grid-template-columns: 1fr; } }
/* 昇進の場面の小さな階段 */
.pc-look .preview3d.wide { width: 340px; height: 300px; }
.pc-ladder { display: flex; gap: 4px; justify-content: center; align-items: flex-end; margin: 4px 0 14px; }
.pc-ladder i { display: block; width: 26px; height: calc(8px + var(--i) * 3px); background: #2c271f; border-top: 2px solid #3a3226; }
.pc-ladder i.done { background: #3a2f1c; border-top-color: var(--kin); }
.pc-ladder i.now { background: var(--shu); border-top-color: #f0c9b8; box-shadow: 0 0 12px rgba(192,69,46,.6); animation: pop .6s ease-out 1s both; }
.pc-ladder-lbl { font-size: 12px; color: var(--washi-dim); letter-spacing: .2em; margin-top: -8px; margin-bottom: 12px; }
/* エンディングの流れる字幕 */
.credits { height: min(34vh, 260px); margin: 10px 0 14px; overflow: hidden; position: relative; mask-image: linear-gradient(transparent, #000 15%, #000 85%, transparent); -webkit-mask-image: linear-gradient(transparent, #000 15%, #000 85%, transparent); }
.credits .roll { position: absolute; left: 0; right: 0; text-align: center; animation: roll 36s linear 5.5s both; line-height: 2.4; font-size: 14px; color: var(--washi-dim); }
.credits .roll b { display: block; font-family: var(--display); font-size: 18px; color: var(--washi); margin-top: 18px; }
@keyframes roll { from { transform: translateY(min(34vh, 260px)); } to { transform: translateY(-100%); } }
/* 写真モード */
#photoui { position: fixed; left: 16px; bottom: 16px; z-index: 20; background: rgba(12,10,8,.7); padding: 8px 12px; font-size: 12px; color: var(--washi-dim); line-height: 1.8; }
#photoui b { color: var(--kin); font-weight: 500; }
.photogrid { position: fixed; inset: 0; pointer-events: none; z-index: 19; background-image: linear-gradient(to right, transparent calc(33.33% - 1px), rgba(255,255,255,.25) 33.33%, transparent calc(33.33% + 1px), transparent calc(66.66% - 1px), rgba(255,255,255,.25) 66.66%, transparent calc(66.66% + 1px)), linear-gradient(to bottom, transparent calc(33.33% - 1px), rgba(255,255,255,.25) 33.33%, transparent calc(33.33% + 1px), transparent calc(66.66% - 1px), rgba(255,255,255,.25) 66.66%, transparent calc(66.66% + 1px)); }
.shot { position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,.85); display: grid; place-items: center; gap: 10px; align-content: center; }
.shot img { max-width: 86vw; max-height: 74vh; border: 1px solid var(--kin); }
.renm { background: none; border: 1px solid var(--line); color: var(--washi-dim); font-size: 12px; min-height: 28px; min-width: 44px; padding: 2px 8px; margin-left: 6px; cursor: pointer; }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition: none !important; } .ledger .ln, .promo { opacity: 1; } }

.jp { position: absolute; inset: 0; display: grid; grid-template-columns: minmax(0, 1fr) 360px; }

.jp-season { position: absolute; left: 16px; top: 14px; z-index: 1; display: flex; align-items: center; gap: 10px; padding: 7px 14px 7px 7px; background: rgba(236,226,202,.92); color: #241c14; box-shadow: 0 0 0 1px rgba(60,45,30,.4), 0 3px 10px rgba(0,0,0,.25); }
.jp-season b { font-family: var(--display); font-size: 26px; width: 44px; height: 44px; display: grid; place-items: center; border-radius: 50%; background: #8e2f1f; color: #f3ead6; }

.jp-tools .btn:hover { background: #241c14; color: var(--washi); }
.jp-legend { position: absolute; left: 16px; bottom: 14px; z-index: 1; display: flex; flex-wrap: wrap; gap: 6px 14px; max-width: calc(100% - 120px); padding: 6px 12px; background: rgba(236,226,202,.9); color: #2a2017; font-size: 12px; box-shadow: 0 0 0 1px rgba(60,45,30,.35); }
.jp-legend .lg { display: inline-block; width: 12px; height: 12px; margin-right: 5px; vertical-align: -2px; border: 1.5px solid #2a2017; box-sizing: border-box; }
.jp-legend .lg.yama { border-radius: 50% 50% 2px 2px; background: rgba(120,98,66,.55); }
.jp-legend .lg.hira { background: rgba(80,110,130,.35); }
.jp-legend .lg.toride { border-style: dashed; border-radius: 50%; }
.jp-legend .lg.hq { border-radius: 50%; border-color: #b8963e; border-width: 2.5px; }
.jp-legend .lg.tgt { border-radius: 50%; border-color: #b8402a; border-style: dashed; border-width: 2px; }
.jp-hint { position: absolute; left: 50%; top: 18px; transform: translateX(-50%); z-index: 1; margin: 0; font-size: 12px; color: #2a2017; background: rgba(236,226,202,.78); padding: 4px 10px; white-space: nowrap; }
.jp-side { overflow-y: auto; padding: 20px 20px 22px; background: linear-gradient(180deg, var(--sumi-2), var(--sumi)); border-left: 1px solid var(--line); }
.jp-when { font-family: var(--display); font-size: 28px; font-weight: 800; letter-spacing: .1em; margin: 6px 0 10px; }
.jp-when span { color: var(--kin); }
.jp-scn { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.jp-scn button { background: transparent; color: var(--washi-dim); border: 1px solid var(--line); padding: 5px 10px; font-size: 12px; letter-spacing: .06em; cursor: pointer; }
.jp-scn button:hover { border-color: var(--washi-dim); color: var(--washi); }
.jp-scn button.on { color: var(--sumi); background: var(--washi); border-color: var(--washi); }
.jp-me { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; padding: 8px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.jp-me b { font-family: var(--display); font-size: 18px; letter-spacing: .08em; }
.jp-me span { font-size: 12px; color: var(--washi-dim); }
.jp .dot { display: inline-block; width: 11px; height: 11px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; box-shadow: 0 0 0 1px rgba(0,0,0,.55), 0 0 0 2px rgba(236,228,210,.25); }
.jp-card { border: 1px solid var(--gold-line); background: rgba(14,11,8,.55); padding: 12px 14px; margin: 12px 0 6px; }
.jp-card .row { margin-top: 10px; }
.jp-cn { margin-bottom: 6px; }
.jp-cn b { font-family: var(--display); font-size: 22px; letter-spacing: .08em; }
.jp-cn small { display: block; font-size: 12px; color: var(--washi-dim); letter-spacing: .06em; }
.jp-kv { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 5px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.jp-kv span { color: var(--washi-dim); white-space: nowrap; }
.jp-kv b { font-weight: 500; text-align: right; }
.jp-nb { display: flex; flex-wrap: wrap; gap: 4px 8px; justify-content: flex-end; }
.jp-link { background: transparent; border: 0; border-bottom: 2px solid var(--c); color: var(--washi); font-size: 13px; padding: 8px 6px 4px; min-height: 32px; min-width: 44px; cursor: pointer; font-family: var(--ui); }
.jp-link:hover { color: var(--kin); }
.jp-h { font-family: var(--display); font-size: 14px; letter-spacing: .14em; color: var(--kin); margin: 16px 0 6px; font-weight: 600; }
.jp-pw { display: grid; grid-template-columns: 118px 1fr 26px; align-items: center; gap: 8px; font-size: 13px; padding: 3px 0; }
.jp-pw .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.jp-pw .bar { height: 8px; background: rgba(236,228,210,.08); }
.jp-pw .bar i { display: block; height: 100%; box-shadow: inset 0 0 0 1px rgba(0,0,0,.3); }
.jp-pw.me .nm { color: var(--kin); font-weight: 700; }
.jp-pw b { text-align: right; font-family: var(--display); font-variant-numeric: tabular-nums; }
.jp-log p { margin: 0; padding: 5px 0; font-size: 13px; line-height: 1.6; border-bottom: 1px solid var(--line); color: var(--washi-dim); }
.jp-log p small { display: inline-block; min-width: 20px; color: var(--washi-faint); font-size: 12px; margin-right: 6px; }

.jp-log p.big { color: var(--washi); font-weight: 700; }

.jp-result { position: absolute; inset: 0; z-index: 2; display: grid; place-items: center; background: rgba(10,9,7,.5); }
.jp-rc { width: min(440px, 90%); box-sizing: border-box; background: var(--sumi-2); border: 1px solid var(--gold-line); padding: 22px 24px; box-shadow: 0 20px 60px rgba(0,0,0,.6); max-height: calc(100% - 16px); overflow-y: auto; }
.jp-rc h3 { font-family: var(--display); font-size: 34px; font-weight: 800; letter-spacing: .14em; margin: 8px 0 10px; }

@media (max-width: 820px) {
  #screen.jp-open { overflow-y: auto; }
  .jp { position: relative; min-height: 100%; grid-template-columns: 1fr; grid-template-rows: 62vh auto; }
  .jp-side { border-left: 0; border-top: 1px solid var(--line); }

/* ================= 第7弾：画面の決まり（docs/ui-guidelines.md。HIG・M3・デジタル庁に合わせる） ================= */
/* 薄い字も墨の地で 4.5:1 を超える明るさに。朱の字は明るい朱で */
:root { --washi-faint: #9a9282; --shu-text: #e38a74; --focus-in: #e9c874; --focus-out: #0b0906; }
.titles small, #prompt small, .objs small, kbd.cap { font-size: max(12px, .92em); }
/* 焦点の輪：金の輪 3px と外の墨の縁（明るい和紙の上でも暗い地でも見える） */
:where(button, [role=button], [role=tab], a, summary, input, select, textarea, canvas[tabindex], [tabindex]):focus-visible,
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, summary:focus-visible {
  outline: 3px solid var(--focus-in) !important; outline-offset: 2px; box-shadow: 0 0 0 6px var(--focus-out) !important; border-radius: 1px;
}
.diffs label:focus-within, .q .scale label:focus-within { outline: 3px solid var(--focus-in); outline-offset: 2px; box-shadow: 0 0 0 6px var(--focus-out); }
.diffs input:focus-visible, .q .scale input:focus-visible { outline: none !important; box-shadow: none !important; }
/* 押せる所は 44px 以上（主な操作は 48px） */
.btn { min-height: 48px; line-height: 1.2; }
.btn.small { min-height: 44px; padding: 10px 16px; }
.btn:active:not(:disabled) { filter: brightness(.88); }
.btn:disabled { opacity: .38; }
.btn.danger { border-color: var(--shu); color: var(--shu-text); }
.btn.danger:hover { background: var(--shu); color: #fff5ea; }
.tabs button { min-height: 44px; }
.tabs button:hover { color: var(--washi); background: rgba(236,228,210,.06); }
.tabs button[aria-selected="true"] { color: var(--washi); }
.tabs .tdot { display: inline-block; margin-left: 6px; padding: 0 5px; font-size: 12px; line-height: 1.5; color: var(--sumi); background: var(--kin); letter-spacing: 0; }
.choices button { min-height: 44px; line-height: 1.5; }
.choices button:active { background: rgba(236,228,210,.1); }
.slotcard { min-height: 52px; }
.slotcard:hover { border-color: var(--washi-dim); }
.slotcard[aria-pressed="true"] b::after { content: '　選択中'; font-family: var(--ui); font-size: 12px; color: var(--kin); letter-spacing: .1em; }
.diffs label { min-height: 44px; box-sizing: border-box; align-content: center; }
.diffs label:hover { border-color: var(--washi-dim); }
.diffs label:has(input:checked) { border-color: var(--kin); box-shadow: inset 0 0 0 1px var(--kin); background: rgba(194,162,90,.07); }
.diffs label small { font-size: 12.5px; line-height: 1.6; }
details > summary { min-height: 44px; display: flex; align-items: center; gap: 6px; list-style: none; }
details > summary::-webkit-details-marker { display: none; }
details > summary::before { content: '▸'; color: var(--kin); transition: transform .15s; }
details[open] > summary::before { transform: rotate(90deg); }
.q .scale label { min-width: 44px; min-height: 44px; box-sizing: border-box; display: inline-flex; align-items: center; justify-content: center; }
.q .scale label:has(input:checked) { border-color: var(--kin); color: var(--washi); }
.keybind button { min-height: 44px; align-items: center; }
.keybind button:hover { border-color: var(--washi-dim); }
.settings .s-row { min-height: 44px; }
.settings select { min-height: 44px; font-size: 14px; }
.settings input[type=checkbox] { width: 22px; height: 22px; }
.settings input[type=range] { min-height: 32px; }
.renm { min-height: 44px; }
.aiji button:focus-visible, .aiji button:hover { border-color: var(--kin); }
.roster .rr[data-who]:hover { background: none; }
/* 注と補足の字（13px・薄すぎない色） */
.note { font-size: 13px; }
#objectives li.fail, .ledger .ln.neg .p, .ev2 .evc.ng .evc-h .p, .ev2 .evc.ng .evc-h .k, .ev2 .evc.ng .evmk { color: var(--shu-text); }
/* 確認の札：何が起きるかを書き、やめる（安全な方）を先に */
.confirm-row { border-color: var(--shu); background: rgba(192,69,46,.07); line-height: 1.7; }
.confirm-row .cf-msg b { color: var(--washi); }
.confirm-row .cf-msg small { display: block; color: var(--washi-dim); font-size: 13px; }
.errbox { border: 1px solid var(--shu); background: rgba(192,69,46,.08); padding: 10px 14px; font-size: 14px; color: var(--washi); }
.errbox::before { content: '！'; display: inline-grid; place-items: center; width: 20px; height: 20px; margin-right: 8px; background: var(--shu); color: #fff5ea; font-weight: 700; font-size: 13px; vertical-align: 1px; }
/* タイトル：主の操作を下の帯に常に見せる */
.title-act { position: sticky; bottom: 0; z-index: 2; margin: 22px calc(50% - 50vw + 8px) 0; padding: 14px calc(50vw - 50% - 8px) 16px; background: linear-gradient(180deg, rgba(20,18,15,0), rgba(20,18,15,.92) 26%); display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
#screen { overflow-x: hidden; }
.title-act .hintk { font-size: 13px; color: var(--washi-dim); margin-left: auto; }
.title-more { margin-top: 12px; }
.title-more .lbl { font-size: 12px; letter-spacing: .2em; color: var(--washi-dim); margin-bottom: 8px; }
/* HUD：字は 12px 以上、状態は色と印で */
#objectives li.order .tag { color: var(--shu-text); }
#radial .rw.locked::after { content: '（まだ）'; font-size: 12px; font-family: var(--ui); }
#objectives li.main { color: #f3e6c4; }
#objectives li.main .tag { color: var(--kin); border-color: var(--gold-line); }
#objectives li.side { color: var(--washi); }
#objectives li.opt, #objectives li.opt .tag { color: var(--washi-dim); }
#objectives li.done .tag::after { content: '済'; margin-left: 2px; }
#objectives li.fail .tag::after { content: '✕'; margin-left: 2px; }
/* 敵将の札は画面の上（戦況の下）。狙いの札はその下へずらし、知らせと重ねない */
#boss { top: calc(118px + env(safe-area-inset-top, 0px)); bottom: auto; }
#hud:has(#boss:not([hidden])) #target { top: calc(166px + env(safe-area-inset-top, 0px)); }
#bark { bottom: calc(196px + env(safe-area-inset-bottom, 0px)); }
#bark .bk { font-size: 16px; }
.slot em, .slot.cmd em { font-size: 12px; color: var(--washi-dim); }
/* 日本地図：＋－などは 44px、筋書きの札も 44px */
.jp-tools .btn { min-width: 44px; min-height: 44px; }
.jp-scn button { min-height: 44px; padding: 8px 12px; font-size: 13px; }
.jp-scn button[aria-pressed="true"] { color: var(--sumi); background: var(--washi); border-color: var(--washi); }
.jp-link { min-height: 44px; }
.jp-hint, .jp-legend { font-size: 13px; }
.jp-hint { left: auto; right: 16px; top: 68px; transform: none; white-space: normal; max-width: 300px; text-align: right; }
.jp-tlist { display: flex; flex-wrap: wrap; gap: 6px 8px; margin-top: 8px; }
/* 動きを減らす：OS の設定でも、ゲームの設定でも。止めた後は中身をすぐ見せる（無限に続く動きは点滅にならないよう止める） */
body.rm *, body.rm *::before, body.rm *::after { animation-delay: 0s !important; animation-iteration-count: 1 !important; }
body.rm #wipe { display: none; }
body.rm .bk, body.rm .objnew, body.rm .toastbox, body.rm .evc, body.rm .ev-big, body.rm .ev-sum, body.rm .ev-actbar, body.rm .ev-more-wrap, body.rm .card, body.rm .pc-say { opacity: 1 !important; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-delay: 0s !important; animation-iteration-count: 1 !important; }
  #wipe { display: none; }
  .toast, .bk, .objnew, .toastbox, .story p, .evc, .ev-big, .ev-sum, .ev-actbar, .ev-more-wrap, .card, .pc-say, .promo { opacity: 1 !important; }
}
/* 幅の狭い画面：上の兵力の帯を左右の札の間に収め、下の札は右へ寄せ、字幕と知らせは左の札を避けて置く */
@media (max-width: 1000px) {
  #armybar { width: calc(100vw - 460px); grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 6px; }
  #armybar .clock { min-width: 64px; padding: 3px 8px; font-size: 19px; }
  #armybar .side .nm { font-size: 14px; }
  #armybar .side canvas { display: none; }
  #compass { width: calc(100vw - 480px); }
  #dateline { white-space: normal; font-size: 12px; }
  .jp-hint { display: none; }
  .bottom { left: auto; right: 16px; transform: none; }
  .slot { width: 50px; height: 50px; }
  .slot.cmd { width: 56px; }
  .slot svg { top: 6px; width: 22px; height: 22px; }
  #subtitle, #bark { left: calc(50vw + 140px); max-width: calc(100vw - 310px); }
  #subtitle { bottom: calc(86px + env(safe-area-inset-bottom, 0px)); }
}
/* 狭い画面（900×600 など） */
@media (max-height: 640px) {
  #boss { top: calc(96px + env(safe-area-inset-top, 0px)); }
  #hud:has(#boss:not([hidden])) #target { top: calc(140px + env(safe-area-inset-top, 0px)); }
  #bark { bottom: calc(204px + env(safe-area-inset-bottom, 0px)); }
  .wrap { padding-block: 28px; }
}

/* ================= 改善 501〜520（戦の中の表示と操作） ================= */
/* 501・502・503 任務札：字は左寄せ、済んだ任務は畳んで「済 n」、進み具合に細い帯 */
#objectives { text-align: left; }
#objectives h4 { text-align: right; }
#objectives li { line-height: 1.45; display: grid; grid-template-columns: auto 1fr; column-gap: 0; align-items: baseline; }
#objectives li .tag { grid-row: 1 / span 3; align-self: start; margin-top: 1px; }
#objectives li small, #objectives li .opb { grid-column: 2; }
#objectives li .opb { display: block; height: 4px; margin: 3px 0 2px; background: rgba(0,0,0,.6); box-shadow: inset 0 0 0 1px rgba(236,228,210,.14); position: relative; }
#objectives li .opb b { position: absolute; inset: 0; right: auto; background: var(--kin); transition: width .4s; }
#objectives li.folded { display: block; margin-top: 6px; padding-top: 4px; border-top: 1px dashed rgba(194,162,90,.3); font-size: 12px; color: var(--washi-dim); text-align: right; letter-spacing: .1em; }
/* 504・505 任務の印：名は墨の下地、距離は薄い字 */
.mk { display: grid; justify-items: center; gap: 1px; }
.mk b { font-weight: 500; font-size: 13px; padding: 1px 7px; background: rgba(12,10,8,.72); box-shadow: inset 0 0 0 1px rgba(194,162,90,.35); line-height: 1.4; }
.mk.red b { box-shadow: inset 0 0 0 1px rgba(227,106,82,.45); }
.mk small { font-size: 12px; color: #efe3c2; text-shadow: 0 1px 2px #000, 0 0 4px #000; font-variant-numeric: tabular-nums; }
/* 507 号令の輪：一つ 100×44、選んだ所は金の塗りと ▶、早打ちの鍵を添える */
#radial::before { left: -220px; top: -220px; width: 440px; height: 440px; background: radial-gradient(circle, rgba(12,10,8,.25) 26%, rgba(12,10,8,.74) 27%, rgba(12,10,8,.74) 70%, transparent 71%); }
#radial .rw { left: -60px; top: -22px; width: 120px; white-space: nowrap; height: 44px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; gap: 4px; font-size: 16px; text-shadow: 0 1px 2px #000; border-radius: 2px; }
/* 号令の名が二行に折れて隣にかからないように（「ついて来い」など） */
#radial .rw, #radial .rw * { white-space: nowrap; }
#radial .rw { left: -66px; width: 132px; }
#radial .rw kbd { font-family: var(--ui); font-size: 12px; color: var(--kin); border: 1px solid var(--gold-line); padding: 0 4px; line-height: 1.4; }
#radial .rw.on { background: rgba(194,162,90,.88); color: #1a140c; border-color: #f3e6c4; text-shadow: none; font-weight: 800; }
#radial .rw.on kbd { color: #1a140c; border-color: rgba(26,20,12,.5); }
#radial .rw .sel { font-size: 12px; }
#radial .rw.locked { flex-direction: column; gap: 0; line-height: 1.2; }
#radial .rc { left: -70px; width: 140px; font-size: 13px; color: #efe3c2; }
/* 508 兵力の帯：減った分を白く残す */
#armybar .gauge s { position: absolute; top: 0; bottom: 0; background: rgba(243,230,196,.75); }
#armybar .a .gauge s { right: 0; }
#armybar .b .gauge s { left: 0; }
/* 510 深手：数字を朱の字で太く */
.bl .bar.hp.deep span, .bl .bar.hp.deep em { color: var(--shu-text, #e38a74); font-weight: 700; }
.bl .bar.hp.deep em { font-size: 13px; }
/* 511 台詞をとばした時の添え書き */
#subtitle .more { display: block; margin-top: 2px; font-size: 12px; color: var(--washi-dim); font-style: normal; }
/* 512 大見出しの間は知らせを控えめに */
#bark .bk { transition: opacity .3s; }
#hud:has(#banner.show) #bark { opacity: .55; }
#hud:has(#banner.show) #bark .bk { font-size: 14px; }
/* 513 戦功の加算は左上の戦功の札のすぐ下。札の数字は一度だけ弾む */
.tl #toasts { position: static; right: auto; top: auto; justify-items: start; gap: 2px; }
.tl .toast { animation-name: toastL; }
@keyframes toastL { 0% { opacity: 0; transform: translateX(-10px); } 8% { opacity: 1; transform: none; } 80% { opacity: 1; } 100% { opacity: 0; } }
.tl .toast b { font-size: 17px; }
#h-merit { display: inline-block; }
#h-merit.bump { animation: mbump .45s ease-out; }
@keyframes mbump { 0% { transform: scale(1); } 30% { transform: scale(1.22); color: #fff3cf; } 100% { transform: scale(1); } }
body.rm #h-merit.bump { animation: none; }
body.rm .tl .toast { opacity: 1 !important; }
/* 515 狙いの札：種類と残り */
#target span { display: inline-flex; align-items: baseline; gap: 6px; font-size: 13px; }
#target span .lk { font-style: normal; font-size: 12px; color: #1a140c; background: #e36a52; padding: 0 5px; }
#target span .kd { font-size: 12px; color: var(--washi-dim); border: 1px solid var(--line); padding: 0 4px; }
#target i.deep b { animation: lowpulse .5s ease-in-out infinite alternate; }
body.ca #target span .lk { background: #ff9a1a; }
#target.locked span { color: #f3e6c4; }
/* 517 戦術マップの凡例と操作（地図の下の札） */
#maphint { bottom: calc(10px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 4px; justify-items: center; padding: 6px 16px; background: rgba(12,10,8,.82); box-shadow: inset 0 0 0 1px var(--gold-line); font-size: 13px; white-space: nowrap; }
#maphint .lg, #maphint .op { display: flex; gap: 16px; }
#maphint .op { color: var(--washi-dim); }
#maphint i { font-style: normal; margin-right: 4px; }
#maphint i.me, #maphint i.sq { color: #f1e9d6; }

#maphint i.ob { color: var(--kin); }
#maphint i.fl { color: #f1e9d6; }
body.ca #maphint i.en { color: #ff9a1a; }
#bigmap { width: min(80vh - 60px, 80vw); height: min(80vh - 60px, 80vw); top: 0; bottom: 60px; }
#maphint { z-index: 2; }
#hud:has(#bigmap:not([hidden])) .bottom, #hud:has(#bigmap:not([hidden])) #subtitle, #hud:has(#bigmap:not([hidden])) #bark, #hud:has(#bigmap:not([hidden])) #markers { visibility: hidden; }
/* 519 方角の帯：まとめた▲の数 */
#compass .c.foe.many span { margin-top: 8px; line-height: 1; }
/* 519 早見表・会話の記録：見出しに閉じる鍵 */
#cheat h5, #sublog h5 { margin: 0 0 6px; display: flex; justify-content: space-between; align-items: baseline; font-family: var(--display); font-size: 14px; font-weight: 600; color: var(--kin); letter-spacing: .1em; }
#cheat h5 span, #sublog h5 span { font-family: var(--ui); font-size: 12px; color: var(--washi-dim); letter-spacing: .02em; }
#cheat, #sublog { font-size: 13px; }
/* 520 下の札：使えない理由を字で */
.slot .why { font-size: 12px; color: #ffcf7a; white-space: nowrap; position: relative; z-index: 1; }
.slot.cmd.dim { opacity: .75; }
.slot.cmd.dim svg { opacity: .45; }
/* 軍勢の UI：部隊の帯（右下）。札を押すか Alt＋数字で号令先を選ぶ。字は 12px 以上、押せる所は 44px 以上 */
#h-units { position: absolute; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; flex-wrap: wrap-reverse; justify-content: flex-end; align-items: flex-end; gap: 8px; pointer-events: auto; }
#h-units .uc { position: relative; width: 72px; height: 104px; box-sizing: border-box; padding: 4px 0 0; display: grid; justify-items: center; align-content: start; gap: 2px; background: rgba(12,10,8,.8); border: 1px solid rgba(0,0,0,.9); box-shadow: inset 0 0 0 1px rgba(194,162,90,.28); color: var(--washi); font: inherit; font-size: 12px; line-height: 1.3; cursor: default; }
#h-units button.uc { cursor: pointer; }
#h-units button.uc:hover { background: rgba(40,34,26,.86); }
#h-units button.uc:active { background: rgba(58,50,38,.9); }
#h-units .uc.on { box-shadow: inset 0 0 0 2px var(--kin), 0 0 0 1px #000; transform: translateY(-4px); }
#h-units .uc.on .nm::before { content: '●'; color: var(--kin); margin-right: 2px; font-size: 12px; }
#h-units .uc.all { width: 52px; align-content: center; }
#h-units .uc.all b { font-family: var(--display); font-size: 24px; color: var(--washi); line-height: 1.1; }
#h-units .face { width: 52px; height: 52px; margin-top: 4px; border-radius: 50%; background-size: cover; background-position: center; box-shadow: 0 0 0 1px #000; transition: transform .6s; }

/* 号令の輪：いまの号令「今」、使えない理由、号令先の隊の札 */
#radial .rw.locked::after { content: none; }
